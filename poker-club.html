  const applyStacks = applyStacksEl ? applyStacksEl.checked : false;

  let winningsMap = {};
  if(handFlow.sidePotWinnings){
    winningsMap = handFlow.sidePotWinnings;
  } else if(winners.length){
    const actualPot = potTotal();
    const share = actualPot / winners.length;
    winners.forEach(pid => winningsMap[pid] = share);
  }

  const projectedStacks = projectedStacksAfterPot(winningsMap);
  let sevenDeuceResult = handFlow.sevenDeucePreview || null;
  if(!sevenDeuceResult && s.sevenDeuceGame && s.type==='cash'){
    const sdWinner = Object.keys(winningsMap).find(pid => winningsMap[pid] > 0.0001 && isSevenDeuce(handFlow.holeCards[pid]));
    if(sdWinner) sevenDeuceResult = computeSevenDeuceBounty(s, sdWinner, projectedStacks);
  }

  if(applyStacks){
    handFlow.seats.forEach(pid => {
      const participant = s.participants.find(x => x.playerId === pid);
      if(!participant) return;
      let finalStack = projectedStacks[pid] || 0;
      if(sevenDeuceResult){
        if(pid === sevenDeuceResult.winnerId) finalStack += sevenDeuceResult.total;
        else if(sevenDeuceResult.payments[pid] != null) finalStack -= sevenDeuceResult.payments[pid];
      }
      participant.chipCount = Math.round(finalStack * 100) / 100;
    });
  }

  Object.assign(h, {
    dealerPlayerId: handFlow.dealerId, sbPlayerId: handFlow.sbId, bbPlayerId: handFlow.bbId, seats: handFlow.seats.slice(),
    actions: handFlow.actions, board: handFlow.board.slice(), holeCards: {...handFlow.holeCards},
    winners, potSize: potSize || null, story, tags, winnings: {...winningsMap}, sevenDeuce: sevenDeuceResult,
    contributions: {...handFlow.totalContrib}, startStacks: {...handFlow.startStacks},
    skipped: false, uncontested: !!handFlow.uncontestedWinner, allInRunout: !!handFlow.allInRunout,
    retroactive: true, stacksApplied: applyStacks
  });

  handFlow = retroactiveHandContext ? retroactiveHandContext.savedHandFlow : null;
  retroactiveHandContext = null;
  await saveClubData();
  showToast(applyStacks ? '✓ Hand nachträglich erfasst, Stacks aktualisiert' : '✓ Hand nachträglich erfasst (Stacks unverändert)');
  render();
}


let sessionReplayStepIndex = 0;
function sessionReplayHandsList(s){
  return currentClub.hands.filter(h => h.sessionId===s.id).sort((a,b) => a.handNumber - b.handNumber);
}
function renderSessionReplayTable(s){
  const hands = sessionReplayHandsList(s);
  if(!hands.length){
    return `<div class="panel"><div class="empty-state"><strong>${t('session_is_closed')}</strong></div><p class="lede">Keine Hände in dieser Session erfasst.</p></div>`;
  }
  if(sessionReplayHandIndex > hands.length-1) sessionReplayHandIndex = hands.length-1;
  if(sessionReplayHandIndex < 0) sessionReplayHandIndex = 0;
  const h = hands[sessionReplayHandIndex];
  const seats = h.seats || Object.keys(h.contributions || h.holeCards || {});
  const isPlayable = !h.skipped && seats.length >= 2;

  let bodyHtml;
  if(isPlayable){
    const timeline = buildReplayTimeline(s, h);
    if(sessionReplayStepIndex > timeline.length-1) sessionReplayStepIndex = timeline.length-1;
    if(sessionReplayStepIndex < 0) sessionReplayStepIndex = 0;
    bodyHtml = replayTableInnerHtml(s, h, seats, timeline, sessionReplayStepIndex, 'sessionReplayStep');
  } else {
    sessionReplayStepIndex = 0;
    bodyHtml = `
      <div class="poker-table-oval" style="${tableFeltStyleAttr()}display:flex;align-items:center;justify-content:center;">
        <div style="color:#D9D4C4;font-weight:700;font-size:18px;">Unregistrierte Hand</div>
      </div>
      <div style="text-align:center;color:#fff;font-weight:600;margin-top:14px;min-height:20px;">Diese Hand wurde übersprungen oder nicht vollständig erfasst.</div>`;
  }

  return `
    <div class="panel" style="background:var(--felt-dark);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <h3 style="color:#fff;margin:0;">🎬 Session-Replay — ${t('label_hand_number',{n:h.handNumber})}</h3>
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="btn-text" style="color:#fff;" onclick="sessionReplayChangeHand(-1)" ${sessionReplayHandIndex===0?'disabled':''}>◀◀ Vorherige Hand</button>
          <span style="color:#D9D4C4;font-size:12.5px;">Hand ${sessionReplayHandIndex+1} / ${hands.length}</span>
          <button class="btn-text" style="color:#fff;" onclick="sessionReplayChangeHand(1)" ${sessionReplayHandIndex>=hands.length-1?'disabled':''}>Nächste Hand ▶▶</button>
        </div>
      </div>
      ${bodyHtml}
    </div>`;
}
function sessionReplayChangeHand(delta){
  stopReplayPlay();
  sessionReplayHandIndex += delta;
  sessionReplayStepIndex = 0;
  render();
}
function sessionReplayStep(delta){
  const s = getSession(handsSelectedSessionId);
  if(!s) return;
  const hands = sessionReplayHandsList(s);
  const h = hands[sessionReplayHandIndex];
  if(!h) return;
  const timeline = buildReplayTimeline(s, h);
  sessionReplayStepIndex = Math.max(0, Math.min(timeline.length-1, sessionReplayStepIndex+delta));
  render();
}
let replayState = null;
let replayPlayIntervalId = null;
let replayPlayingFn = null;
let replayPlaySpeedMs = 1000;
const REPLAY_SPEED_LEVELS = [2200, 1600, 1000, 600, 350];
function currentReplayStepIndex(stepFnName){
  return stepFnName==='replayStep' ? (replayState ? replayState.stepIndex : 0) : sessionReplayStepIndex;
}
function currentReplayTimelineLength(stepFnName){
  if(stepFnName==='replayStep'){
    return replayState ? replayState.timeline.length : 0;
  }
  const s = getSession(handsSelectedSessionId);
  if(!s) return 0;
  const hands = sessionReplayHandsList(s);
  const h = hands[sessionReplayHandIndex];
  return h ? buildReplayTimeline(s,h).length : 0;
}
function stopReplayPlay(){
  if(replayPlayIntervalId){ clearInterval(replayPlayIntervalId); replayPlayIntervalId = null; }
  replayPlayingFn = null;
}
function startReplayPlay(stepFnName){
  stopReplayPlay();
  replayPlayingFn = stepFnName;
  replayPlayIntervalId = setInterval(() => {
    const idx = currentReplayStepIndex(stepFnName);
    const len = currentReplayTimelineLength(stepFnName);
    if(idx >= len-1){ stopReplayPlay(); window[stepFnName](0); return; }
    window[stepFnName](1);
  }, replayPlaySpeedMs);
}
function toggleReplayPlay(stepFnName){
  if(replayPlayIntervalId && replayPlayingFn===stepFnName){
    stopReplayPlay();
    window[stepFnName](0);
  } else {
    startReplayPlay(stepFnName);
    window[stepFnName](0);
  }
}
function setReplayPlaySpeed(level, stepFnName){
  replayPlaySpeedMs = REPLAY_SPEED_LEVELS[Number(level)-1] || 1000;
  if(replayPlayIntervalId) startReplayPlay(stepFnName);
}
function restartReplay(stepFnName){
  stopReplayPlay();
  if(stepFnName==='replayStep'){
    if(replayState) replayState.stepIndex = 0;
    renderReplayModal();
  } else {
    sessionReplayStepIndex = 0;
    render();
  }
}
function buildReplayTimeline(s, h){
  const timeline = [];
  if(h.sbPlayerId) timeline.push({ type:'blind', playerId:h.sbPlayerId, label:'SB' });
  if(h.bbPlayerId) timeline.push({ type:'blind', playerId:h.bbPlayerId, label:'BB' });
  const streets = ['preflop','flop','turn','river'];
  const board = h.board || [];
  const cardSlices = { preflop:[], flop: board.slice(0,3), turn: board[3]?[board[3]]:[], river: board[4]?[board[4]]:[] };
  streets.forEach(st => {
    if(cardSlices[st].length) timeline.push({ type:'board', street:st, cards:cardSlices[st] });
    ((h.actions&&h.actions[st])||[]).forEach(a => timeline.push({ type:'action', street:st, playerId:a.playerId, action:a.action, amount:a.amount }));
  });
  if(h.holeCards && Object.keys(h.holeCards).some(pid => h.holeCards[pid] && h.holeCards[pid].length===2)){
    timeline.push({ type:'showdown' });
  }
  timeline.push({ type:'result' });
  return timeline;
}
function replayStateAt(s, h, seats, timeline, uptoIndex){
  const state = { folded:new Set(), streetContrib:{}, totalContrib:{}, board:[], street:'preflop', lastActorId:null, lastAction:null };
  seats.forEach(pid => { state.streetContrib[pid]=0; state.totalContrib[pid]=0; });
  let lastActionIdx = -1;
  timeline.forEach((ev,i) => { if(ev.type==='action') lastActionIdx = i; });
  for(let i=0;i<=uptoIndex;i++){
    const ev = timeline[i];
    if(!ev) continue;
    if(ev.type==='blind'){
      const amt = ev.label==='SB' ? Number(s.sb||0) : Number(s.bb||0);
      const old = state.streetContrib[ev.playerId]||0;
      state.streetContrib[ev.playerId] = amt;
      state.totalContrib[ev.playerId] = (state.totalContrib[ev.playerId]||0) + (amt-old);
    } else if(ev.type==='board'){
      state.board = state.board.concat(ev.cards);
      state.street = ev.street;
      seats.forEach(pid => { state.streetContrib[pid]=0; });
    } else if(ev.type==='action'){
      state.street = ev.street;
      state.lastActorId = ev.playerId;
      state.lastAction = ev.action;
      if(ev.action==='fold'){ state.folded.add(ev.playerId); }
      else if(ev.amount!=null){
        const old = state.streetContrib[ev.playerId]||0;
        state.streetContrib[ev.playerId] = ev.amount;
        state.totalContrib[ev.playerId] = (state.totalContrib[ev.playerId]||0) + (ev.amount-old);
      }
    } else if(ev.type==='showdown'){
      state.street = 'showdown';
      state.lastActorId = null;
    } else if(ev.type==='result'){
      state.street = 'result';
      state.lastActorId = null;
    }
  }
  /* Once the all-in action has fully resolved, the uncalled excess of the biggest
     stack is returned immediately — same rule as the live table, so the pot shown
     during the runout (and at showdown) matches what actually happened. */
  if(h.allInRunout && uptoIndex >= lastActionIdx){
    peelUncalledExcess(state.totalContrib, state.streetContrib);
  }
  return state;
}
function openHandReplayModal(sessionId, handId){
  stopReplayPlay();
  const s = getSession(sessionId);
  const h = currentClub.hands.find(x => x.id === handId);
  if(!h || h.skipped){ return; }
  const seats = h.seats || Object.keys(h.contributions || h.holeCards || {});
  if(seats.length < 2){ showToast('Für diese Hand fehlen Sitzplatz-Daten für ein Replay.'); return; }
  replayState = { sessionId, handId, seats, timeline: buildReplayTimeline(s, h), stepIndex: 0 };
  renderReplayModal();
}
function replayStep(delta){
  if(!replayState) return;
  replayState.stepIndex = Math.max(0, Math.min(replayState.timeline.length-1, replayState.stepIndex+delta));
  renderReplayModal();
}
function closeReplay(){ stopReplayPlay(); replayState = null; closeModal(); }
function actionBadgeColor(action){
  if(!action) return '#777';
  if(action==='fold') return 'var(--red)';
  if(action==='check') return '#6B7280';
  if(action==='call') return 'var(--blue)';
  return 'var(--brass)';
}
function replayTableInnerHtml(s, h, seats, timeline, stepIndex, stepFnName){
  const state = replayStateAt(s, h, seats, timeline, stepIndex);
  const dIdx = h.dealerPlayerId ? seats.indexOf(h.dealerPlayerId) : 0;

  const maxAssigned = Math.max(-1, ...seats.map(pid => assign[pid]!=null ? assign[pid] : -1));

  };
  const slotFor = (pid, i) => allPositions[slotIdxFor(pid, i)];

    const remainingStack = h.startStacks && h.startStacks[pid]!=null ? (h.startStacks[pid] - (state.totalContrib[pid]||0)) : null;
    const useAbsoluteBox = pos.boxX != null && pos.boxY != null;

    const useAbsoluteStack = pos.stackX != null && pos.stackY != null;
    const nameInnerHtml = `<div class="seat-name" style="color:${pos.textColor};transform:scale(${pos.nameScale});transform-origin:center;">${escapeHtml(fullName(pl))}</div>`;

    // Aufgedeckte Hole-Cards beim Showdown: gleicher Anker (-55%) wie im Live-Tisch beim Showdown.
    const standaloneHoleCardsHtml = cards ? `<div class="seat-holecards${pos.holeCardsCompact?' compact':''}" style="position:absolute;left:${pos.holeCardsX}%;top:${pos.holeCardsY}%;transform:translate(-50%,-55%) scale(${pos.holeCardsScale});z-index:${pos.zHoleCards!=null?pos.zHoleCards:3};">${cards.map(cardChipHtml).join('')}</div>` : '';
    const seatAttrsRp = seatDataAttrs(slotIdxFor(pid, i), allPositions.viewMeta, mySlotRp, pid);
    const platePlateHtml = `
        <div class="seat-plate" ${seatAttrsRp} style="${seatPlateBgStyleAttr(pos, useAbsoluteBox)}">

    const actionBadgeHtml = (isActor && state.lastAction) ? `<div style="position:absolute;left:${pos.left}%;top:${pos.top}%;transform:translate(-50%,0);margin-top:3.2cqw;z-index:7;"><div class="action-badge" style="background:${actionBadgeColor(state.lastAction)};">${state.lastAction.toUpperCase()}</div></div>` : '';

  }).join('')
  + seats.map((pid,i) => betLineChipHtml(slotFor(pid, i), state.streetContrib[pid]||0, chipProfileForReplay, s)).join('');

      const winningsMap = h.winnings || h.runTotals || {};

function openHandHistoryModal(sessionId, handId){
 try{
  const s = getSession(sessionId);
  const h = currentClub.hands.find(x => x.id === handId);
  if(!h) return;
  const dealerP = h.dealerPlayerId ? getPlayer(h.dealerPlayerId) : null;
  const sbP = h.sbPlayerId ? getPlayer(h.sbPlayerId) : null;
  const bbP = h.bbPlayerId ? getPlayer(h.bbPlayerId) : null;
  const winnersNames = (h.winners||[]).map(pid => { const pl = getPlayer(pid); return pl ? fullName(pl) : '?'; }).join(', ');
  const streets = ['preflop','flop','turn','river'];
  const streetNames = {preflop:'Preflop', flop:'Flop', turn:'Turn', river:'River'};
  const board = h.board || [];
  const cardSlices = { preflop:[], flop: board.slice(0,3), turn: board[3]?[board[3]]:[], river: board[4]?[board[4]]:[] };

  let logHtml = '';
  const revealedH = h.holeCards && Object.keys(h.holeCards).filter(pid => h.holeCards[pid] && h.holeCards[pid].length===2) || [];
  const showdownBlockH = revealedH.length ? (
    `<div class="hand-log-street">Showdown</div>` +
    revealedH.map(pid => { const pl=getPlayer(pid); return pl ? `<div class="hand-log-entry"><span class="who">${escapeHtml(fullName(pl))}</span><span class="act">${h.holeCards[pid].map(cardChipHtml).join(' ')}</span></div>` : ''; }).join('')
  ) : '';
  let lastActionIdxH = -1;
  streets.forEach((st,i) => { if(((h.actions&&h.actions[st])||[]).length) lastActionIdxH = i; });
  const wasAllInH = !!h.allInRunout;

  streets.forEach((st,i) => {
    const acts = (h.actions && h.actions[st]) || [];
    const cardsForStreet = cardSlices[st];
    if(!acts.length && !cardsForStreet.length) return;
    logHtml += `<div class="hand-log-street">${streetNames[st]}${cardsForStreet.length ? ' — ' + cardsForStreet.map(cardChipHtml).join(' ') : ''}</div>`;
    if(acts.length){
      acts.forEach(a => {
        const pl = getPlayer(a.playerId);
        const label = actionVerb(a.action) + (a.amount!=null ? ' ' + fmtChip(a.amount, s) : '');
        logHtml += `<div class="hand-log-entry"><span class="who">${pl?escapeHtml(fullName(pl)):'?'}</span><span class="act ${a.action==='fold'?'fold':''}">${label}</span></div>`;
      });
    } else if(st!=='preflop'){
      logHtml += `<div class="hand-log-entry" style="color:var(--ink-soft);">Keine Aktion (All-in)</div>`;
    }
    if(wasAllInH && i===lastActionIdxH) logHtml += showdownBlockH;
  });
  if(!wasAllInH) logHtml += showdownBlockH;

  const winningsMapH = h.winnings || h.runTotals || {};
  const seatIdsH = h.contributions ? Object.keys(h.contributions) : (h.holeCards ? Object.keys(h.holeCards) : []);
  const resultDetailHtml = !h.runs ? `
    <div style="margin-top:14px;border-top:1px solid var(--paper-line);padding-top:12px;">
      <div style="font-weight:700;margin-bottom:6px;">Ergebnis</div>
      ${revealedH.length ? handResultLinesHtml(revealedH, h.board||[], winningsMapH, h.holeCards) : ''}
      ${netResultLinesHtml(seatIdsH, h.contributions||{}, winningsMapH, h.sevenDeuce)}
    </div>` : '';

  const holeCardsHtml = '';
  const runsPlayers = h.holeCards ? Object.keys(h.holeCards).filter(pid => h.holeCards[pid] && h.holeCards[pid].length===2) : [];
  const runsHtml = h.runs && h.runs.length ? `
    <div style="margin-top:14px;border-top:1px solid var(--paper-line);padding-top:12px;">
      <div style="font-weight:700;margin-bottom:8px;">Run it ${h.runCount}x</div>
      ${h.runs.map(r => `
        <div style="margin-bottom:14px;">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">Run ${r.run+1}: ${r.board.map(cardChipHtml).join('')}</div>
          ${handResultLinesHtml(runsPlayers, r.board, r.winnings, h.holeCards)}
        </div>`).join('')}
      <div style="margin-top:8px;border-top:1px solid var(--paper-line);padding-top:10px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;">Gesamt über alle Läufe</div>
        ${netResultLinesHtml(seatIdsH, h.contributions||{}, h.runTotals||{}, h.sevenDeuce)}
      </div>
    </div>` : '';

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:480px;">
        <h2>${t('label_hand_number',{n:h.handNumber})}</h2>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">
          ${dealerP ? `Button: ${escapeHtml(fullName(dealerP))}` : ''}${sbP ? ` · SB: ${escapeHtml(fullName(sbP))}` : ''}${bbP ? ` · BB: ${escapeHtml(fullName(bbP))}` : ''}
        </div>
        <div class="hand-log">${logHtml || `<div class="hand-log-entry" style="color:var(--ink-soft);">—</div>`}</div>
        ${holeCardsHtml}
        ${runsHtml}
        ${resultDetailHtml}
        ${h.sevenDeuce ? (() => { const wp = getPlayer(h.sevenDeuce.winnerId); return `<div class="status-banner ok" style="margin-top:14px;background:#FFF7E8;border-color:#F0DBA0;color:#8A6A0A;">🐍 7-2 Game! ${wp?escapeHtml(fullName(wp)):'?'} gewinnt mit 7-2 und kassiert ${fmtChip(h.sevenDeuce.total, s)}.</div>`; })() : ''}
        <div style="margin-top:14px;font-weight:600;">${t('label_winners')}: ${winnersNames || '—'}${h.potSize ? ' · ' + t('label_pot_size') + ': ' + fmtChip(h.potSize, s) : ''}</div>
        ${h.story ? `<p class="lede" style="margin-top:8px;margin-bottom:0;">${escapeHtml(h.story)}</p>` : ''}
        <div style="margin-top:12px;">
          <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">${t('label_tags_optional')}</div>
          <div id="hh-tags" style="display:flex;gap:6px;flex-wrap:wrap;">
            ${allHandTags().map(tag => `<button type="button" class="pill hh-tag ${((h.tags||[]).includes(tag))?'active':''}" data-tag="${tag}" ${canWrite()?`onclick="this.classList.toggle('active')"`:'disabled'}>${tagLabel(tag)}</button>`).join('')}
          </div>
        </div>
        <div class="modal-actions" style="justify-content:space-between;">
          ${canWrite() ? `<button class="btn-text" style="color:var(--red);" onclick="deleteHand('${sessionId}','${h.id}')">🗑️ Hand löschen</button>` : '<div></div>'}
          <div style="display:flex;gap:10px;">
            <button class="btn btn-secondary" onclick="closeModal()">${t('btn_cancel')}</button>
            ${canWrite() ? `<button class="btn btn-primary" onclick="saveHandTagsAndClose('${h.id}')">Tags aktualisieren</button>` : ''}
          </div>
        </div>
      </div>
    </div>`;
 } catch(e){
   console.error('openHandHistoryModal failed', e);
   document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>⚠️ Fehler</h2>
        <p class="lede">Die Hand-Historie konnte nicht angezeigt werden: ${escapeHtml(e.message)}</p>
        <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">${t('btn_cancel')}</button></div>
      </div>
    </div>`;
 }
}
async function saveHandTagsAndClose(handId){
  if(!canWrite()) return;
  const h = currentClub.hands.find(x => x.id === handId);
  if(!h) return;
  h.tags = Array.from(document.querySelectorAll('.hh-tag.active')).map(el => el.dataset.tag);
  await saveClubData();
  closeModal();
  render();
}

// layoutTemplates ist ab jetzt KEINE eigene Datenquelle mehr, sondern wird beim Betreten eines Clubs
// (enterClubUI) auf currentClub.tableLayouts gesetzt (gleiche Array-Referenz) — Lesen/Schreiben läuft
// also transparent über saveClubData(), genau wie bei players/sessions/customAvatars etc.
// legacyLayoutTemplates/loadLegacyLayoutTemplates() bleiben NUR noch für die einmalige Übernahme
// alter, vor dieser Umstellung global (app-weit, ohne club_id) gespeicherter Layouts bestehen.
let layoutTemplates = [];
let legacyLayoutTemplates = [];
async function loadLegacyLayoutTemplates(){
  // Jedes Layout wird unter einem EIGENEN Speicher-Schlüssel abgelegt (layout-template:<id>), nicht
  // mehr alle zusammen in einem einzigen Feld — sonst teilen sich z.B. 5 verschiedene Tisch-Themes
  // (Dracula, Weltraum, ...) EIN gemeinsames 5MB-Limit, was schnell zu Speicherfehlern führt, auch
  // wenn jedes einzelne Layout für sich genommen unproblematisch wäre.
  let ids = null;
  try{
    const idx = await window.storage.get('layout-templates-index', false);
    ids = idx && idx.value ? JSON.parse(idx.value) : null;
  } catch(e){
    // Schlägt NUR das Lesen des Index fehl (z.B. ein einmaliger Speicher-Aussetzer), heisst das NICHT
    // "keine Layouts vorhanden" — einfach weiter zu den Rückfall-Wegen unten, statt aufzugeben und
    // die Anzeige leer zu lassen.
    console.error('layout-templates-index load failed, versuche Rückfall-Wege', e);
  }
  if(ids){
    const loaded = await Promise.all(ids.map(async id => {
      try{
        const r = await window.storage.get('layout-template:' + id, false);
        return r && r.value ? JSON.parse(r.value) : null;
      } catch(e){ console.error('layout load failed for', id, e); return null; }
    }));
    const found = loaded.filter(Boolean);
    if(found.length){ legacyLayoutTemplates = found; return; }
    // Index verwies auf Layouts, aber KEINS liess sich tatsächlich laden -> nicht aufgeben, sondern
    // ebenfalls die Rückfall-Wege unten versuchen, statt mit einer leeren Liste abzubrechen.
  }
  // Rückwärtskompatibel: altes gemeinsames Feld noch vorhanden (vor der Umstellung auf das
  // Pro-Layout-Format, lange vor der club_data-Umstellung) -> nur noch lesen, NICHT mehr
  // zurückschreiben — das war früher nötig, ist aber seit der Umstellung auf currentClub.tableLayouts
  // hinfällig (enterClubUI() übernimmt das Gefundene einmalig ins jeweilige club_data).
  try{
    const legacy = await window.storage.get('layout-templates', false);
    if(legacy && legacy.value){
      legacyLayoutTemplates = JSON.parse(legacy.value);
      return;
    }
  } catch(e){
    console.error('legacy layout-templates load failed, versuche letzten Rückfall-Weg', e);
  }
  // Letzter Rückfall-Weg: weder Index noch altes gemeinsames Feld waren lesbar/vorhanden — direkt
  // alle "layout-template:*"-Schlüssel auflisten und einzeln laden. Das findet Layouts auch dann,
  // wenn ausgerechnet der Index (nicht aber die einzelnen Layouts selbst) beschädigt oder unlesbar ist.
  try{
    const list = await window.storage.list('layout-template:', false);
    const keys = list && list.keys ? list.keys : [];
    if(keys.length){
      const loaded = await Promise.all(keys.map(async key => {
        try{
          const r = await window.storage.get(key, false);
          return r && r.value ? JSON.parse(r.value) : null;
        } catch(e){ return null; }
      }));
      legacyLayoutTemplates = loaded.filter(Boolean);
    }
  } catch(e){
    console.error('list-basierter Rückfall-Weg ebenfalls fehlgeschlagen', e);
  }
}

function getStandardSeatCountForSession(sessionId){
  if(!sessionId) return 10;
  if(tableSettings.sessionStandardSeatCount && tableSettings.sessionStandardSeatCount[sessionId] != null) return tableSettings.sessionStandardSeatCount[sessionId];

function resolveTotalSlots(s){
  const layout = getActiveLayout(s.id);
  const base = layout ? layout.seatCount : getStandardSeatCountForSession(s.id);
  // Sicherheitsnetz: die Sitzanzahl darf NIE kleiner sein als die Anzahl der bereits aktiv sitzenden Spieler —
  // sonst blockiert eine zu klein gewählte Tischgrösse (z.B. "Heads-up") das Hinzufügen weiterer Spieler,
  // obwohl schon mehr Leute an der Session teilnehmen.
  const activeCount = activeSeatOrderRaw(s).length;
  return Math.max(base, activeCount);
}
function getActiveLayout(sessionId){
  // Zentrale Auflösung: explizit übergebene Session-ID zuerst, dann eine laufende Hand, zuletzt die
  // gerade im Hände-Tab ausgewählte Session — so liefert diese Funktion in JEDEM Kontext (laufende
  // Hand, Tisch bearbeiten, Vorschau) garantiert dasselbe Layout für dieselbe Session, ohne dass jede
  // aufrufende Stelle das selbst absichern müsste.
  const sid = sessionId || (handFlow ? handFlow.sessionId : null) || (typeof handsSelectedSessionId!=='undefined' ? handsSelectedSessionId : null);
  if(!sid) return null;
  const layoutId = tableSettings.sessionLayoutMap ? tableSettings.sessionLayoutMap[sid] : null;
  if(!layoutId) return null;
  return layoutTemplates.find(l => l.id === layoutId) || null;
}

function defaultSeatSlot(x, y){
  return { x, y, avatarScale:1, boxScale:1, nameScale:1, stackScale:1, chipX:x, chipY:y+14 };
}
function defaultClusterOffsets(){
  // "Lego-Baustein": Position von Avatar/Sitzgrafik/Name/Stack/Holecards relativ zu einem unsichtbaren
  // Sitz-Anker (Prozentpunkte des Tisches). Wird EINMAL im Detail-Editor festgelegt und gilt für alle
  // Sitzplätze gleich. Bet-Chips sind bewusst NICHT Teil davon — sie haben keine feste Beziehung zum
  // Spieler und bleiben pro Sitz frei positionierbar.
  return { avatarDX:0, avatarDY:0, boxDX:0, boxDY:14, nameDX:0, nameDY:-16, stackDX:0, stackDY:16, holeCardsDX:0, holeCardsDY:-30, posTagDX:0, posTagDY:-38 };
}
function getClusterOffsets(layout){
  // Robust gegen fehlende UND kaputte (NaN) Werte aus früheren Zwischenständen — jedes einzelne
  // Feld wird geprüft und bei Bedarf durch den Standardwert ersetzt, nicht nur bei komplettem Fehlen.
  const defaults = defaultClusterOffsets();
  const stored = layout.clusterOffsets || {};
  const result = {};
  Object.keys(defaults).forEach(key => {
    const v = stored[key];
    result[key] = (typeof v === 'number' && Number.isFinite(v)) ? v : defaults[key];
  });
  return result;
}
function newLayoutTemplateObj(name, seatCount){
  const positions = seatPositions(seatCount);
  return {
    id: uid(), name, seatCount,
    backgroundImage: null, tableImage: null, boxImage: null, tableHidden: false, boxHidden: false, avatarOnTop: true, textColor: '#2A1D0F',
    tableX:50, tableY:52, tableWidth:82, tableHeight:64,
    seats: positions.map(p => defaultSeatSlot(p.left, p.top)),
    clusterOffsets: defaultClusterOffsets(),
    boardX:50, boardY:46, boardScale:1,
    boardCardWScale:1, boardCardHScale:1, holeCardWScale:1, holeCardHScale:1, holeCardsCompact:false,
    potX:50, potY:56
  };
}
async function createLayoutTemplate(name, seatCount){
  const layout = newLayoutTemplateObj(name, seatCount);
  layoutTemplates.push(layout);
  await saveLayoutTemplatesList();
  return layout;
}
async function deleteLayoutTemplate(idx){
  const removed = layoutTemplates[idx];
  layoutTemplates.splice(idx,1);
  if(removed && tableSettings.sessionLayoutMap){
    let changed = false;
    Object.keys(tableSettings.sessionLayoutMap).forEach(sid => {
      if(tableSettings.sessionLayoutMap[sid] === removed.id){ delete tableSettings.sessionLayoutMap[sid]; changed = true; }
    });
    if(changed) await saveTableSettings();
  }
  if(removed) await deleteLayoutTemplateStorage(removed.id);
  await saveLayoutTemplatesList();
  render();
}

function handleTableAssetUpload(input, category){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    openCropModal(e.target.result, null, null, async (dataUrl, isCutout) => {
      tableAssets[category] = tableAssets[category] || [];
      const entry = { id: uid(), name: file.name, image: dataUrl, cutout: !!isCutout };
      if(category === 'chips') entry.value = null;
      tableAssets[category].push(entry);
      await saveTableAssetsList();
      render();
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function editTableAsset(category, id){
  const a = (tableAssets[category]||[]).find(x => x.id === id);
  if(!a) return;
  openCropModal(a.image, null, null, async (newDataUrl, isCutout) => {

    render();
  });

    </div>`;
}
function activateCardDeckTemplate(id){
  if(!isClubAdmin()) return;
  ensureClubDefaults();
  const tpl = currentClub.cardDeckTemplates.find(t => t.id === id);
  if(!tpl) return;
  currentClub.customCardDeck.cards = {};
  currentClub.activeCardDeckTemplateId = tpl.id;
  saveClubData();
  render();
  showToast(`"${tpl.name}" aktiviert.`);
}
function deleteCardDeckTemplate(id){
  if(!isClubAdmin()) return;
  ensureClubDefaults();
  const tpl = currentClub.cardDeckTemplates.find(t => t.id === id);
  if(!tpl) return;
  if(!confirm(`Deck-Vorlage "${tpl.name}" wirklich löschen?`)) return;
  currentClub.cardDeckTemplates = currentClub.cardDeckTemplates.filter(t => t.id !== id);
  if(currentClub.activeCardDeckTemplateId === id) currentClub.activeCardDeckTemplateId = null;
  saveClubData();
  render();
  showToast('Deck-Vorlage gelöscht.');
}
function handleCardBackUpload(input){
  if(!isClubAdmin()) return;
  const file = input.files[0];
  if(!file) return;
  readFileAsDataUrl(file).then(dataUrl => {
    const img = new Image();
    img.onload = () => {
      const outW = 240;
      const outH = Math.max(1, Math.round(outW * (img.naturalHeight/img.naturalWidth)));
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, outW, outH);
      ensureClubDefaults();
      currentClub.customCardDeck.back = canvas.toDataURL('image/jpeg', 0.88);
      saveClubData();
      render();
      showToast('Kartenrückseite gespeichert.');
    };
    img.onerror = () => showToast('Bild konnte nicht geladen werden.');
    img.src = dataUrl;
  }).catch(() => showToast('Datei konnte nicht gelesen werden.'));
  input.value = '';
}
// Wechselt zurück zu den Standardkarten (Farben) — nichts wird gelöscht, Vorlagen bleiben und lassen
// sich jederzeit wieder aktivieren.
function useStandardCardDeck(){
  if(!isClubAdmin()) return;
  ensureClubDefaults();
  const legacy = currentClub.customCardDeck.cards || {};
  // Altbestand ohne Vorlage: zuerst als Vorlage sichern, damit das Deck nicht verloren geht
  if(!currentClub.activeCardDeckTemplateId && Object.keys(legacy).length){
    currentClub.cardDeckTemplates.push({ id: uid(), name: 'Bisheriges Deck', cards: {...legacy} });
  }
  currentClub.customCardDeck.cards = {};
  currentClub.activeCardDeckTemplateId = null;
  saveClubData();
  render();
  showToast('Standardkarten aktiv. Deine Deck-Vorlagen bleiben gespeichert.');
}
function removeCustomCardBack(){
  if(!isClubAdmin()) return;
  ensureClubDefaults();
  currentClub.customCardDeck.back = null;
  saveClubData();
  render();
  showToast('Kartenrückseite entfernt.');
}

  const onBrDown = e => { e.preventDefault(); if(sheetImportState) sheetImportState.dragging = 'br'; };
  tlHandle.addEventListener('mousedown', onTlDown);
  tlHandle.addEventListener('touchstart', onTlDown, {passive:false});

  brHandle.addEventListener('touchstart', onBrDown, {passive:false});
  window.addEventListener('mousemove', onSheetWindowMouseMove);
  window.addEventListener('mouseup', onSheetWindowMouseUp);
  window.addEventListener('touchmove', onSheetWindowTouchMove, {passive:false});

function onSheetWindowMouseMove(e){ sheetContainerPointerMove(e.clientX, e.clientY); }
function onSheetWindowMouseUp(){ sheetContainerPointerUp(); }
function onSheetWindowTouchMove(e){ const touch = e.touches[0]; if(touch){ e.preventDefault(); sheetContainerPointerMove(touch.clientX, touch.clientY); } }
function onSheetWindowTouchEnd(){ sheetContainerPointerUp(); }
function sheetContainerPointerMove(x, y){
  const s = sheetImportState;
  if(!s || !s.dragging) return;
  const container = document.getElementById('sheet-import-container');
  if(!container) return;
  const r = container.getBoundingClientRect();
  let px = (x - r.left) / r.width * 100;
  let py = (y - r.top) / r.height * 100;
  px = Math.max(0, Math.min(100, px));
  py = Math.max(0, Math.min(100, py));
  const MIN = 5;
  if(s.dragging === 'tl'){
    s.rect.left = Math.min(px, s.rect.right - MIN);
    s.rect.top = Math.min(py, s.rect.bottom - MIN);
  } else if(s.dragging === 'br'){
    s.rect.right = Math.max(px, s.rect.left + MIN);
    s.rect.bottom = Math.max(py, s.rect.top + MIN);
  }
  renderSheetOverlayVisuals();
}
function sheetContainerPointerUp(){ if(sheetImportState) sheetImportState.dragging = null; }
function updateSheetGrid(){
  const s = sheetImportState;
  if(!s) return;
  const rowsInput = document.getElementById('sheet-rows');
  const colsInput = document.getElementById('sheet-cols');
  s.rows = Math.max(1, Math.min(20, Number(rowsInput.value) || 1));
  s.cols = Math.max(1, Math.min(20, Number(colsInput.value) || 1));
  const countEl = document.getElementById('sheet-cell-count');
  if(countEl) countEl.textContent = s.rows * s.cols;
  renderSheetOverlayVisuals();
}
function updateSheetRectFromInputs(){
  // Digitale Alternative zum Ziehen an den gelben Griffen — exakt auf 0.1% genau statt "per Hand auf
  // dem Bildschirm treffen". Dieselben MIN-Mindestabstände wie beim Ziehen (sheetContainerPointerMove),
  // damit links/rechts bzw. oben/unten sich nicht überkreuzen können.
  const s = sheetImportState;
  if(!s) return;
  const MIN = 5;
  const leftEl = document.getElementById('sheet-rect-left');
  const topEl = document.getElementById('sheet-rect-top');
  const rightEl = document.getElementById('sheet-rect-right');
  const bottomEl = document.getElementById('sheet-rect-bottom');
  if(!leftEl || !topEl || !rightEl || !bottomEl) return;
  let left = Number(leftEl.value), top = Number(topEl.value), right = Number(rightEl.value), bottom = Number(bottomEl.value);
  if(!Number.isFinite(left)) left = s.rect.left;
  if(!Number.isFinite(top)) top = s.rect.top;
  if(!Number.isFinite(right)) right = s.rect.right;
  if(!Number.isFinite(bottom)) bottom = s.rect.bottom;
  left = Math.max(0, Math.min(100, left));
  top = Math.max(0, Math.min(100, top));
  right = Math.max(0, Math.min(100, right));
  bottom = Math.max(0, Math.min(100, bottom));
  if(right - left < MIN) right = Math.min(100, left + MIN);
  if(bottom - top < MIN) bottom = Math.min(100, top + MIN);
  s.rect = { left, top, right, bottom };
  renderSheetOverlayVisuals();
}
function updateSheetInset(){
  const s = sheetImportState;
  if(!s) return;
  const el = document.getElementById('sheet-inset');
  s.inset = Math.max(0, Math.min(25, Number(el.value) || 0));
  const valEl = document.getElementById('sheet-inset-value');
  if(valEl) valEl.textContent = s.inset;
  renderSheetOverlayVisuals();
}
function snapSheetRectToImageEdges(){
  // Abkürzung für bereits saubere, randlose Raster (z.B. direkt von der KI exportierte Sprite-Sheets):
  // Rechteck einfach auf die ganzen Bildkanten setzen, statt die Griffe von Hand zu ziehen.
  const s = sheetImportState;
  if(!s) return;
  s.rect = { left:0, top:0, right:100, bottom:100 };
  renderSheetOverlayVisuals();
  showToast('Rahmen an Bildrand ausgerichtet — Raster unten prüfen und bei Bedarf feinjustieren.');
}
function renderSheetOverlayVisuals(){
  const s = sheetImportState;
  if(!s) return;
  const tl = document.getElementById('sheet-handle-tl');
  const br = document.getElementById('sheet-handle-br');
  const outline = document.getElementById('sheet-rect-outline');
  if(tl){ tl.style.left = s.rect.left+'%'; tl.style.top = s.rect.top+'%'; }
  if(br){ br.style.left = s.rect.right+'%'; br.style.top = s.rect.bottom+'%'; }
  // Digitale Eingabefelder (links/oben/rechts/unten) mit dem aktuellen Rechteck synchron halten —
  // auch wenn die Änderung gerade vom Ziehen der Griffe oder vom "An Bildrand ausrichten"-Button kam,
  // nicht nur von den Feldern selbst. document.activeElement-Check verhindert, dass ein Feld, in das
  // der Nutzer gerade tippt, während des Tippens überschrieben wird (sonst "springt" der Cursor/Wert).
  const active = document.activeElement;
  const syncField = (id, val) => {
    const el = document.getElementById(id);
    if(el && el !== active) el.value = val.toFixed(1);
  };
  syncField('sheet-rect-left', s.rect.left);
  syncField('sheet-rect-top', s.rect.top);
  syncField('sheet-rect-right', s.rect.right);
  syncField('sheet-rect-bottom', s.rect.bottom);
  if(outline){
    outline.style.left = s.rect.left+'%';
    outline.style.top = s.rect.top+'%';
    outline.style.width = (s.rect.right-s.rect.left)+'%';
    outline.style.height = (s.rect.bottom-s.rect.top)+'%';
  }
  const linesEl = document.getElementById('sheet-grid-lines');
  if(linesEl){
    const w = s.rect.right - s.rect.left, h = s.rect.bottom - s.rect.top;
    let html = '';
    for(let c=1; c<s.cols; c++){
      const x = s.rect.left + (c/s.cols)*w;
      html += `<div style="position:absolute;left:${x}%;top:${s.rect.top}%;width:1px;height:${h}%;background:rgba(255,204,51,.7);"></div>`;
    }
    for(let rI=1; rI<s.rows; rI++){
      const y = s.rect.top + (rI/s.rows)*h;
      html += `<div style="position:absolute;left:${s.rect.left}%;top:${y}%;width:${w}%;height:1px;background:rgba(255,204,51,.7);"></div>`;
    }
    // Zweite, innere Linie pro Zelle = die TATSÄCHLICHE Zuschnittgrenze (nach Anwendung von
    // "Rand einwärts"), separat von der gelben Roh-Raster-Linie oben (die weiterhin exakt auf der
    // Zellgrenze/dem Bildrand liegt). So sieht man live, ob der schwarze Rand/Abstand im Quellbild
    // schon ausserhalb dieser roten Linie liegt — erst dann ist der Zuschnitt wirklich randgenau,
    // ohne dass man das Gesamtrechteck (gelbe Griffe) selbst verschieben müsste.
    const insetPct = s.inset || 0;
    if(insetPct > 0){
      const cellW = w / s.cols, cellH = h / s.rows;
      const insetX = cellW * insetPct/100, insetY = cellH * insetPct/100;
      for(let rI=0; rI<s.rows; rI++){
        for(let c=0; c<s.cols; c++){
          const cellLeft = s.rect.left + c*cellW, cellTop = s.rect.top + rI*cellH;
          const x = cellLeft + insetX, y = cellTop + insetY;
          const ww = cellW - 2*insetX, hh = cellH - 2*insetY;
          html += `<div style="position:absolute;left:${x}%;top:${y}%;width:${ww}%;height:${hh}%;border:1px dashed #ff5050;box-sizing:border-box;pointer-events:none;"></div>`;
        }
      }
    }
    linesEl.innerHTML = html;
  }
  updateSheetPreviewThumbs();
}
// Zentrale Stelle für die Zuschnitt-Geometrie EINER Zelle (in echten Bildpixeln), inkl. "Rand
// einwärts" — von der Live-Vorschau (5 Beispielkarten + Overlay-Linien) UND vom finalen Zuschnitt
// aller Zellen (goToSheetAssignStep) gemeinsam genutzt. So bekommt man beim vollen Zuschnitt
// garantiert exakt das, was die Vorschau vorher gezeigt hat (Kohärenz statt zwei getrennten,
// potenziell leicht abweichenden Berechnungen).
function sheetCellSrcRect(s, rowI, colI){
  const rectPxLeft = s.rect.left/100 * s.naturalW;
  const rectPxTop = s.rect.top/100 * s.naturalH;
  const rectPxW = (s.rect.right - s.rect.left)/100 * s.naturalW;
  const rectPxH = (s.rect.bottom - s.rect.top)/100 * s.naturalH;
  const cellW = rectPxW / s.cols, cellH = rectPxH / s.rows;
  const insetPct = s.inset || 0;
  const insetX = cellW * insetPct/100, insetY = cellH * insetPct/100;
  return {
    sx: rectPxLeft + colI*cellW + insetX,
    sy: rectPxTop + rowI*cellH + insetY,
    sw: cellW - 2*insetX,
    sh: cellH - 2*insetY
  };
}
function updateSheetPreviewThumbs(){
  // Schneidet sofort 5 Beispielzellen (vier Ecken + Mitte) mit dem aktuellen Rechteck/Raster zu und
  // zeigt sie als kleine Vorschau — damit man VOR dem vollen Zuschnitt aller 52 Karten sieht, ob z.B.
  // eine Nachbarkarte reinragt oder ein Rand fehlt, statt das erst nach dem Zuordnen zu bemerken.
  const s = sheetImportState;
  if(!s || !s.imgEl) return;
  const rectPxW = (s.rect.right - s.rect.left)/100 * s.naturalW;
  const rectPxH = (s.rect.bottom - s.rect.top)/100 * s.naturalH;
  if(rectPxW <= 0 || rectPxH <= 0) return;
  const outW = 90;
  const samples = [
    { id:'sheet-preview-tl', r:0, c:0 },
    { id:'sheet-preview-tr', r:0, c:s.cols-1 },
    { id:'sheet-preview-center', r:Math.floor((s.rows-1)/2), c:Math.floor((s.cols-1)/2) },
    { id:'sheet-preview-bl', r:s.rows-1, c:0 },
    { id:'sheet-preview-br', r:s.rows-1, c:s.cols-1 }
  ];
  samples.forEach(sample => {
    const el = document.getElementById(sample.id);
    if(!el) return;
    const { sx, sy, sw, sh } = sheetCellSrcRect(s, sample.r, sample.c);
    if(sw <= 0 || sh <= 0) return;
    const outH = Math.max(1, Math.round(outW * (sh/sw)));
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    try{
      ctx.drawImage(s.imgEl, sx, sy, sw, sh, 0, 0, outW, outH);
      el.style.backgroundImage = `url('${canvas.toDataURL('image/jpeg', 0.85)}')`;
    }catch(e){ /* während des Ziehens kurzzeitig ungültige Masse ignorieren */ }
  });
}
function closeSheetImportOverlay(){
  // Entfernt nur die Overlay-DOM/Listener der Ausricht-Stufe — der Zustand (sheetImportState) bleibt
  // erhalten, weil der Übergang zu Stufe 2 (Zuordnen) ihn noch braucht. Zum endgültigen Abbrechen
  // siehe cancelSheetImport(), das den Zustand zusätzlich zurücksetzt.
  window.removeEventListener('mousemove', onSheetWindowMouseMove);
  window.removeEventListener('mouseup', onSheetWindowMouseUp);
  window.removeEventListener('touchmove', onSheetWindowTouchMove);
  window.removeEventListener('touchend', onSheetWindowTouchEnd);
  const overlay = document.getElementById('sheet-import-overlay');
  if(overlay) overlay.remove();
}
function cancelSheetImport(){ closeSheetImportOverlay(); sheetImportState = null; }
function goToSheetAssignStep(){
  const s = sheetImportState;
  if(!s) return;
  const totalCells = s.rows * s.cols;
  if(totalCells > 104){
    showToast('Zu viele Zellen — bitte Zeilen/Spalten reduzieren.');
    return;
  }
  // Zuschnitt-Geometrie (inkl. "Rand einwärts") kommt aus derselben Funktion wie die Live-Vorschau
  // (sheetCellSrcRect) — garantiert, dass der finale Zuschnitt exakt dem entspricht, was oben in der
  // Ausrichtung schon zu sehen war.
  const first = sheetCellSrcRect(s, 0, 0);
  const outW = 220;
  const outH = Math.max(1, Math.round(outW * (first.sh/first.sw)));
  // s.imgEl ist seit dem Hochladen bereits fertig geladen (siehe handleCardSheetUpload) — kein
  // erneutes Nachladen/Dekodieren eines zweiten Image-Objekts nötig.
  const cellImages = [];
  for(let rI=0; rI<s.rows; rI++){
    for(let cI=0; cI<s.cols; cI++){
      const { sx, sy, sw, sh } = sheetCellSrcRect(s, rI, cI);
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(s.imgEl, sx, sy, sw, sh, 0, 0, outW, outH);
      cellImages.push(canvas.toDataURL('image/jpeg', 0.85));
    }
  }
  s.cellImages = cellImages;
  // Standardzuordnung: Reihenfolge wie im Tipp-Text vorgeschlagen (zuerst nach Farbe, dann Rang),
  // Zelle für Zelle von links nach rechts, oben nach unten — der Nutzer kann das unten anpassen.
  s.assignments = buildDefaultSheetAssignments(cellImages.length, 'suit');
  s.step = 2;
  closeSheetImportOverlay();
  openSheetAssignOverlay();
}
function buildDefaultSheetAssignments(cellCount, order){
  const codes = [];
  if(order === 'rank'){
    for(const r of SHEET_IMPORT_RANKS) for(const su of SHEET_IMPORT_SUITS) codes.push(r+su);
  } else {
    for(const su of SHEET_IMPORT_SUITS) for(const r of SHEET_IMPORT_RANKS) codes.push(r+su);
  }
  const assignments = [];
  for(let i=0; i<cellCount; i++) assignments.push(i < codes.length ? codes[i] : '');
  return assignments;
}

      showToast(`"${code}" ist mehrfach zugeordnet — bitte zuerst korrigieren.`);
      return;

function estimateLayoutSize(lt){
  // Grobe Schätzung der Speichergrösse dieses einen Layouts (Base64-Bilder sind der grösste Anteil).
  try{ return JSON.stringify(lt).length; } catch(e){ return 0; }
}
function formatBytesApprox(chars){
  const kb = chars / 1024;
  if(kb < 1024) return Math.round(kb) + ' KB';
  return (kb/1024).toFixed(1) + ' MB';
}
function loadImageAsync(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}
function recompressImage(img, maxDim, asJpeg, quality){
  let w = img.naturalWidth, h = img.naturalHeight;
  if(w > maxDim || h > maxDim){
    const scale = maxDim / Math.max(w,h);
    w = Math.round(w*scale); h = Math.round(h*scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return asJpeg ? canvas.toDataURL('image/jpeg', quality!=null?quality:0.8) : canvas.toDataURL('image/png');
}
async function repairCurrentEditLayoutImageSize(){
  const layout = currentEditingLayout();
  if(!layout){ showToast('⚠️ Kein aktives Layout gefunden.'); return; }
  const idx = layoutTemplates.findIndex(l => l.id === layout.id);
  if(idx < 0){ showToast('⚠️ Layout nicht in der Liste gefunden.'); return; }
  await repairLayoutImageSize(idx);
}
async function repairLayoutImageSize(idx){
  // Verkleinert NUR die Bilder DIESES EINEN, vom Nutzer bewusst ausgewählten Layouts — rührt kein
  // anderes Layout an. Nützlich für ältere Layouts, deren Bilder vor der automatischen Komprimierung
  // beim Hochladen hochgeladen wurden und die dadurch das Speicherlimit sprengen.
  const layout = layoutTemplates[idx];
  if(!layout){ showToast('⚠️ Layout nicht gefunden.'); return; }
  if(!layout.backgroundImage && !layout.tableImage && !layout.boxImage){
    showToast(`ℹ️ "${layout.name}" hat keine eigenen Hintergrund-/Tisch-/Sitzgrafik-Bilder — hier gibt es nichts zu verkleinern.`);
    return;
  }
  showToast(`⏳ Verkleinere Bilder in "${layout.name}" …`);
  const beforeSize = estimateLayoutSize(layout);
  // Safe-Limit deutlich UNTER dem tatsächlichen 5MB-Speicherlimit, damit auch die restlichen Layout-
  // Daten (Positionen, Farben etc.) noch sicher Platz haben.
  const SAFE_LIMIT = 4 * 1024 * 1024;
  // Mehrstufig: erst moderat verkleinern, und falls das Ergebnis IMMER NOCH zu gross ist, automatisch
  // mit kleineren Massen/niedrigerer Qualität nachlegen — statt nur einen einzigen, evtl. nicht
  // ausreichenden Versuch zu machen.
  const stages = [
    { bgTableMax:1200, bgTableQuality:0.8, boxMax:700 },
    { bgTableMax:900,  bgTableQuality:0.7, boxMax:500 },
    { bgTableMax:650,  bgTableQuality:0.6, boxMax:400 },
    { bgTableMax:450,  bgTableQuality:0.5, boxMax:300 }
  ];
  try{
    for(const stage of stages){
      if(layout.backgroundImage){
        const img = await loadImageAsync(layout.backgroundImage);
        layout.backgroundImage = recompressImage(img, stage.bgTableMax, true, stage.bgTableQuality);
      }
      if(layout.tableImage){
        const img = await loadImageAsync(layout.tableImage);
        layout.tableImage = recompressImage(img, stage.bgTableMax, true, stage.bgTableQuality);
      }
      if(layout.boxImage){
        const img = await loadImageAsync(layout.boxImage);
        const isPng = layout.boxImage.startsWith('data:image/png');
        layout.boxImage = recompressImage(img, stage.boxMax, !isPng, stage.bgTableQuality);
        layout.boxImageAspect = `${img.naturalWidth}/${img.naturalHeight}`;
      }
      if(estimateLayoutSize(layout) <= SAFE_LIMIT) break;
    }
  } catch(e){
    console.error('repairLayoutImageSize failed', e);
    showToast('⚠️ Verkleinern fehlgeschlagen — Bild konnte nicht geladen werden.');
    return;
  }
  const afterSize = estimateLayoutSize(layout);
  await saveLayoutTemplatesList();
  if(afterSize > SAFE_LIMIT){
    showToast(`⚠️ "${layout.name}" ist trotz mehrerer Verkleinerungsstufen noch gross (${formatBytesApprox(afterSize)}) — evtl. hilft ein neu hochgeladenes, kleineres Originalbild.`);
  } else {
    showToast(`✓ "${layout.name}" verkleinert: ${formatBytesApprox(beforeSize)} → ${formatBytesApprox(afterSize)}`);
  }
  refreshTableEditUI();
}

function chipBreakdownForAmount(amount, chipProfile){
  if(!chipProfile || !chipProfile.chips || !chipProfile.chips.length || !amount || amount<=0) return null;
  const denoms = chipProfile.chips.filter(c => c.value>0).slice().sort((a,b) => b.value-a.value);
  if(!denoms.length) return null;
  let remaining = Math.round(amount*100)/100;
  const breakdown = [];
  denoms.forEach(c => {
    if(remaining <= 0.001) return;
    const count = Math.floor((remaining + 0.0001) / c.value);
    if(count > 0){
      breakdown.push({ color:c.color, value:c.value, kind:c.kind, count });
      remaining = Math.round((remaining - count*c.value) * 100) / 100;
    }
  });
  return breakdown.length ? breakdown : null;
}
function findChipAssetForValue(value){
  if(value == null) return null;
  return (tableAssets.chips||[]).find(a => a.value != null && Math.abs(a.value - value) < 0.0001) || null;
}
function chipStackHtml(amount, chipProfile){
  if(!amount || amount<=0.001) return '';
  const chipBg = (color, value) => {
    const asset = findChipAssetForValue(value);
    return asset ? `background-image:url('${asset.image}');background-size:cover;background-position:center;` : `background:${color};`;
  };
  const scale = tableSettings.chipScale || 1;
  const scaleStyle = scale !== 1 ? `transform:scale(${scale});transform-origin:center bottom;` : '';
  const breakdown = chipBreakdownForAmount(amount, chipProfile);
  if(!breakdown){
    return `<div class="chip-stack" style="${scaleStyle}"><div class="chip-denom"><div class="chip-coin" style="${chipBg(tableSettings.posColor, null)}top:0;"></div></div></div>`;
  }
  return `<div class="chip-stack" style="${scaleStyle}">
    ${breakdown.slice(0,4).map(d => {
      const shown = Math.min(d.count, 5);
      return `<div class="chip-denom">
        ${Array.from({length:shown}).map((_,i) => `<div class="chip-coin${d.kind==='plaque'?' plaque':''}" style="${chipBg(d.color, d.value)}top:${(shown-1-i)*0.33}cqw;"></div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}
function betLineChipHtml(seatPos, amount, chipProfile, s, variant){
  if(!amount || amount<=0.001) return '';
  let bx, by;
  if(seatPos.chipX != null && seatPos.chipY != null){
    bx = seatPos.chipX; by = seatPos.chipY;
  } else {
    const frac = variant==='bonus' ? 0.55 : 0.38;
    bx = seatPos.left + (50-seatPos.left)*frac;
    by = seatPos.top + (50-seatPos.top)*frac;
  }
  const label = variant==='bonus' ? '🐍 +' + fmtChipPlain(amount, s) : fmtChipPlain(amount, s);
  // Der Chip selbst wird exakt auf (bx,by) zentriert — genau wie im "Tisch bearbeiten"-Marker, wo
  // NUR der Chip (ohne Text) zentriert wird. Der Betrag-Text kommt als eigenes Element DARUNTER,
  // ohne die Zentrierung des Chips zu verschieben — vorher wurde der ganze Block (Chip+Text)
  // gemeinsam zentriert, wodurch der Chip sichtbar von seiner eigentlichen Position wegrutschte.
  return `<div class="bet-line-chips" style="left:${bx}%;top:${by}%;${variant==='bonus'?'filter:drop-shadow(0 0 5px #FFD86B);':''}">
    <div style="position:absolute;left:0;top:0;transform:translate(-50%,-50%);">${chipStackHtml(amount, chipProfile)}</div>
    <div class="bet-line-amt" style="position:absolute;left:0;top:0;transform:translate(-50%,0.8cqw);${variant==='bonus'?'color:#FFD86B;':''}">${label}</div>
  </div>`;
}
function chipSetsSectionHtml(){
  ensureChipProfiles();
  return `
    <div class="panel">
      <div class="panel-head"><h3>🔴 Chipsets</h3>${isClubAdmin() ? `<button class="btn btn-primary btn-sm" onclick="openAddChipProfileModal()">+ Neues Chipset</button>` : ''}</div>
      <p class="lede" style="margin-top:-6px;">Gemeinsam für den ganzen Club gespeichert. Cash-Chipsets sind an eine Blind-Stufe gekoppelt und werden beim Erstellen einer Session mit denselben Blinds automatisch verknüpft.</p>
      ${currentClub.chipProfiles.length ? currentClub.chipProfiles.map(cp => chipProfileCardHtml(cp)).join('') : `<div class="empty-state"><strong>Noch keine Chipsets definiert</strong></div>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3 style="font-size:15px;">🔴 Chip-Vorlagen (Bild pro Wert)</h3></div>
      <p class="lede" style="margin-top:-6px;font-size:12px;">Eigene Bilder für einzelne Chip-Werte, unabhängig vom Chipset — nur für dich gespeichert.</p>
      ${chipAssetGalleryHtml()}
    </div>`;
}
function chipProfileCardHtml(cp){
  const chips = (cp.chips||[]).slice().sort((a,b)=>a.value-b.value);
  return `
    <div class="panel" style="background:var(--tile);border:1px solid var(--paper-line);margin-bottom:14px;">
      <div class="panel-head" style="margin-bottom:10px;">
        <h3 style="font-size:15px;">${cp.type==='cash' ? `${escapeHtml(cp.name || (formatMoney(cp.sb)+' / '+formatMoney(cp.bb)))}` : escapeHtml(cp.name || 'Turnier-Chipset')} <span class="badge badge-type">${cp.type==='cash'?t('badge_cash'):t('badge_tournament')}</span></h3>
        <div style="display:flex;gap:10px;">
          ${isClubAdmin() ? `<button class="btn-text" onclick="openAddChipToProfileModal('${cp.id}')">+ Chip</button>
          <button class="icon-btn danger" title="${t('btn_remove_place')||'Löschen'}" onclick="deleteChipProfile('${cp.id}')">${ICON_ARCHIVE}</button>` : ''}
        </div>
      </div>
      ${chips.length ? `
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          ${chips.map(c => `
            <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--paper-line);border-radius:999px;padding:6px 12px 6px 6px;">
              ${isClubAdmin() ? `<input type="color" value="${c.color}" onchange="updateChipColor('${cp.id}','${c.id}', this.value)" style="width:24px;height:24px;border:none;border-radius:50%;cursor:pointer;padding:0;">` : `<span style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${c.color};"></span>`}
              <span style="font-weight:700;font-size:13px;">${formatMoney(c.value)}</span>
              <span class="badge badge-type" style="font-size:10px;">${c.kind==='plaque'?'Plakette':'Chip'}</span>
              ${isClubAdmin() ? `<button class="icon-btn danger" title="${t('btn_remove_place')||'Löschen'}" onclick="deleteChip('${cp.id}','${c.id}')" style="width:20px;height:20px;">${ICON_ARCHIVE}</button>` : ''}
            </div>`).join('')}
        </div>
      ` : `<p class="lede" style="margin:0;">Noch keine Chips in diesem Set.</p>`}
    </div>`;
}
function openAddChipProfileModal(){
  if(!isClubAdmin()) return;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>Neues Chipset</h2>
        <div class="field"><label>Typ</label>
          <select id="cp-type" onchange="document.getElementById('cp-blinds-row').style.display = this.value==='cash' ? 'flex' : 'none';">
            <option value="cash">${t('badge_cash')}</option>
            <option value="tournament">${t('badge_tournament')}</option>
          </select>
        </div>
        <div id="cp-blinds-row" class="field-row">
          <div class="field"><label>${t('label_sb')}</label><input id="cp-sb" type="number" min="0" step="0.05" placeholder="${t('placeholder_amount')}"></div>
          <div class="field"><label>${t('label_bb')}</label><input id="cp-bb" type="number" min="0" step="0.05" placeholder="${t('placeholder_amount')}"></div>
        </div>
        <div class="field"><label>Name <span class="sublabel">${t('sublabel_optional')}</span></label><input id="cp-name" type="text" placeholder="z.B. Wohnzimmer-Set"></div>
        <div id="cp-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">${t('btn_cancel')}</button>
          <button class="btn btn-primary" onclick="confirmAddChipProfile()">${t('btn_create')}</button>
        </div>
      </div>
    </div>`;
}
async function confirmAddChipProfile(){
  if(!isClubAdmin()) return;
  const type = document.getElementById('cp-type').value;
  const name = document.getElementById('cp-name').value.trim();
  ensureChipProfiles();
  if(type==='cash'){
    const sb = Number(document.getElementById('cp-sb').value||0);
    const bb = Number(document.getElementById('cp-bb').value||0);
    if(!bb){ document.getElementById('cp-error').innerHTML = `<div class="error-msg">${t('err_need_amount')}</div>`; return; }
    currentClub.chipProfiles.push({ id: uid(), type, sb, bb, name, chips: [] });
  } else {
    currentClub.chipProfiles.push({ id: uid(), type, sb:null, bb:null, name, chips: [] });
  }
  await saveClubData();
  closeModal();
  render();
}
async function deleteChipProfile(profileId){
  if(!isClubAdmin()) return;
  ensureChipProfiles();
  currentClub.chipProfiles = currentClub.chipProfiles.filter(cp => cp.id !== profileId);
  await saveClubData();
  render();
}
function openAddChipToProfileModal(profileId){
  if(!isClubAdmin()) return;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>Chip / Plakette hinzufügen</h2>
        <div class="field"><label>Wert</label><input id="chip-value" type="number" min="0" step="0.05" placeholder="${t('placeholder_amount')}" autofocus></div>
        <div class="field"><label>Typ</label>
          <select id="chip-kind">
            <option value="chip">Chip</option>
            <option value="plaque">Plakette</option>
          </select>
        </div>
        <div class="field"><label>Farbe</label><input id="chip-color" type="color" value="#D97757" style="width:50px;height:36px;padding:0;border:none;cursor:pointer;"></div>
        <div id="chip-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">${t('btn_cancel')}</button>
          <button class="btn btn-primary" onclick="confirmAddChip('${profileId}')">${t('btn_create')}</button>
        </div>
      </div>
    </div>`;
}
async function confirmAddChip(profileId){
  if(!isClubAdmin()) return;
  const value = Number(document.getElementById('chip-value').value || 0);
  if(!value || value<=0){ document.getElementById('chip-error').innerHTML = `<div class="error-msg">${t('err_need_amount')}</div>`; return; }
  const kind = document.getElementById('chip-kind').value;
  const color = document.getElementById('chip-color').value;
  const cp = getChipProfile(profileId);
  if(!cp) return;
  cp.chips.push({ id: uid(), value, kind, color });
  await saveClubData();
  closeModal();
  render();
}
async function updateChipColor(profileId, chipId, color){
  if(!isClubAdmin()) return;
  const cp = getChipProfile(profileId);
  const c = cp && cp.chips.find(x => x.id===chipId);
  if(c){ c.color = color; await saveClubData(); render(); }
}
async function deleteChip(profileId, chipId){
  if(!isClubAdmin()) return;
  const cp = getChipProfile(profileId);
  if(!cp) return;
  cp.chips = cp.chips.filter(x => x.id!==chipId);
  await saveClubData();
  render();
}

  }
  const swatchHtml = vars => ['--felt','--paper','--brass','--green','--red'].map(k => `<span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${vars[k]};border:1px solid rgba(0,0,0,.15);"></span>`).join('');
  return `
    <div class="panel">
      <div class="panel-head"><h3>🎨 Design</h3></div>
      <p class="lede" style="margin-top:-6px;">Presets sind nur für dich gespeichert (nicht für den ganzen Club sichtbar).</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        ${Object.keys(THEME_PRESETS).map(key => `
          <div style="background:#fff;color:#1a1a1a;border:1px solid var(--paper-line);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:140px;" onclick="applyPreset('${key}')">
            <div style="display:flex;gap:4px;margin-bottom:8px;">${swatchHtml(THEME_PRESETS[key].vars)}</div>
            <div style="font-weight:700;font-size:13px;">${THEME_PRESETS[key].name}</div>
          </div>`).join('')}
        ${customThemes.map((ct,idx) => `
          <div style="background:#fff;color:#1a1a1a;border:1px solid var(--paper-line);border-radius:10px;padding:12px 16px;min-width:140px;">
            <div style="display:flex;gap:4px;margin-bottom:8px;cursor:pointer;" onclick="applyCustomTheme(${idx})">${swatchHtml({...THEME_PRESETS.default.vars, ...ct.vars})}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <div style="font-weight:700;font-size:13px;cursor:pointer;" onclick="applyCustomTheme(${idx})">${escapeHtml(ct.name)}</div>
              <button class="icon-btn danger" style="color:#8a8375;" title="Löschen" onclick="deleteCustomTheme(${idx})">${ICON_ARCHIVE}</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="panel-head"><h3 style="font-size:15px;">Eigene Farben (hybrid)</h3></div>
      ${THEME_VAR_CATEGORIES.map(cat => `
        <div style="margin-bottom:18px;">
          <div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">${cat.label}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 20px;">
            ${cat.keys.map(k => `
              <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;">
                ${THEME_VAR_LABELS[k]}
                <input type="color" value="${currentThemeVars[k]}" onchange="updateThemeVar('${k}', this.value)" style="width:38px;height:28px;border:none;border-radius:6px;cursor:pointer;">
              </label>`).join('')}
          </div>
        </div>`).join('')}
      <div class="field" style="max-width:320px;">
        <label>${THEME_VAR_LABELS['--radius']}</label>
        <input type="range" min="0" max="24" step="1" value="${parseInt(currentThemeVars['--radius'])||10}" oninput="updateThemeVar('--radius', this.value+'px')">
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:16px;" onclick="promptSaveCustomTheme()">Als eigenes Design speichern</button>
    </div>`;
}
