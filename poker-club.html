<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --felt: #171716; --felt-dark: #0B0B0A; --felt-line: #2A2A28;
    --paper: #F1F1EF; --paper-line: #E7E4DC; --felt-ink: #F1F1EF;
    --tile: #FCFCFB;
    --ink: #24211C; --ink-soft: #6B6455;
    --brass: #D97757; --brass-dark: #C15F3C;
    --btn-bg: #D97757; --btn-hover: #C15F3C; --btn-active: #0B0B0A; --btn-ink: #0B0B0A; --btn-active-ink: #F1F1EF;
    --btn-secondary-bg: #E7E7E4; --btn-secondary-ink: #24211C;
    --red: #A73B3B; --green: #3C6E4A; --blue: #33607D;
    --radius: 10px;
    --card-shadow: 0 1px 3px rgba(15,35,24,.06);
    --divider: #1A1A18;
    --card-bg: #fff; --card-border: transparent; --card-red: #A73B3B; --card-black: #1a1a1a;
    --card-green4c: #1E7B34; --card-blue4c: #1565C0; --card-font: inherit;
    --card-bg-spades: var(--card-bg); --card-bg-hearts: var(--card-bg);
    --card-bg-clubs: var(--card-bg); --card-bg-diamonds: var(--card-bg);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #landing{ min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 20%, var(--felt-line) 0%, transparent 40%), var(--felt); padding:24px; position:relative; }
  .lang-corner{position:absolute;top:20px;right:20px;}
  .lang-corner select{ background:rgba(255,255,255,.08);color:var(--felt-ink);border:1px solid rgba(242,233,216,.35); border-radius:8px;padding:8px 10px;font-size:13px; }
  .lang-corner select option{color:var(--ink);}
  .landing-card{ max-width:440px; width:100%; text-align:center; }
  .landing-mark{ font-size:52px; line-height:1; margin-bottom:18px; letter-spacing:6px; }
  .landing-mark span:nth-child(1){color:var(--brass);}
  .landing-mark span:nth-child(2){color:var(--felt-ink);}
  .landing-mark span:nth-child(3){color:var(--brass);}
  .landing-mark span:nth-child(4){color:var(--felt-ink);}
  #landing h1{ color:var(--felt-ink); font-size:34px; font-weight:600; margin:0 0 8px; }
  #landing p.sub{ color:#C9D8CE; margin:0 0 36px; font-size:15px; }
  .landing-actions{display:flex;flex-direction:column;gap:12px;}
  #my-clubs-list{margin-bottom:22px;}
  #my-clubs-list .mc-label{color:#9FB6A8;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:left;}
  .my-club-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(242,233,216,.18);
    border-radius:9px;padding:12px 14px;margin-bottom:8px;text-align:left;cursor:pointer;
  }
  .my-club-item:hover{background:rgba(255,255,255,.11);}
  .my-club-item .mc-name{color:var(--felt-ink);font-weight:600;font-size:14.5px;}
  .my-club-item .mc-code{color:#9FB6A8;font-size:12px;margin-top:2px;letter-spacing:1px;}
  .my-club-item .mc-remove{background:none;border:none;color:#9FB6A8;font-size:16px;padding:4px 6px;}
  .my-club-item .mc-remove:hover{color:var(--felt-ink);}
  .btn{ border:none; border-radius:var(--radius); padding:14px 20px; font-size:15px; font-weight:600; letter-spacing:.1px; transition:transform .12s ease, box-shadow .16s ease, filter .16s ease; }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--btn-bg);color:var(--btn-ink);box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .btn-primary:hover{background:var(--btn-hover);box-shadow:0 4px 12px rgba(0,0,0,.16);transform:translateY(-1px);}
  .btn-primary:active{background:var(--btn-active);color:var(--btn-active-ink);transform:translateY(0) scale(.98);}
  .btn-ghost{background:transparent;color:var(--felt-ink);border:1px solid rgba(242,233,216,.35);}
  .btn-ghost:hover{border-color:rgba(242,233,216,.7);}
  .btn-text{background:rgba(0,0,0,.03);color:var(--btn-bg);font-weight:600;padding:7px 13px;font-size:13.5px;border-radius:999px;transition:background .14s ease, transform .12s ease;}
  .btn-text:hover{background:rgba(0,0,0,.07);transform:translateY(-1px);}
  .btn-text:active{transform:translateY(0);}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
  .btn-danger-text{background:rgba(167,59,59,.06);border:none;color:var(--red);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;transition:background .14s ease;}
  .btn-danger-text:hover{background:rgba(167,59,59,.12);}

  .modal-backdrop{ position:fixed;inset:0;background:rgba(15,46,34,.55); display:flex;align-items:center;justify-content:center; z-index:50;padding:20px;overflow-y:auto; }
  .modal{ background:var(--tile); border-radius:14px; padding:32px; max-width:440px; width:100%; text-align:left; margin:auto; }
  .modal h2{margin:0 0 4px;font-size:22px;}
  .modal p.hint{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  #auth-gate .field label{color:var(--felt-ink);}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field .sublabel{font-weight:400;color:var(--ink-soft);}
  .field input, .field select, .field textarea{ width:100%;padding:11px 12px;border:1px solid var(--paper-line); border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink); }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:24px;}
  .modal-actions .btn{flex:1;}
  .btn-secondary{background:var(--btn-secondary-bg);border:1px solid var(--paper-line);color:var(--btn-secondary-ink);transition:background .14s ease, border-color .14s ease;}
  .btn-secondary:hover{background:var(--btn-secondary-bg);filter:brightness(0.94);border-color:var(--ink-soft);}
  .error-msg{color:var(--red);font-size:13px;margin-top:-8px;margin-bottom:14px;}
  .color-pick{display:flex;gap:8px;flex-wrap:wrap;}
  .color-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .color-dot.selected{border-color:var(--ink);}
  .alien-pick{display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto;padding:4px;}
  .alien-dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--paper-line);cursor:pointer;background:var(--paper);flex-shrink:0;overflow:visible;}
  .alien-dot:hover{border-color:var(--brass);}
  .alien-dot.selected{border-color:var(--brass);box-shadow:0 0 0 2px rgba(217,119,87,.3);}

  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{ width:230px; flex-shrink:0; background:var(--felt-dark); color:var(--felt-ink); display:flex; flex-direction:column; padding:24px 16px; }
  .club-id{padding:0 8px 20px;border-bottom:1px solid var(--felt-line);margin-bottom:16px;}
  .club-id .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--felt-ink);}
  .club-id .code{font-size:12px;color:#9FB6A8;margin-top:4px;letter-spacing:1px;}
  nav{flex:1;display:flex;flex-direction:column;gap:2px;}
  .nav-item{ display:flex;align-items:center;gap:11px; padding:10px 12px;border-radius:8px; color:#C9D8CE;font-size:14px;font-weight:500; background:none;border:none;text-align:left;width:100%; }
  .nav-item .glyph{font-size:16px;width:18px;text-align:center;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(217,119,87,.16);color:var(--brass);font-weight:600;}
  .nav-item.active .glyph{color:var(--brass);}
  .nav-arrange-btn{ background:rgba(255,255,255,.06);border:none;color:#C9D8CE;font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 11px;border-radius:999px;transition:background .14s ease,color .14s ease; }
  .nav-arrange-btn:hover{ color:var(--felt-ink);background:rgba(255,255,255,.12); }
  .nav-drag-row{ touch-action:none; }
  .nav-drag-row.arranging{ border-radius:8px; }
  .nav-drag-handle{ color:#9FB6A8;font-size:14px;cursor:grab;padding:0 4px;user-select:none;flex-shrink:0; }
  .nav-drag-row.dragging-source{ opacity:.15; }
  .nav-drag-ghost{ background:#1F3D2C;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);transform:scale(1.03); }
  .nav-drag-ghost .nav-drag-handle{ color:var(--brass); }
  .sidebar-footer{border-top:1px solid var(--felt-line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .sidebar-footer button{ background:none;border:none;color:#9FB6A8;font-size:13px;padding:6px 12px;width:100%;text-align:left; }
  .sidebar-footer button:hover{color:var(--felt-ink);}
  .sidebar-footer select{ background:rgba(255,255,255,.06);color:var(--felt-ink);border:1px solid var(--felt-line); border-radius:8px;padding:8px 10px;font-size:13px;width:100%; }
  .sidebar-footer select option{color:var(--ink);}

  .content{flex:1;padding:40px 48px;max-width:1300px;}
  .content.content-wide{max-width:1700px;}
  #app.table-fullscreen .sidebar{display:none;}
  #app.table-fullscreen .content{max-width:none;padding:10px;}
  /* Kein Breiten-Limit mehr im Vollbild — Tisch und Aktions-Fenster nutzen die volle verfügbare
     Breite. Da Avatar/Sitzgrafik/Name/Stack/Holecards/Chips/Board bereits alle prozentual zur
     Tischbreite berechnet werden (nicht in festen Pixeln), skaliert dabei ALLES proportional mit —
     Grössenverhältnisse und Positionen bleiben exakt erhalten, nur insgesamt grösser dargestellt. */
  #app.table-fullscreen .hand-flow-split{max-width:none;width:100%;}
  .content h1{font-size:28px;margin:0 0 6px;}
  .content p.lede{color:var(--ink-soft);font-size:15px;margin:0 0 32px;}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}

  .stat-grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px; }
  .stat-card{ background:var(--tile);border:1px solid var(--paper-line);border-radius:var(--radius); padding:22px 20px;box-shadow:var(--card-shadow); }
  .stat-card .num{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1;color:var(--ink);}
  .stat-card .label{font-size:13px;color:var(--ink-soft);margin-top:8px;}

  .panel{ background:var(--tile);border:1px solid var(--paper-line);border-radius:var(--radius); padding:24px;margin-bottom:24px;box-shadow:var(--card-shadow); }
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .panel-head h3{font-size:17px;margin:0;font-weight:600;}
  .empty-state{ padding:28px 8px;text-align:left;color:var(--ink-soft);font-size:14px; border-top:1px dashed var(--paper-line); }
  .empty-state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600;}

  .placeholder-view{ background:var(--tile);border:1px solid var(--paper-line);border-radius:var(--radius); padding:60px 40px;text-align:center; }
  .placeholder-view .glyph-big{font-size:38px;margin-bottom:14px;}
  .placeholder-view h2{font-size:20px;margin:0 0 8px;}
  .placeholder-view p{color:var(--ink-soft);font-size:14px;max-width:420px;margin:0 auto;}

  .pill-group{display:flex;gap:6px;flex-wrap:wrap;}
  .pill.tab-pill{flex:0 0 auto;min-width:148px;text-align:center;}
  .pill{ padding:7px 14px;border-radius:999px;border:1px solid var(--btn-bg); background:var(--btn-bg);font-size:13px;font-weight:600;color:var(--btn-ink);transition:background .14s ease, border-color .14s ease, transform .12s ease; }
  .pill:not(.active):hover{background:var(--btn-hover);border-color:var(--btn-hover);transform:translateY(-1px);}
  .pill.active{background:var(--btn-active);color:var(--btn-active-ink);border-color:var(--btn-active);box-shadow:0 1px 4px rgba(0,0,0,.14);}
  .filter-row{ display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap; }
  .filter-label{ font-size:10.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px; }
  .pill.filter{ background:var(--btn-secondary-bg);border-color:var(--paper-line);color:var(--btn-secondary-ink); }
  .pill.filter.active{ background:rgba(217,119,87,.12);color:var(--brass);border-color:var(--brass); }

  .session-row{ display:flex;align-items:center;justify-content:space-between; padding:16px 18px;border:1px solid var(--paper-line);border-radius:var(--radius); margin-bottom:10px;background:var(--tile);cursor:pointer;box-shadow:var(--card-shadow); }
  .session-row:hover{border-color:var(--felt);}
  .session-row .meta{display:flex;flex-direction:column;gap:3px;}
  .session-row .meta .date{font-weight:600;font-size:15px;}
  .session-row .meta .sub{font-size:13px;color:var(--ink-soft);}
  .session-row .right{display:flex;align-items:center;gap:14px;}
  .badge{ font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px; }
  .badge-open{background:#E7F0E8;color:var(--green);}
  .badge-closed{background:#EFE7DA;color:var(--ink-soft);}
  .badge-type{background:#EAE2F2;color:#5A4A80;}

  .session-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;}
  .session-header .titles{display:flex;flex-direction:column;gap:6px;}
  .session-header .badges{display:flex;gap:8px;flex-wrap:wrap;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:14px;padding:0;}
  .back-link:hover{color:var(--ink);}

  .lock-banner{ display:flex;align-items:center;gap:12px;flex-wrap:wrap; background:#FBF3E4;border:1px solid #EBD9AE;border-radius:var(--radius); padding:14px 16px;margin-bottom:20px;font-size:13px; }
  .lock-banner input{width:110px;padding:8px 10px;border:1px solid var(--paper-line);border-radius:8px;}
  .unlocked-banner{ display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:8px; background:#EAF2EC;border:1px solid #C9DECD;border-radius:var(--radius); padding:10px 16px;margin-bottom:20px;font-size:13px;color:var(--green);font-weight:600; }
  .unlocked-banner span{ white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .unlocked-banner .btn-text{ flex-shrink:0; }

  .participant-row{ display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center; padding:16px;border:1px solid var(--paper-line);border-radius:var(--radius);margin-bottom:10px;background:var(--tile);box-shadow:var(--card-shadow); }
  .participant-row.has-rank{grid-template-columns:auto 1fr auto auto auto;}
  .rank-badge{text-align:center;min-width:56px;}
  .rank-badge .rank-num{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--ink);line-height:1;}
  .rank-badge.gold .rank-num{color:var(--brass);}
  .rank-badge .rank-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;}
  .avatar-cutout{border-radius:0;background:none;overflow:visible;}
  .p-name{font-weight:600;font-size:14.5px;}
  .p-status{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .buyin-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .buyin-chip{font-size:11.5px;background:var(--paper);border:1px solid var(--paper-line);border-radius:999px;padding:3px 9px;color:var(--ink-soft);}
  .buyin-chip.editable{cursor:pointer;}
  .buyin-chip.editable:hover{border-color:var(--brass);color:var(--ink);}
  .p-net{font-family:'Fraunces',serif;font-size:20px;font-weight:600;text-align:right;min-width:100px;}
  .p-net.pos{color:var(--green);}
  .p-net.neg{color:var(--red);}
  .p-net.zero{color:var(--ink-soft);}
  .p-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .chip-input{width:90px;padding:6px 8px;border:1px solid var(--paper-line);border-radius:6px;font-size:13px;text-align:right;}
  .mini-btn{ font-size:12px;padding:6px 10px;border-radius:7px;border:1px solid var(--paper-line);background:var(--paper);color:var(--ink);font-weight:600;transition:border-color .14s ease, transform .12s ease; }
  .mini-btn:hover{border-color:var(--felt);transform:translateY(-1px);}
  .mini-btn.brass{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink);box-shadow:0 1px 4px rgba(0,0,0,.14);}
  .mini-btn.brass:hover{background:var(--btn-hover);border-color:var(--btn-hover);}
  .mini-btn.outline-red{color:var(--red);border-color:#E4C7C7;}

  .kasse-panel{display:flex;gap:24px;flex-wrap:wrap;}
  .kasse-item .num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .kasse-item .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .panel-kasse-wrap.match-ok{background:#F3F8F4;border-color:#C9DECD;}
  .panel-kasse-wrap.match-ok .kasse-item .num, .panel-kasse-wrap.match-ok .kasse-item .label, .panel-kasse-wrap.match-ok h3{color:var(--green);}
  .panel-kasse-wrap.match-bad{background:#FDF4F4;border-color:#EFC9C9;}
  .panel-kasse-wrap.match-bad .kasse-item .num, .panel-kasse-wrap.match-bad .kasse-item .label, .panel-kasse-wrap.match-bad h3{color:var(--red);}

  .status-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:9px;font-size:13.5px;font-weight:600;margin-bottom:18px;}
  .status-banner .icon{font-size:16px;}
  .status-banner.ok{background:#E7F0E8;color:var(--green);border:1px solid #C9DECD;}
  .status-banner.bad{background:#FBEAEA;color:var(--red);border:1px solid #EFC9C9;}
  .itm-banner{
    background:linear-gradient(90deg, rgba(217,119,87,.15), rgba(217,119,87,.05));
    border:1px solid var(--brass); color:var(--brass-dark); font-weight:700; font-size:14.5px;
    padding:14px 18px; border-radius:10px; margin-bottom:20px; text-align:center;
    animation: itmPulse 1.8s ease-in-out infinite;
  }
  @keyframes itmPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(217,119,87,.25);} 50%{box-shadow:0 0 0 8px rgba(217,119,87,0);} }
  .stale-warning{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--red); color:#fff; font-weight:600; font-size:13px;
    padding:12px 16px; border-radius:10px; margin-bottom:16px;
    animation: staleBlink 1.3s ease-in-out infinite;
  }
  @keyframes staleBlink{ 0%,100%{opacity:1;} 50%{opacity:.6;} }

  /* hand flow: table + action panel */
  .hand-flow-split{ display:grid; grid-template-columns: 2.6fr 1fr; gap:20px; align-items:start; margin-bottom:24px; }
  .table-pane{ min-width:320px; display:flex; flex-direction:column; }
  .action-pane{ min-width:290px; display:flex; flex-direction:column; }
  .table-controls{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-bottom:16px; padding:12px 14px; background:rgba(255,255,255,.06); border-radius:10px; }
  .table-controls.on-light{ background:var(--paper); border:1px solid var(--paper-line); }
  .table-controls.on-light label{ color:var(--ink); }
  .table-controls.on-light select{ color:var(--ink); background:var(--paper); border:1px solid var(--paper-line); }
  .table-controls label{ display:flex; align-items:center; gap:6px; font-size:12px; color:#D9D4C4; font-weight:600; }
  .table-controls input[type=color]{ width:30px; height:26px; border:none; border-radius:5px; padding:0; background:none; cursor:pointer; }
  .table-controls select{ font-size:12px; padding:4px 6px; border-radius:6px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; }
  .table-controls select option{ color:var(--ink); background:var(--paper); }
  .poker-table-oval{
    /* min-height niedrig halten: Live-Tisch (teilt sich die Breite mit dem Aktions-Panel daneben,
       ~72% der Inhaltsbreite) und Tisch-Editor/Table-Designer (volle Breite, kein Aktions-Panel)
       haben unterschiedliche Spaltenbreiten. Ist min-height zu hoch, kippt bei der schmaleren Spalte
       das Seitenverhältnis aus 16:11 heraus (min-height gewinnt gegen aspect-ratio), wodurch das
       Tischbild (background-size:cover) anders beschnitten wird — Chips/Anker (in % der Box
       positioniert) sitzen dann in der einen Ansicht auf der Tischkante, in der anderen daneben,
       obwohl die Koordinaten identisch sind. Niedrig halten, damit aspect-ratio in beiden Kontexten
       bei allen realistischen Breiten gewinnt und beide Ansichten optisch exakt übereinstimmen.
    */
    position:relative; width:100%; min-height:220px; aspect-ratio:16/11;
    background:radial-gradient(ellipse at center, #1B4332 0%, #0C2116 100%);
    border:10px solid #3A2A1C; border-radius:50%;

  .seat-name{ white-space:nowrap !important; overflow:hidden; max-width:12cqw; font-size:var(--seat-name-size, 1.5cqw); }

  .board-cards{ display:flex; gap:4px; justify-content:center; margin-bottom:6px; }
  /* aspect-ratio:5/7 + inline-block gelten jetzt IMMER (nicht nur bei eigenen Kartenbildern) — sonst
     sehen Karten mit eigenem Bild (hochformatig erzwungen) und Standard-Text-Karten (nur schrift-/
     padding-breit) in derselben Reihe unterschiedlich gross aus, z.B. im Hand-Verlauf bei einem nur
     teilweise mit eigenen Bildern befüllten Deck. Mit der Regel hier an einer zentralen Stelle sind
     IMMER alle Karten gleich (echtes Hochformat), unabhängig davon, ob ein Bild hinterlegt ist.
     WICHTIG — width:2.3em explizit gesetzt statt die Breite dem Inhalt (Rang+Symbol-Text) zu
     überlassen: ohne feste Breite bestimmt bei "width:auto" weiterhin der TEXT die Breite (z.B. "Q"
     ist im Schriftbild spürbar breiter als "J" oder "T"), und aspect-ratio zieht die Höhe dann aus
     dieser je nach Buchstabe unterschiedlichen Breite — das ergibt in derselben Reihe sichtbar
     verschieden grosse Karten, selbst OHNE eigenes Bild (genau das vom Nutzer gemeldete Problem am
     Tisch: Flop-Karten unterschiedlich beschnitten). Mit fester em-Breite ist die Breite für jede
     Karte garantiert identisch, unabhängig vom Buchstaben; die Höhe folgt daraus einheitlich über
     aspect-ratio. */
  /* width/height jetzt EXPLIZIT statt aspect-ratio:5/7 — Basis-Seitenverhältnis bleibt bei den
     Standardwerten (2.5em x 3.5em = exakt 5:7) identisch, aber Breite und Höhe sind jetzt über je eine
     eigene CSS-Variable UNABHÄNGIG voneinander skalierbar (--board-card-w-scale/--board-card-h-scale,
     s. .seat-holecards weiter unten für die Hole-Card-Variante). Das ist die Grundlage für den
     "Karten stauchen/strecken"-Regler im Tisch-Designer — bewusst über width/height (echtes
     Stauchen/Strecken der Box inkl. Bild/Schrift), NICHT über object-fit/background-position
     (das würde beschneiden statt verzerren, was hier explizit NICHT gewollt ist). Default 1 = wie
     bisher. */
  .board-card{ display:inline-block; width:calc(2.5em * var(--board-card-w-scale, 1)); height:calc(3.5em * var(--board-card-h-scale, 1)); background:var(--card-bg,#fff); border:1px solid var(--card-border,transparent); border-radius:4px; padding:2px 6px; font-weight:800; font-size:13px; font-family:var(--card-font,inherit); box-shadow:0 1px 3px rgba(0,0,0,.3); box-sizing:border-box; text-align:center; white-space:nowrap; overflow:hidden; }
  /* Innerhalb des Tisches (Board- und Hole-Karten) prozentual zur Tischbreite statt fixer Pixel —
     konsistent mit Avatar/Box/Name/Stack/Chips, egal ob Editor oder Live-Ansicht gerade eine andere
     tatsächliche Breite hat. Ausserhalb des Tisches (Hand-Verlauf etc.) bleibt die feste Grösse. */
  .poker-table-oval .board-card{ font-size:1.5cqw; padding:0.25cqw 0.7cqw; }
  /* Hole-Cards am Tisch bekommen ihre EIGENEN Stauch/Streck-Variablen (--hole-card-*) statt der
     Board-Karten-Variablen — Community-Karten und Hole-Karten lassen sich damit im Designer getrennt
     voneinander schmäler/breiter bzw. flacher/höher machen. */
  .poker-table-oval .poker-seat .seat-holecards .board-card{ font-size:1.3cqw; padding:0.15cqw 0.6cqw; width:calc(2.5em * var(--hole-card-w-scale, 1)); height:calc(3.5em * var(--hole-card-h-scale, 1)); }
  .poker-table-oval .seat-holecards .board-card{ font-size:1.3cqw; padding:0.15cqw 0.6cqw; width:calc(2.5em * var(--hole-card-w-scale, 1)); height:calc(3.5em * var(--hole-card-h-scale, 1)); }
  /* Optionale Rückkehr zu kleinen, flachen Hole-Card-Rechtecken statt der grossen, hochformatigen
     Kartenbilder — pro Layout einstellbar (layout.holeCardsCompact), nützlich wenn Avatar/Sitzgrafik
     so angeordnet sind, dass die grossen Karten etwas überdecken (z.B. Avatar über der Sitzgrafik). */
  .poker-table-oval .seat-holecards.compact .board-card,
  .poker-table-oval .poker-seat .seat-holecards.compact .board-card{
    width:auto; height:auto; min-width:1.8em; font-size:0.95cqw; padding:0.1cqw 0.4cqw; line-height:1.3;
  }
  .board-card.red{ color:var(--card-red, var(--red)); }
  .board-card.black{ color:var(--card-black, #1a1a1a); }
  .board-card.green4c{ color:var(--card-green4c, #1E7B34); }
  .board-card.blue4c{ color:var(--card-blue4c, #1565C0); }
  .board-card.suit-spades{ background:var(--card-bg-spades, var(--card-bg)); }
  .board-card.suit-hearts{ background:var(--card-bg-hearts, var(--card-bg)); }
  .board-card.suit-clubs{ background:var(--card-bg-clubs, var(--card-bg)); }

  /* Wieder 13 Reihen (Ränge) x 4 Spalten (Farben) — bewusst zurück von 4x13: die Karten sollen gross
     sein, auch wenn man dafür im Betraster etwas scrollen muss (vertikal, ganz normal). Feste
     Spaltenbreite (nicht 1fr/minmax) + justify-content:center, damit die Grösse nicht von der

</style>

<body>

<div id="auth-gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%, var(--felt-line) 0%, transparent 40%), var(--felt);padding:24px;">
  <div class="landing-card">

    <div id="auth-step-email">

      <div id="auth-code-error"></div>

  </div>
  <div class="landing-card">

<div id="app">

<script>
/* ================= Supabase-Speicher-Anbindung =================
   Ersetzt Claudes eingebauten window.storage durch eine eigene, auf Supabase basierende Version mit
   EXAKT derselben Schnittstelle (get/set/delete/list) — dadurch muss der Rest des Programms (alle
   Aufrufe von window.storage.xxx) NICHT angepasst werden, nur diese eine Stelle hier. */
const SUPABASE_URL = 'https://opbphectdxiwdcvkwmvw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JrhVfnBmFBZxAwfRGPTbaw_wprvpoIh';
/* Echter Supabase-Client (Auth + strukturierte Tabellen: clubs, club_memberships,
   club_join_requests, club_data). Getrennt vom alten window.storage-Blob-Speicher
   unten, der für reine UI-Einstellungen (Theme, Panel-Reihenfolge) weiterläuft. */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= Chipmate-Konto (Auth) ================= */
let currentUser = null;     // { id, email } wenn eingeloggt, sonst null
let currentClubId = null;   // UUID aus der Tabelle "clubs" (nicht der 5-stellige Code)
let myRole = null;          // 'lesend' | 'erfassend' | 'app_gestaltend' im aktuell offenen Club

function canWrite(){ return myRole === 'erfassend' || myRole === 'app_gestaltend'; }
function isClubAdmin(){ return myRole === 'app_gestaltend'; }

// Verknüpfung Login ↔ Spieler-Eintrag: bewusst NUR von einem Admin setzbar
// (siehe openEditPlayerModal/submitEditPlayer, Feld "linkedEmail"), damit
// niemand sich selbst als beliebigen anderen Spieler ausgeben kann — das
// war die explizite Sorge beim Online-Poker-Feature ("könnte ja als
// irgend ein Spieler eine Session spielen").
function myPlayer(){
  if(!currentUser || !currentUser.email || !currentClub || !currentClub.players) return null;
  const email = currentUser.email.toLowerCase();
  return currentClub.players.find(p => p.linkedEmail && p.linkedEmail.toLowerCase() === email) || null;
}

/* ================= Online Poker (Phase 0: Heads-up Cash Game) =================
   Diese Tabellen (online_tables/online_seats/online_hand_state/online_hand_history)
   leben NICHT im club_data-JSON-Blob wie der Rest der App, sondern sind eigene
   Postgres-Tabellen mit eigenen RLS-Policies (siehe chipmate_online_poker_schema.sql
   + chipmate_online_poker_phase0_lobby_rls.sql) — der Spielzustand ist zu
   zeitkritisch und zu geheim (Hole Cards!) für das Load-everything-als-JSON-Modell.
   Board/Pot/Zug kommen per Realtime-Broadcast von den Edge Functions; die eigenen
   Hole Cards NUR über einen privaten Kanal pro Sitz bzw. get_my_hole_cards(). */
let onlineTables = [];            // Liste der Tische dieses Clubs (aus online_tables + online_seats)
let currentOnlineTableId = null;  // UUID des gerade geöffneten Tisches, oder null = Lobby-Liste
let onlineMySeat = null;          // 0 oder 1 — Sitzplatz des eingeloggten Nutzers an diesem Tisch
let onlineHandState = null;       // zuletzt bekannter öffentlicher Zustand (get_public_hand_state / Broadcast)
let onlineMyHoleCards = null;     // eigene Hole Cards, z.B. ['A♠','K♦']
let onlinePublicChannel = null;   // Realtime-Kanal-Handle: table:<id>:public
let onlinePrivateChannel = null;  // Realtime-Kanal-Handle: table:<id>:seat:<n> (privat)
let onlineBusy = false;           // verhindert Doppelklicks während ein Edge-Function-Call läuft
let onlineRaiseAmount = '';       // Eingabefeld-Wert für Bet/Raise
// Persönliche Layout-Wahl für den aktuell offenen Tisch — unabhängig von dem, was andere Sitzende
// sehen (siehe online_layout_prefs). undefined = noch nicht geladen/keine eigene Wahl getroffen
// (dann gilt tbl.layout_id als Fallback), null = bewusst "Standard-Tisch" gewählt, string = eigenes Layout.
let onlineMyLayoutPref = undefined;

let onlineSeatPollId = null;
function cleanupOnlineChannels(){
  if(onlineSeatPollId){ clearInterval(onlineSeatPollId); onlineSeatPollId = null; }
  if(onlinePublicChannel){ sb.removeChannel(onlinePublicChannel); onlinePublicChannel = null; }
  if(onlinePrivateChannel){ sb.removeChannel(onlinePrivateChannel); onlinePrivateChannel = null; }
  onlinePrivateChannelSeat = null;
}

function resetOnlineTableState(){
  cleanupOnlineChannels();
  onlineBetBoxLabel = null; onlineBetInputVal = '';
  currentOnlineTableId = null;
  onlineMySeat = null;
  onlineHandState = null;
  onlineMyHoleCards = null;
  onlineRaiseAmount = '';
  onlineMyLayoutPref = undefined;
}

async function loadOnlineTables(){
  const { data: tables, error } = await sb.from('online_tables')
    .select('*').eq('club_id', currentClubId).order('created_at', {ascending:false});
  if(error){ console.error(error); onlineTables = []; render(); return; }
  const { data: seats } = await sb.from('online_seats').select('*').in('table_id', (tables||[]).map(t => t.id).concat(['00000000-0000-0000-0000-000000000000']));
  onlineTables = (tables||[]).map(t => ({ ...t, seats: (seats||[]).filter(s => s.table_id === t.id).sort((a,b) => a.seat_no - b.seat_no) }));
  render();
}

function renderOnlinePoker(){
  if(currentOnlineTableId) return renderOnlineTableView();
  return renderOnlineLobby();
}

function renderOnlineLobby(){
  if(!onlineTables.length && !onlineLobbyLoaded){
    onlineLobbyLoaded = true;
    loadOnlineTables();
  }
  const rows = onlineTables.map(tb => {
    const occ = tb.seats.filter(s => s.user_id).length;
    const statusLabel = tb.status === 'waiting' ? 'Wartet auf Spieler' : tb.status === 'running' ? 'Läuft' : 'Beendet';
    const mySeat = tb.seats.find(s => s.user_id === currentUser.id);
    return `
      <div class="session-row" onclick="openOnlineTable('${tb.id}')">
        <div class="meta">
          <div class="date">Blinds ${formatMoney(tb.small_blind)} / ${formatMoney(tb.big_blind)}</div>
          <div class="sub">${occ}/${tb.seat_count||2} Plätze besetzt · ${statusLabel}${mySeat!=null ? ' · Du sitzt auf Platz '+(mySeat.seat_no+1) : ''}</div>
        </div>
        <div class="right" style="display:flex;align-items:center;gap:8px;">
          <span class="badge ${tb.status==='waiting' ? 'badge-open' : 'badge-closed'}">${statusLabel}</span>
          ${isClubAdmin() ? `<button class="icon-btn danger" title="Tisch löschen" onclick="event.stopPropagation(); deleteOnlineTablePrompt('${tb.id}')">${ICON_ARCHIVE}</button>` : ''}
        </div>
      </div>`;
  }).join('');
  return `
    <div class="view-head">
      <div><h1>${t('nav_online')}</h1><p class="lede" style="margin-bottom:0">Heads-up Cash Game — live gegeneinander spielen, das Haus verteilt die Karten.</p></div>
      ${canWrite() ? `<button class="btn btn-primary btn-sm" onclick="openNewOnlineTableModal()">+ Neuer Tisch</button>` : ''}
    </div>
    ${onlineTables.length ? rows : `<div class="panel"><div class="empty-state"><strong>Noch keine Online-Tische</strong>${canWrite() ? 'Leg oben einen neuen Tisch an.' : 'Wartet, bis jemand mit Schreibrechten einen Tisch anlegt.'}</div></div>`}
  `;
}
let onlineLobbyLoaded = false;

function openNewOnlineTableModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>Neuer Online-Tisch</h2>
        <p class="hint">Cash Game live gegeneinander spielen, das Haus verteilt die Karten (2 bis 10 Sitze).</p>
        <div class="field"><label>Sitzplätze</label>
          <select id="ot-seatcount">
            <option value="2" selected>Heads-up (2)</option>
            <option value="6">6-Max</option>
            <option value="10">10-Max</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>🔴 Chipset <span class="sublabel">${t('sublabel_optional')}</span></label>
            <select id="ot-chipset">
              <option value="">— keins —</option>
              ${(currentClub.chipProfiles||[]).filter(cp => cp.type==='cash').map(cp => `<option value="${cp.id}">${escapeHtml(cp.name || (formatMoney(cp.sb)+' / '+formatMoney(cp.bb)))}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>🎯 Bet-Raster <span class="sublabel">${t('sublabel_optional')}</span></label>
            <select id="ot-betgrid">
              <option value="">— Standard (Numblock) —</option>
              ${(currentClub.betGridProfiles||[]).filter(bg => bg.type==='cash').map(bg => `<option value="${bg.id}">${escapeHtml(bg.name)} (SB ${formatMoney(bg.targetSb||0)})</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>${t('label_sb')}</label><input id="ot-sb" type="number" min="0" step="0.05" value="0.5" placeholder="${t('placeholder_amount')}"></div>
          <div class="field"><label>${t('label_bb')}</label><input id="ot-bb" type="number" min="0" step="0.05" value="1" placeholder="${t('placeholder_amount')}"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
            <input type="checkbox" id="ot-seven-deuce" style="width:16px;height:16px;">🐍 7-2 Game (2 BB Bounty für 7-2-Gewinner)
          </label>
        </div>
        <div class="field"><label>${t('label_notes_optional')} <span class="sublabel">${t('sublabel_optional')}</span></label><textarea id="ot-notes" placeholder="${t('placeholder_notes')}"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">${t('btn_cancel')}</button>
          <button class="btn btn-primary" onclick="createOnlineTable()">${t('btn_create')}</button>
        </div>
      </div>
    </div>`;
}

async function createOnlineTable(){
  const sb_ = parseFloat(document.getElementById('ot-sb').value);
  const bb_ = parseFloat(document.getElementById('ot-bb').value);
  const seatCount = parseInt(document.getElementById('ot-seatcount').value, 10);
  // SB = BB ist erlaubt (z.B. 0.25/0.25); nur BB < SB ist sinnlos
  if(!(sb_ > 0) || !(bb_ > 0) || bb_ < sb_){ showToast('Big Blind darf nicht kleiner als Small Blind sein.'); return; }
  const options = {
    chipProfileId: document.getElementById('ot-chipset').value || null,
    betGridId: document.getElementById('ot-betgrid').value || null,
    sevenDeuceGame: document.getElementById('ot-seven-deuce').checked,
    notes: document.getElementById('ot-notes').value.trim()
  };
  const row = { club_id: currentClubId, small_blind: sb_, big_blind: bb_, seat_count: seatCount };
  let { error } = await sb.from('online_tables').insert({ ...row, options });
  if(error && /options/i.test(error.message || '')){
    // Spalte "options" fehlt noch (chipmate_online_table_options.sql nicht ausgeführt) → ohne Zusatzoptionen anlegen
    ({ error } = await sb.from('online_tables').insert(row));
  }
  if(error){ showToast('Fehler: ' + error.message); return; }
  closeModal();
  onlineLobbyLoaded = false;
  await loadOnlineTables();
}

// Jede Person wählt ihr eigenes Table-Designer-Layout für diesen Tisch — die Wahl ist rein
// persönlich (online_layout_prefs) und beeinflusst NICHT, was andere Sitzende sehen. layoutId bleibt
// ein unverbindlicher Verweis auf layoutTemplates (club_data-JSON); ein gelöschtes/ungültiges Layout
// fällt beim Rendern einfach auf den Standard-Tisch zurück.
async function setMyOnlineLayoutPref(tableId, layoutId){
  onlineMyLayoutPref = layoutId || null; // optimistisch, damit die Auswahl sofort sichtbar ist
  render();
  const { error } = await sb.from('online_layout_prefs').upsert(
    { table_id: tableId, user_id: currentUser.id, layout_id: layoutId || null, updated_at: new Date().toISOString() },
    { onConflict: 'table_id,user_id' }
  );
  if(error){ showToast('Fehler: ' + error.message); await loadMyOnlineLayoutPref(tableId); }
}

function deleteOnlineTablePrompt(tableId){
  showConfirmModal('Diesen Online-Tisch wirklich löschen? Das kann nicht rückgängig gemacht werden.', `reallyDeleteOnlineTable('${tableId}')`, 'Löschen');
}
async function reallyDeleteOnlineTable(tableId){
  const { error } = await sb.from('online_tables').delete().eq('id', tableId);
  if(error){ showToast('Fehler: ' + error.message); return; }
  await loadOnlineTables();
}

async function openOnlineTable(tableId){
  resetOnlineTableState();
  currentOnlineTableId = tableId;
  render();
  await Promise.all([refreshOnlineTableAndSeat(), loadMyOnlineLayoutPref(tableId)]);
  subscribeOnlineChannels();
}

// Lädt die eigene, persönliche Layout-Wahl für diesen Tisch (siehe online_layout_prefs) — getrennt
// von tbl.layout_id, das nur noch als Fallback für Leute ohne eigene Wahl dient.
async function loadMyOnlineLayoutPref(tableId){
  const { data, error } = await sb.from('online_layout_prefs').select('layout_id')
    .eq('table_id', tableId).eq('user_id', currentUser.id).maybeSingle();
  if(error){ console.error('loadMyOnlineLayoutPref failed', error); onlineMyLayoutPref = undefined; return; }
  // Keine Zeile = noch keine eigene Wahl getroffen (undefined, Fallback greift); Zeile vorhanden = die
  // eigene Wahl, auch wenn layout_id darin null ist (bewusst "Standard-Tisch" statt Tisch-Fallback).
  onlineMyLayoutPref = data ? (data.layout_id || null) : undefined;
  render();
}

async function refreshOnlineTableAndSeat(){
  const { data: seats } = await sb.from('online_seats').select('*').eq('table_id', currentOnlineTableId);
  const mine = (seats||[]).find(s => s.user_id === currentUser.id);
  onlineMySeat = mine ? mine.seat_no : null;
  const t = onlineTables.find(x => x.id === currentOnlineTableId);
  if(t) t.seats = (seats||[]).sort((a,b) => a.seat_no - b.seat_no);
  ensureOnlinePrivateChannel();
  if(onlineMySeat != null){
    const { data: pub } = await sb.rpc('get_public_hand_state', { p_table_id: currentOnlineTableId });
    onlineHandState = pub || null;
    const { data: cards } = await sb.rpc('get_my_hole_cards', { p_table_id: currentOnlineTableId });
    onlineMyHoleCards = cards || null;
  }
  render();
}

function subscribeOnlineChannels(){
  cleanupOnlineChannels();
  const tableId = currentOnlineTableId;
  // Sitzbelegung ist nicht per Realtime verbunden → alle 3 s nachsehen, ob jemand Platz genommen/aufgestanden ist
  const seatSig = (arr) => (arr||[]).map(x => `${x.seat_no}:${x.user_id}:${x.stack}`).sort().join('|');
  onlineSeatPollId = setInterval(async () => {
    if(currentOnlineTableId !== tableId || document.hidden || onlineBusy) return;
    const { data: seats } = await sb.from('online_seats').select('seat_no,user_id,stack').eq('table_id', tableId);
    if(currentOnlineTableId !== tableId || !seats) return;
    const t = onlineTables.find(x => x.id === tableId);
    if(seatSig(seats) !== seatSig(t && t.seats)){ await refreshOnlineTableAndSeat(); return; }
    // Sicherheitsnetz, falls ein Broadcast verpasst wurde (z.B. erst nach Hinsetzen abonniert): Handstatus abgleichen
    if(onlineMySeat != null){
      const { data: pub } = await sb.rpc('get_public_hand_state', { p_table_id: tableId });
      const sig = (h) => h ? `${h.hand_no}|${h.phase}|${h.current_seat}|${(h.board||[]).length}|${Object.keys(h.bets||{}).sort().map(k => k+':'+Number(h.bets[k])).join(',')}` : '';
      if(currentOnlineTableId === tableId && sig(pub) !== sig(onlineHandState)){ await refreshOnlineTableAndSeat(); }
    }
  }, 3000);
  onlinePublicChannel = sb.channel(`table:${tableId}:public`)
    .on('broadcast', { event: 'state' }, (msg) => {
      if(currentOnlineTableId !== tableId) return;
      // Edge Functions broadcasten aufgedeckte Karten als "revealed_hole_cards";
      // get_public_hand_state() (initialer Ladevorgang) nennt dasselbe Feld
      // "hole_cards" — hier auf einen gemeinsamen Namen normalisieren, damit
      // renderOnlineTableView() nicht zwischen den beiden Quellen unterscheiden muss.
      // Seit der automatischen Mehrweg-Showdown-Regel (nur Aggressor + echte Pot-
      // Gewinner werden aufgedeckt) enthält revealed_hole_cards NICHT mehr zwingend
      // den eigenen Sitz — die eigenen Karten kommen ausschliesslich über den
      // privaten Kanal unten, hier NICHT mehr überschreiben (sonst würden die
      // eigenen Karten fälschlich ausgeblendet, sobald man selbst mucken "würde").
      onlineHandState = { ...msg.payload, hole_cards: msg.payload.revealed_hole_cards || {} };
      render();
    })
    .subscribe();
  ensureOnlinePrivateChannel();
}

// Privater Hole-Card-Kanal: wird nach dem Hinsetzen nachträglich abonniert (nicht nur beim Öffnen des Tisches)
let onlinePrivateChannelSeat = null;
function ensureOnlinePrivateChannel(){
  const tableId = currentOnlineTableId;
  if(onlineMySeat == null || !tableId) return;
  if(onlinePrivateChannel && onlinePrivateChannelSeat === onlineMySeat) return;
  if(onlinePrivateChannel){ sb.removeChannel(onlinePrivateChannel); onlinePrivateChannel = null; }
  onlinePrivateChannelSeat = onlineMySeat;
  onlinePrivateChannel = sb.channel(`table:${tableId}:seat:${onlineMySeat}`, { config: { private: true } })
    .on('broadcast', { event: 'hole_cards' }, (msg) => {
      if(currentOnlineTableId !== tableId) return;
      onlineMyHoleCards = msg.payload.cards;
      render();
    })
    .subscribe();
}

async function takeOnlineSeat(seatNo){
  const player = myPlayer();
  if(!player){
    alert('Dein Login ist noch keinem Spieler aus eurer Liste zugeordnet. Nur ein Club-Admin kann das verknüpfen (Players-Tab → Spieler bearbeiten → "Verknüpfter Login"). Damit stellen wir sicher, dass niemand für einen anderen Spieler mitspielen kann.');
    return;
  }
  const buyin = prompt(`Buy-in für ${fullName(player)} (Startstack)?`, '100');
  if(buyin == null) return;
  const amount = parseFloat(buyin);
  if(!(amount > 0)){ showToast('Ungültiger Betrag.'); return; }
  const { error } = await sb.from('online_seats').insert({ table_id: currentOnlineTableId, seat_no: seatNo, user_id: currentUser.id, user_email: currentUser.email, player_id: player.id, buyin_total: amount, stack: amount });
  if(error){ showToast('Platz konnte nicht belegt werden: ' + error.message); return; }
  await refreshOnlineTableAndSeat();
  subscribeOnlineChannels();
}

function leaveOnlineSeat(){
  showConfirmModal('Platz wirklich verlassen?', 'reallyLeaveOnlineSeat()', 'Verlassen');
}
async function reallyLeaveOnlineSeat(){
  await sb.from('online_seats').delete().eq('table_id', currentOnlineTableId).eq('user_id', currentUser.id);
  resetOnlineTableState();
  onlineLobbyLoaded = false;
  setView('online');
}

function backToOnlineLobby(){
  resetOnlineTableState();
  onlineLobbyLoaded = false;
  setView('online');
}

// "Tisch schliessen": überträgt die Buy-ins/Endstände der Online-Session als
// normale Cash-Session nach currentClub.sessions, genau wie eine Live-Session
// (siehe submitNewSession/confirmAddParticipantCash/netFor) — Bilanz & Co.
// berechnen sich automatisch aus chipCount − sum(buyIns), keine Sonderlogik
// nötig. Einzelne Hände werden NICHT übernommen (nur das Gesamtresultat),
// weil das Hands-Schema eng an die Live-Tisch-UI gekoppelt ist.
function closeOnlineTable(){
  const tbl = onlineTables.find(x => x.id === currentOnlineTableId);
  if(!tbl) return;
  const seated = tbl.seats.filter(s => s.user_id);
  if(seated.length < 2){ showToast('Tisch braucht zwei besetzte Plätze.'); return; }
  if(seated.some(s => !s.player_id)){ showToast('Mindestens ein Platz ist keinem verknüpften Spieler zugeordnet — Ergebnis kann nicht übernommen werden.'); return; }
  const summary = seated.map(s => `${onlineSeatPlayerName(s)}: ${formatMoney(s.stack)} (Buy-in ${formatMoney(s.buyin_total)})`).join('\n');
  showConfirmModal(`Tisch schliessen und folgendes Ergebnis in die Statistik übernehmen?\n\n${summary}\n\nDas kann danach nicht mehr rückgängig gemacht werden.`, 'reallyCloseOnlineTable()', 'Schliessen & übernehmen');
}
async function reallyCloseOnlineTable(){
  const tbl = onlineTables.find(x => x.id === currentOnlineTableId);
  if(!tbl || !canWrite()){ showToast('Dafür fehlen dir Schreibrechte im Club.'); return; }
  const seated = tbl.seats.filter(s => s.user_id);
  const nowIso = new Date().toISOString();
  const session = {
    id: uid(), type:'cash', date: todayLocalISO(), venue:'Online', notes:'Online-Tisch (automatisch aus Chipmate Online Poker übernommen)',
    pin: String(Math.floor(1000+Math.random()*9000)),
    sb: tbl.small_blind, bb: tbl.big_blind, ante:0,
    blindTemplateId:null, blindLevelIndex:0, blindStartedAt:null, blindManualOffsetMs:0,
    buyinAmount:null, startChips:null, rebuyAmount:null, rebuyChips:null, addonAmount:null, addonChips:null,
    payoutMode:'percent', payoutPlaces:[100], payoutTemplateId:null,
    status:'closed', seatOrder: seated.map(s => s.player_id), handCounter:0,
    participants: seated.map(s => ({
      playerId: s.player_id,
      buyIns: [{ id: uid(), time: nowIso, amount: Number(s.buyin_total||0), currency: currentClub.info.currency, method:'Online' }],
      chipCount: Number(s.stack||0),
      active:false, joinedAt:nowIso, leftAt:nowIso, finishRank:null
    })),
    actualCash:null, actualTwint:null, sevenDeuceGame:false, chipProfileId:null, betGridProfileId:null,
    equilibriumConfirmed:true, cashConfirmed:true, ranksConfirmed:false, payoutsConfirmed:false,
    createdAt: nowIso
  };
  currentClub.sessions.push(session);
  await saveClubData();
  const { error } = await sb.from('online_tables').update({ status:'finished' }).eq('id', currentOnlineTableId);
  if(error) showToast('Session übernommen, aber Tisch-Status konnte nicht aktualisiert werden: ' + error.message);
  else showToast('Session übernommen — siehe Sessions-Tab.');
  resetOnlineTableState();
  onlineLobbyLoaded = false;
  setView('sessions');
}

async function addOnlineBuyin(){
  const amt = prompt('Zusätzlicher Buy-in (Nachkauf)?', '50');
  if(amt == null) return;
  const amount = parseFloat(amt);
  if(!(amount > 0)){ showToast('Ungültiger Betrag.'); return; }
  const { error } = await sb.rpc('add_online_buyin', { p_table_id: currentOnlineTableId, p_amount: amount });
  if(error){ showToast('Fehler: ' + error.message); return; }
  await refreshOnlineTableAndSeat();
  showToast('Nachkauf gebucht.');
}

async function callStartHand(){
  if(onlineBusy) return;
  onlineBusy = true;
  try{
    const { data, error } = await sb.functions.invoke('start_hand', { body: { table_id: currentOnlineTableId } });
    if(error || (data && data.error)){ showToast('Fehler: ' + (data?.error || error.message)); return; }
    await refreshOnlineTableAndSeat();
  } finally { onlineBusy = false; }
}

async function callSubmitAction(action, amount){
  if(onlineBusy) return;
  onlineBusy = true;
  try{
    const body = { table_id: currentOnlineTableId, action };
    if(amount != null) body.amount = amount;
    const { data, error } = await sb.functions.invoke('submit_action', { body });
    if(error || (data && data.error)){ showToast('Fehler: ' + (data?.error || error.message)); return; }
  } finally { onlineBusy = false; }
}

function onlineSeatPlayerName(seat){
  if(!seat || !seat.user_id) return null;
  if(seat.player_id){
    const p = currentClub.players.find(x => x.id === seat.player_id);
    if(p) return fullName(p);
  }
  return seat.user_email || null; // Rückfall, falls (noch) kein verknüpfter Spieler
}
function onlineSeatLabel(seatNo){
  const tbl = onlineTables.find(x => x.id === currentOnlineTableId);
  const seat = tbl ? tbl.seats.find(s => s.seat_no === seatNo) : null;
  if(!seat || !seat.user_id) return 'Frei';
  const name = onlineSeatPlayerName(seat);
  return escapeHtml(name || ('Spieler ' + (seatNo+1))) + (seat.user_id === currentUser.id ? ' (Du)' : '');
}

// Baut EINEN Sitzplatz für die grosse ovale Tisch-Grafik. Konsumiert dieselben
// reichhaltigen Slot-Objekte wie renderHandFlowUI() (via getSeatSlotsForRender),
// damit ein eigenes Table-Designer-Layout (Sitzgrafik, Name-/Stack-/Holecards-
// Position, Textfarbe etc.) am Online-Tisch GENAU so greift wie im
// Handerfassungsmodus — siehe dort für die ausführliche Begründung von
// useAbsoluteBox/useAbsoluteName/useAbsoluteStack. Ohne gewähltes Layout liefert
// getSeatSlotsForRender die generische Kreis-Position (seatPositions), die
// Darstellung bleibt dann wie zuvor.
function onlinePokerSeatHtml(slot, seatRow, seatNo, hs, isMe){
  const useAbsoluteBox = slot.boxX != null && slot.boxY != null;
  const useAbsoluteName = slot.nameX != null && slot.nameY != null;
  const useAbsoluteStack = slot.stackX != null && slot.stackY != null;
  const textColor = slot.textColor || tableSettings.nameColor;

  if(!seatRow || !seatRow.user_id){
    const nameInnerHtml = `<div class="seat-name" style="color:${textColor};transform:scale(${slot.nameScale});transform-origin:center;">Frei</div>`;
    const standaloneNameHtml = useAbsoluteName ? `<div style="position:absolute;left:${slot.nameX}%;top:${slot.nameY}%;transform:translate(-50%,-50%);z-index:5;max-width:16cqw;">${nameInnerHtml}</div>` : '';
    const platePlateHtml = `<div class="seat-plate" ${slot.seatAttrs||''} style="${seatPlateBgStyleAttr(slot, useAbsoluteBox)}">${!useAbsoluteName ? nameInnerHtml : ''}</div>`;
    return `
      <div class="poker-seat" ${slot.seatAttrs||''} style="left:${slot.left}%;top:${slot.top}%;width:${avatarSizePercent(slot.avatarScale)}%;opacity:.45;z-index:${slot.zAvatar!=null?slot.zAvatar:2};">
        ${!useAbsoluteBox ? platePlateHtml : ''}
      </div>${useAbsoluteBox ? platePlateHtml : ''}${standaloneNameHtml}`;
  }

  const playerObj = seatRow.player_id ? currentClub.players.find(x => x.id === seatRow.player_id) : null;
  const displayObj = playerObj || { firstName: seatRow.user_email || 'Spieler', lastName:'', avatarColor:'#8A8A8A' };
  const phase = hs ? hs.phase : 'waiting';
  const isActor = hs && hs.current_seat === seatNo && ['preflop','flop','turn','river'].includes(phase);
  const folded = hs && hs.folded && hs.folded[String(seatNo)];
  const isAllIn = hs && hs.all_in && hs.all_in[String(seatNo)] && !folded;
  const isDealer = hs && hs.dealer_seat === seatNo;
  // Welche Hole Cards gezeigt werden, hängt NICHT mehr von einem pauschalen "revealAll"
  // ab: hs.hole_cards enthält serverseitig ab dem Showdown nur noch die Karten der
  // Sitze, die tatsächlich aufgedeckt wurden (letzter Aggressor + echte Pot-Gewinner,
  // siehe resolveMultiwayShowdown in _shared/poker.ts) — ein schlechteres, verdecktes
  // Blatt taucht in hs.hole_cards also schlicht nie auf und bleibt hier automatisch
  // als Kartenrücken dargestellt.
  let cardsHtml = '';
  if(folded){
    cardsHtml = '';
  } else if(isMe && onlineMyHoleCards){
    cardsHtml = onlineMyHoleCards.map(cardChipHtml).join('');
  } else if(hs && hs.hole_cards && hs.hole_cards[String(seatNo)]){
    cardsHtml = hs.hole_cards[String(seatNo)].map(cardChipHtml).join('');
  } else if(!isMe){
    cardsHtml = blankCardHtml() + blankCardHtml();
  }

  const nameInnerHtml = `<div class="seat-name${isActor?' seat-turn-blink':''}" style="color:${textColor};transform:scale(${slot.nameScale});transform-origin:center;">${escapeHtml(fullName(displayObj))}${isMe?' (Du)':''}</div>`;
  const statusBadge = folded ? `<div class="action-badge" style="background:#8A8A8A;">FOLD</div>` : (isAllIn ? `<div class="action-badge" style="background:var(--brass);">ALL-IN</div>` : '');
  const stackRowHtml = `<div class="stack-row"><div class="seat-stack">${fmtChipPlain(seatRow.stack)}</div></div>${statusBadge}`;
  const stackInnerHtml = `<div class="${isActor?'seat-turn-blink':''}" style="color:${textColor};transform:scale(${slot.stackScale});transform-origin:center;">${stackRowHtml}</div>`;
  const standaloneNameHtml = useAbsoluteName ? `<div style="position:absolute;left:${slot.nameX}%;top:${slot.nameY}%;transform:translate(-50%,-50%);z-index:5;max-width:16cqw;">${nameInnerHtml}</div>` : '';
  const standaloneStackHtml = useAbsoluteStack ? `<div style="position:absolute;left:${slot.stackX}%;top:${slot.stackY}%;transform:translate(-50%,-50%);z-index:5;">${stackInnerHtml}</div>` : '';
  // Vertikaler Anker wie bei renderHandFlowUI: im Showdown dürfen die aufgedeckten
  // Karten komplett sichtbar sein (-55%), sonst wachsen sie überwiegend nach unten (-20%).
  const holeCardsVAnchor = (phase === 'showdown' || phase === 'done') ? -55 : -20;
  const standaloneHoleCardsHtml = (!folded && cardsHtml) ? `<div class="seat-holecards${slot.holeCardsCompact?' compact':''}" style="position:absolute;left:${slot.holeCardsX}%;top:${slot.holeCardsY}%;transform:translate(-50%,${holeCardsVAnchor}%) scale(${slot.holeCardsScale});z-index:${slot.zHoleCards!=null?slot.zHoleCards:3};">${cardsHtml}</div>` : '';
  const platePlateHtml = `
    <div class="seat-plate" ${slot.seatAttrs||''} style="${seatPlateBgStyleAttr(slot, useAbsoluteBox)}">
      ${!useAbsoluteName ? nameInnerHtml : ''}
      ${!useAbsoluteStack ? stackInnerHtml : ''}
    </div>`;
  const standalonePosTagHtml = isDealer ? `<div class="pos-tag" style="position:absolute;left:${slot.posTagX}%;top:${slot.posTagY}%;transform:translate(-50%,-50%) rotate(${slot.posTagRotation}deg) scale(${slot.posTagScale});z-index:5;background:${tableSettings.posColor};color:#fff;">BTN</div>` : '';

  return `
    <div class="poker-seat${folded?' folded':''}${isActor?' active':''}" ${slot.seatAttrs||''} style="left:${slot.left}%;top:${slot.top}%;width:${avatarSizePercent(slot.avatarScale)}%;z-index:${slot.zAvatar!=null?slot.zAvatar:2};">
      ${avatarHtml(displayObj, avatarSeatStyleAttr(slot.avatarScale, slot.zAvatar))}
      ${!useAbsoluteBox ? platePlateHtml : ''}
    </div>${useAbsoluteBox ? platePlateHtml : ''}${standaloneNameHtml}${standaloneStackHtml}${standaloneHoleCardsHtml}${standalonePosTagHtml}`;
}

// ---- Persönliches Tisch-Design für Online-Tische (nur lokal in diesem Browser, wirkt nur auf die eigene Ansicht) ----
const ONLINE_DESIGN_DEFAULTS = { deck:null, felt:null, holeScale:1, boardScale:1, nameScale:1, stackScale:1 };
let onlineDesignCache = null;
function onlineDesignKey(){ return 'chipmate_onlinedesign_' + (currentUser ? currentUser.id : 'anon'); }
function getOnlineDesign(){
  if(!onlineDesignCache){
    let d = {};
    try{ d = JSON.parse(localStorage.getItem(onlineDesignKey()) || '{}') || {}; }catch(e){ d = {}; }
    onlineDesignCache = Object.assign({}, ONLINE_DESIGN_DEFAULTS, d);
  }
  return onlineDesignCache;
}
function setOnlineDesign(patch, rerender){
  onlineDesignCache = Object.assign({}, getOnlineDesign(), patch);
  try{ localStorage.setItem(onlineDesignKey(), JSON.stringify(onlineDesignCache)); }catch(e){}
  if(rerender !== false) render();
}
function resetOnlineDesign(){
  onlineDesignCache = Object.assign({}, ONLINE_DESIGN_DEFAULTS);
  try{ localStorage.removeItem(onlineDesignKey()); }catch(e){}
  closeModal(); render();
}
function openOnlineDesignModal(){

        <div class="field-row">

              <option value="4color" ${d.deck==='4color'?'selected':''}>4-Farben (besser lesbar)</option>
            </select>
          </div>
          <div class="field"><label>Filzfarbe</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input type="color" value="${d.felt || tableSettings.felt}" onchange="setOnlineDesign({felt: this.value})" style="width:44px;height:30px;padding:0;border:none;background:none;">

// Überschreibt die globalen Tisch-Einstellungen nur für die Dauer des Online-Renderns
let onlineDesignActive = null;
function renderOnlineTableView(){
  const d = getOnlineDesign();
  const saved = { deck: tableSettings.deck, felt: tableSettings.felt, nameSizeScale: tableSettings.nameSizeScale, stackSizeScale: tableSettings.stackSizeScale };
  if(d.deck) tableSettings.deck = d.deck;
  if(d.felt) tableSettings.felt = d.felt;
  tableSettings.nameSizeScale = (saved.nameSizeScale||1) * d.nameScale;
  tableSettings.stackSizeScale = (saved.stackSizeScale||1) * d.stackScale;
  onlineDesignActive = d;
  try{ return renderOnlineTableViewInner(); }
  finally{
    onlineDesignActive = null;
    tableSettings.deck = saved.deck; tableSettings.felt = saved.felt;
    tableSettings.nameSizeScale = saved.nameSizeScale; tableSettings.stackSizeScale = saved.stackSizeScale;
  }
}
function renderOnlineTableViewInner(){
  const tbl = onlineTables.find(x => x.id === currentOnlineTableId);
  if(!tbl) return `<div class="panel"><div class="empty-state">Tisch wird geladen…</div></div>`;
  if(onlineMySeat == null) return renderOnlineSeatPicker(tbl);
  const hs = onlineHandState;
  const phase = hs ? hs.phase : 'waiting';
  const seatCount = tbl.seat_count || 2;
  const seatedRows = tbl.seats.filter(s => s.user_id);
  const mySeatRow = tbl.seats.find(s => s.seat_no === onlineMySeat);
  const isFinished = tbl.status === 'finished';
  // "Hand starten" braucht mindestens zwei besetzte Sitze MIT Stack > 0 (siehe deal_hand
  // SQL-Funktion) — funktioniert jetzt für 2 bis seat_count Sitze, nicht mehr nur Heads-up.
  const stackedSeats = seatedRows.filter(s => Number(s.stack || 0) > 0);
  const canStart = !isFinished && (!hs || phase === 'done' || phase === 'waiting') && stackedSeats.length >= 2;
  const canClose = !isFinished && (!hs || phase === 'done' || phase === 'waiting') && seatedRows.length >= 2 && seatedRows.every(s => s.player_id);

  const myBet = hs && hs.bets ? (hs.bets[String(onlineMySeat)] || 0) : 0;
  const currentMaxBet = hs && hs.bets ? Math.max(0, ...Object.values(hs.bets).map(Number)) : 0;
  const toCall = currentMaxBet - myBet;
  const myTurn = hs && hs.current_seat === onlineMySeat && ['preflop','flop','turn','river'].includes(phase);
  const actorSeatRow = hs && ['preflop','flop','turn','river'].includes(phase) ? tbl.seats.find(s => s.seat_no === hs.current_seat) : null;

  // Eigenes Table-Designer-Layout statt generischer Oval-Positionen — identisch zum
  // Handerfassungsmodus (dort: getActiveLayout(sessionId)/getSeatSlotsForRender).
  // Online-Tische haben keine echte Session-id, darum per layoutOverride direkt das
  // gewählte Layout reinreichen, statt über sessionLayoutMap zu gehen. Nur Layouts mit genau so
  // vielen Sitzen wie der Tisch sind sinnvoll.
  // Persönliche Wahl geht vor gemeinsamem Tisch-Default: onlineMyLayoutPref ist undefined, solange
  // diese Person noch nie selbst gewählt hat (dann zählt tbl.layout_id als Fallback) — ist es null,
  // war das eine bewusste "Standard-Tisch"-Wahl und übersteuert den Fallback ebenfalls.
  const matchingLayouts = layoutTemplates.filter(lt => lt.seatCount === seatCount);
  const effectiveLayoutId = onlineMyLayoutPref !== undefined ? onlineMyLayoutPref : tbl.layout_id;
  const chosenLayout = effectiveLayoutId ? matchingLayouts.find(lt => lt.id === effectiveLayoutId) || null : null;
  const slots = getSeatSlotsForView(seatCount, null, chosenLayout, onlineMySeat);
  // getSeatSlotsForRender(seatCount, null, chosenLayout) already passes chosenLayout explicitly as
  // layoutOverride, so a null chosenLayout correctly falls through to the generic seatPositions(n)
  // circle inside that function (sessionId=null there is harmless). tableFeltStyleAttr() is
  // different: it does `layoutOverride || getActiveLayout()`, and a falsy chosenLayout would make it
  // fall back to getActiveLayout() with NO sessionId — which can resolve to whatever layout is active
  // for an unrelated Hands-tab session (handsSelectedSessionId). Passing {} instead of null below
  // keeps tableFeltStyleAttr on its "no custom layout" default-felt branch without that leak.

  const seatsHtml = Array.from({length: seatCount}, (_, seatNo) => {
    const seatRow = tbl.seats.find(s => s.seat_no === seatNo);
    const isMe = seatNo === onlineMySeat;
    const bet = hs && hs.bets ? (hs.bets[String(seatNo)] || 0) : 0;
    const slotView = Object.assign({}, slots[seatNo], { seatAttrs: seatDataAttrs(seatNo, slots.viewMeta, onlineMySeat, seatRow && seatRow.player_id) });
    return onlinePokerSeatHtml(slotView, seatRow, seatNo, hs, isMe)
      + (seatRow && bet > 0.0001 ? betLineChipHtml(slots[seatNo], bet, null) : '');
  }).join('');

  return `
    <div class="view-head">
      <div><h1>Online-Tisch</h1><p class="lede" style="margin-bottom:0">Blinds ${formatMoney(tbl.small_blind)} / ${formatMoney(tbl.big_blind)} · ${seatCount} Sitze${hs && hs.hand_no ? ` · Hand #${hs.hand_no}` : ''}${isFinished ? ' · Tisch abgeschlossen' : ''}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">

        ${!isFinished ? `<button class="btn btn-secondary btn-sm" onclick="leaveOnlineSeat()">Platz verlassen</button>` : ''}
      </div>
    </div>
    ${isFinished ? `<div class="panel" style="text-align:center;background:var(--btn-secondary-bg);"><strong>Dieser Tisch ist geschlossen.</strong> Das Ergebnis wurde als Session in die Statistik übernommen.</div>` : ''}
    <div class="hand-flow-split">
      <div class="panel table-pane" style="margin-bottom:0;padding:0;position:relative;">
        <div class="table-bg-wrap" style="${tableOuterBgStyleAttr(null, chosenLayout || {})}padding:10px;">
          <div class="poker-table-oval" style="${tableFeltStyleAttr(chosenLayout || {})}">
            ${chosenLayout && !chosenLayout.bettingLineHidden ? bettingLineOverlayHtml(chosenLayout) : ''}
            ${seatsHtml}
            <div class="board-center" style="${chosenLayout && chosenLayout.boardX!=null && chosenLayout.boardY!=null ? `left:${chosenLayout.boardX}%;top:${chosenLayout.boardY}%;transform:translate(-50%,-50%);` : ''}">
              ${hs && hs.board && hs.board.length ? `<div class="board-cards">${hs.board.map(cardChipHtml).join('')}</div>` : ''}
            </div>
            <div class="pot-center" style="${chosenLayout && chosenLayout.potX!=null && chosenLayout.potY!=null ? `left:${chosenLayout.potX}%;top:${chosenLayout.potY}%;transform:translate(-50%,-50%);` : ''}">
              <div class="amt">${fmtChipPlain(hs ? hs.pot : 0)}</div>
              <div class="lbl">Pot</div>
            </div>
          </div>
        </div>
        <div style="position:absolute;bottom:16px;left:16px;display:flex;gap:8px;align-items:center;z-index:8;">
          ${!isFinished && matchingLayouts.length ? `
          <select onchange="setMyOnlineLayoutPref('${tbl.id}', this.value||null)" style="font-size:12px;padding:5px 6px;border-radius:6px;" title="Dein persönliches Tisch-Layout — gilt nur für deine eigene Ansicht">
            <option value="">Standard-Tisch</option>
            ${matchingLayouts.map(lt => `<option value="${lt.id}" ${chosenLayout && chosenLayout.id===lt.id ? 'selected':''}>${escapeHtml(lt.name)}</option>`).join('')}
          </select>` : ''}
          <button class="btn btn-sm" style="padding:5px 10px;font-size:12px;background:var(--brass);color:#fff;border-color:var(--brass);" onclick="openOnlineDesignModal()">🎨 Design</button>
        </div>
      </div>
      <div class="panel action-pane light" style="margin-bottom:0;position:relative;padding-top:14px;">
        ${hs && hs.hand_no ? `<span class="street-pill">Hand #${hs.hand_no} · ${({preflop:'Preflop',flop:'Flop',turn:'Turn',river:'River',showdown:'Showdown',done:'Beendet'})[phase] || phase}</span>` : ''}
        ${canStart || canClose ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;">
          ${canStart ? `<button class="btn btn-primary" onclick="callStartHand()">${hs && hs.hand_no ? 'Nächste Hand starten' : 'Hand starten'}</button>` : ''}
          ${canClose ? `<button class="btn btn-secondary" onclick="closeOnlineTable()">Tisch schliessen &amp; Ergebnis übernehmen</button>` : ''}
        </div>` : ''}
        ${(!hs || !hs.hand_no) && seatedRows.length >= 2 && !seatedRows.every(s => s.player_id) ? `<p class="lede" style="font-size:12px;">Hinweis: Ohne verknüpften Spieler (siehe Players-Tab) kann dieser Tisch später nicht in die Statistik übernommen werden.</p>` : ''}
        ${hs && hs.hand_over && hs.payouts ? `<div class="status-banner ok" style="margin:10px 0;"><strong>${renderOnlinePayoutSummary(hs.payouts)}</strong></div>` : ''}
        ${myTurn ? renderOnlineActionBar(toCall, mySeatRow ? mySeatRow.stack : 0, hs, tbl)
                 : (hs && ['preflop','flop','turn','river'].includes(phase) ? `<div style="text-align:center;color:var(--ink-soft);padding:16px 0;">Warte auf ${escapeHtml(onlineSeatLabel(hs.current_seat))}…</div>` : '')}
      </div>

  `;
}

// Zeigt, wer die(se) Hand gewonnen hat — payouts ist {seatNo: Betrag}, von
// resolveMultiwayShowdown bzw. dem Fold-Kurzschluss geliefert (siehe
// submit_action Edge Function). Mehrere Einträge = Split-Pot/Side-Pots.
function renderOnlinePayoutSummary(payouts){
  const entries = Object.keys(payouts).filter(s => payouts[s] > 0.0001);
  if(!entries.length) return '';
  const parts = entries.map(seatNo => {
    const isMe = Number(seatNo) === onlineMySeat;
    return `${escapeHtml(onlineSeatLabel(Number(seatNo)))}: +${formatMoney(payouts[seatNo])}${isMe ? ' (Du)' : ''}`;
  });
  return (entries.length > 1 ? 'Split Pot — ' : '') + parts.join(' · ');
}

// Online-Aktionsfeld: gleicher Aufbau wie in der Handerfassung (Fold / Check|Call / Bet|Raise, All-in,
// Betrags-Box mit Bet-Raster des Tisches oder Numblock)
let onlineBetBoxLabel = null;   // null = Betrags-Box zu; sonst "Bet" / "Raise"
let onlineBetInputVal = '';
function onlineBetGridProfile(){
  const tbl = onlineTables.find(x => x.id === currentOnlineTableId);
  const id = tbl && tbl.options && tbl.options.betGridId;
  return id ? ((currentClub.betGridProfiles||[]).find(p => p.id === id) || null) : null;

function renderOnlineActionBar(toCall, myStack, hs, tbl){
  const myBet = hs.bets ? Number(hs.bets[String(onlineMySeat)] || 0) : 0;
  const currentMaxBet = hs.bets ? Math.max(0, ...Object.values(hs.bets).map(Number)) : 0;
  const minRaiseTotal = currentMaxBet + (hs.last_raise_size || 0);
  const stack = Number(myStack || 0);
  const allInTotal = myBet + stack;
  const canFullyCall = stack >= toCall - 0.001;
  const canRaise = stack > toCall + 0.001;
  const label = currentMaxBet > 0.0001 ? 'Raise' : 'Bet';
  const btnStyle = 'flex:1;min-width:0;padding:8px 6px;';
  let checkCallBtn, raiseBtn = '', allinBtn = '';
  if(toCall > 0.001 && !canFullyCall){
    checkCallBtn = `<button class="btn btn-primary" style="${btnStyle}" onclick="callSubmitAction('call')">All-in Call ${fmtChipPlain(stack)}</button>`;
    raiseBtn = `<button class="btn btn-secondary action-disabled" style="${btnStyle}" disabled title="Stack reicht nicht für einen Call">${label} <span class="x-mark">✕</span></button>`;
  } else {
    checkCallBtn = toCall <= 0.001
      ? `<button class="btn btn-primary" style="${btnStyle}" onclick="callSubmitAction('check')">Check</button>`
      : `<button class="btn btn-primary" style="${btnStyle}" onclick="callSubmitAction('call')">Call ${fmtChipPlain(toCall)}</button>`;
    if(canRaise){
      raiseBtn = `<button class="btn btn-primary" style="${btnStyle}" onclick="openOnlineBetBox('${label}')">${label}</button>`;
      allinBtn = `<button onclick="onlineAllIn(${allInTotal}, ${toCall})" style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;background:var(--felt-dark);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-weight:800;font-size:14px;cursor:pointer;"><span>All-in</span><span>${fmtChipPlain(stack)}</span></button>`;
    } else {
      raiseBtn = `<button class="btn btn-secondary action-disabled" style="${btnStyle}" disabled title="Kein weiterer Stack für einen Raise">${label} <span class="x-mark">✕</span></button>`;
    }
  }
  const boxHtml = onlineBetBoxLabel && canRaise ? onlineBetBoxHtml(onlineBetBoxLabel, minRaiseTotal, allInTotal, tbl) : '';
  return `
    <div style="font-weight:700;font-size:16px;margin:10px 0 14px;">Du bist am Zug</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-primary" style="${btnStyle}" onclick="onlineRequestFold(${toCall})">Fold</button>
      ${checkCallBtn}
      ${raiseBtn}
    </div>
    ${allinBtn}
    <div id="bet-amount-box">${boxHtml}</div>`;
}
function onlineBetBoxHtml(label, minTo, allInTotal, tbl){
  return `
    <div style="max-width:440px;margin:16px auto 0;">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Min. ${label}: ${fmtChip(minTo)}</div>
      <div id="bet-amount-grids">${betAmountGridsHtml()}</div>
      <div class="field-row" style="align-items:flex-end;margin-top:14px;">
        <div class="field" style="margin-bottom:0;"><label>Betrag (gesamt)</label><input id="bet-amount-input" type="number" min="0" step="0.05" value="${onlineBetInputVal}" oninput="onlineBetInputVal=this.value" placeholder="${fmtChip(minTo)}"></div>
        <button class="btn btn-primary btn-sm" onclick="confirmOnlineBet(${minTo}, ${allInTotal})">${t('btn_confirm_amount')}</button>
      </div>
      <div id="bet-amount-error"></div>
    </div>`;
}
function openOnlineBetBox(label){
  onlineBetBoxLabel = label;
  onlineBetInputVal = '';
  betBoxAmountStr = ''; betBoxSelectedMain = null; betBoxSelectedRappen = null;
  render();
}
function confirmOnlineBet(minTo, allInTotal){
  const amt = Number(document.getElementById('bet-amount-input').value || 0);
  const err = document.getElementById('bet-amount-error');
  if(!amt || amt <= 0){ err.innerHTML = `<div class="error-msg" style="margin-top:8px;">Bitte einen Betrag eingeben.</div>`; return; }
  if(amt < minTo - 0.001 && amt < allInTotal - 0.001){ err.innerHTML = `<div class="error-msg" style="margin-top:8px;">Mindestens ${fmtChip(minTo)} (oder All-in).</div>`; return; }
  const total = Math.min(amt, allInTotal);
  onlineBetBoxLabel = null; onlineBetInputVal = '';
  const hs = onlineHandState;
  const maxBet = hs && hs.bets ? Math.max(0, ...Object.values(hs.bets).map(Number)) : 0;
  callSubmitAction(maxBet > 0.0001 ? 'raise' : 'bet', total);
}
function onlineAllIn(allInTotal, toCall){
  onlineBetBoxLabel = null; onlineBetInputVal = '';
  const hs = onlineHandState;
  const maxBet = hs && hs.bets ? Math.max(0, ...Object.values(hs.bets).map(Number)) : 0;
  callSubmitAction(maxBet > 0.0001 ? 'raise' : 'bet', allInTotal);
}
// Fold nur bestätigen, wenn man stattdessen kostenlos checken könnte (wie in der Handerfassung)
function onlineRequestFold(toCall){
  onlineBetBoxLabel = null;
  if(toCall > 0.001){ callSubmitAction('fold'); return; }
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:380px;">
        <h2>Wirklich folden?</h2>
        <p class="lede" style="margin-top:-6px;">Du könntest kostenlos checken. Sicher, dass du folden willst?</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal(); callSubmitAction('check')">Check</button>
          <button class="btn btn-primary" onclick="closeModal(); callSubmitAction('fold')">Ja, Fold</button>
        </div>
      </div>
    </div>`;
}

/* ================= Einladungslinks (Club beitreten + Spieler verknüpfen in einem Schritt) =================
   Ein Admin generiert pro Spieler-Eintrag einen Link wie .../?joincode=ABCDE&invite=<token>
   (siehe generateInviteLink). Öffnet die eingeladene Person diesen Link, nachdem sie sich
   eingeloggt hat, passiert automatisch: Club-Beitritt per Code (bestehender Mechanismus,
   enterClubByCode) + Verknüpfung des Spieler-Eintrags mit ihrer E-Mail (statt dass ein Admin
   das manuell im Players-Tab nachträgt). Falls der Beitritt noch auf Freischaltung durch einen
   Admin wartet, wird das Invite-Token in localStorage gemerkt und beim nächsten normalen
   Öffnen des Clubs (in enterClubUI) nachgeholt — die Person muss den Link dann nicht nochmal
   anklicken. */
function getUrlParam(name){
  try { return new URLSearchParams(window.location.search).get(name); } catch(e){ return null; }
}
async function handleInviteLinkIfPresent(){
  const joincode = getUrlParam('joincode');
  const invite = getUrlParam('invite');
  if(!joincode){ renderMyClubsList(); return; }
  if(invite) localStorage.setItem('chipmate_pending_invite_' + joincode, invite);
  const result = await enterClubByCode(joincode);
  if(!result.ok){ showToast(result.reason==='data_missing' ? ('Club-Daten konnten nicht geladen werden: ' + result.detail) : 'Einladungslink ungültig — Club nicht gefunden.'); renderMyClubsList(); return; }
  if(!result.joined){
    showToast(`Beitrittsanfrage für "${result.clubName}" gesendet — wartet auf Freischaltung durch einen Admin. Öffne die App danach einfach nochmal normal.`);
    renderMyClubsList();
    return;
  }
  await rememberClub(currentCode, currentClub.info.name);
  enterClubUI(); // ruft am Ende resolvePendingInvite() auf
}
function resolvePendingInvite(){
  const token = getUrlParam('invite') || localStorage.getItem('chipmate_pending_invite_' + currentCode);
  if(!token) return;
  localStorage.removeItem('chipmate_pending_invite_' + currentCode);
  if(window.history && window.history.replaceState) window.history.replaceState({}, '', window.location.pathname);
  const player = currentClub.players.find(p => p.inviteToken === token);
  if(!player) return; // Token schon benutzt/ungültig — einfach normal weitermachen, kein Fehler nötig
  if(player.linkedEmail && player.linkedEmail.toLowerCase() !== currentUser.email.toLowerCase()){
    showToast('Dieser Einladungslink ist bereits einem anderen Login zugeordnet.');
    return;
  }
  player.linkedEmail = currentUser.email;
  player.inviteToken = null;
  saveClubData();
  showToast(`Willkommen! Du bist jetzt mit "${fullName(player)}" verknüpft und kannst online mitspielen.`);
  render();
}
async function generateInviteLink(id){
  if(!isClubAdmin()) return;
  const p = getPlayer(id);
  if(!p || p.linkedEmail) return;
  if(!p.inviteToken){
    p.inviteToken = uid() + uid();
    await saveClubData();
  }
  const url = `${window.location.origin}${window.location.pathname}?joincode=${encodeURIComponent(currentCode)}&invite=${encodeURIComponent(p.inviteToken)}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => showToast('Einladungslink kopiert! Schick ihn an ' + fullName(p) + '.')).catch(() => prompt('Link kopieren:', url));
  } else {
    prompt('Link kopieren:', url);
  }
}
async function bootAuth(){

  if(data && data.session){
    currentUser = data.session.user;
    showLandingAfterLogin();
  } else {
    document.getElementById('auth-gate').style.display = 'flex';
  }
}

(function(){
  const REST = SUPABASE_URL + '/rest/v1/app_storage';
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  async function throwWithDetails(res, action){
    let detail = '';
    try{ detail = await res.text(); } catch(e){}
    throw new Error(`Storage ${action} failed: ${res.status} ${res.statusText} — ${detail}`.slice(0, 500));
  }
  window.storage = {
    async get(key, shared){
      shared = !!shared;
      const url = `${REST}?key=eq.${encodeURIComponent(key)}&shared=eq.${shared}&select=key,value,shared`;
      const res = await fetch(url, { headers });
      if(!res.ok) await throwWithDetails(res, 'get');
      const rows = await res.json();
      if(!rows.length) return null;
      return { key: rows[0].key, value: rows[0].value, shared: rows[0].shared };
    },
    async set(key, value, shared){
      shared = !!shared;
      const res = await fetch(REST, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ key, shared, value, updated_at: new Date().toISOString() })
      });
      if(!res.ok) await throwWithDetails(res, 'set');
      return { key, value, shared };
    },
    async delete(key, shared){
      shared = !!shared;
      const url = `${REST}?key=eq.${encodeURIComponent(key)}&shared=eq.${shared}`;
      const res = await fetch(url, { method: 'DELETE', headers });
      if(!res.ok) await throwWithDetails(res, 'delete');
      return { key, deleted: true, shared };
    },
    async list(prefix, shared){
      shared = !!shared;
      let url = `${REST}?shared=eq.${shared}&select=key`;
      if(prefix) url += `&key=like.${encodeURIComponent(prefix + '*')}`;
      const res = await fetch(url, { headers });
      if(!res.ok) await throwWithDetails(res, 'list');
      const rows = await res.json();
      return { keys: rows.map(r => r.key), prefix, shared };
    }
  };
})();
