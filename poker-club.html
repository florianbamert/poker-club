// "Meine Clubs" kommt jetzt direkt aus den echten Mitgliedschaften (club_memberships) der
// eingeloggten Person — nicht mehr aus der generischen app_storage-Tabelle, wo ein einziger
// Eintrag für ALLE Nutzer der App galt und von anderen überschrieben werden konnte.
// "Aus der Liste entfernen" blendet einen Club nur auf diesem Gerät aus (localStorage, pro User).
function hiddenClubsKey(){ return 'chipmate_hidden_clubs_' + (currentUser ? currentUser.id : ''); }
function getHiddenClubs(){
  try{ return JSON.parse(localStorage.getItem(hiddenClubsKey()) || '[]'); }catch(e){ return []; }
}
function setHiddenClubs(list){
  try{ localStorage.setItem(hiddenClubsKey(), JSON.stringify(list)); }catch(e){}
}
async function getMyClubs(){
  if(!currentUser) return [];
  try{
    // Zwei einfache Abfragen statt eines eingebetteten Joins — robuster gegenüber Schema-Cache/
    // Beziehungs-Erkennung von PostgREST; Fehler werden sichtbar protokolliert statt verschluckt.
    const { data: mems, error: memErr } = await sb.from('club_memberships')
      .select('club_id, created_at')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending:false });
    if(memErr){ console.error('my clubs (memberships) failed', memErr); showToast('Clubs konnten nicht geladen werden: ' + memErr.message); return []; }
    if(!mems || !mems.length) return [];
    const { data: clubs, error: clubErr } = await sb.from('clubs')
      .select('id,name,code')
      .in('id', mems.map(m => m.club_id));
    if(clubErr){ console.error('my clubs (clubs) failed', clubErr); showToast('Clubs konnten nicht geladen werden: ' + clubErr.message); return []; }
    const byId = {};
    (clubs||[]).forEach(c => { byId[c.id] = c; });
    const hidden = getHiddenClubs();
    return mems
      .map(m => byId[m.club_id])
      .filter(c => c && !hidden.includes(c.code))
      .map(c => ({ code: c.code, name: c.name }));
  }catch(e){ console.error('my clubs failed', e); return []; }
}
async function rememberClub(code, name){
  // Nur noch ein "wieder einblenden", falls der Club zuvor auf diesem Gerät ausgeblendet wurde.
  const hidden = getHiddenClubs();
  if(hidden.includes(code)) setHiddenClubs(hidden.filter(c => c !== code));
}
async function forgetClub(code, ev){
  if(ev) ev.stopPropagation();
  const hidden = getHiddenClubs();
  if(!hidden.includes(code)) hidden.push(code);
  setHiddenClubs(hidden);
  renderMyClubsList();
}
async function renderMyClubsList(){
  const el = document.getElementById('my-clubs-list');
  const list = await getMyClubs();
  if(!list.length){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="mc-label">${t('label_my_clubs')}</div>
    ${list.map(c => `
      <div class="my-club-item" onclick="quickEnterClub('${c.code}')">
        <div>
          <div class="mc-name">${escapeHtml(c.name)}</div>
          <div class="mc-code">${c.code}</div>
        </div>
        <button class="mc-remove" onclick="forgetClub('${c.code}', event)" title="${t('btn_forget_club')}">✕</button>
      </div>`).join('')}
  `;
}
// Zentrale Funktion: schlägt einen Club-Code in der echten Tabelle nach und prüft
// die Mitgliedschaft der eingeloggten Person. Wird von "Meine Clubs" (quickEnterClub)
// UND vom Beitreten-Modal (submitJoinClub) benutzt, damit beide Wege exakt dieselbe
// Rollen-/Freigabe-Logik durchlaufen statt sie zweimal leicht unterschiedlich zu bauen.
async function enterClubByCode(code){
  const { data: club, error: clubErr } = await sb.from('clubs').select('id,name,code').eq('code', code).maybeSingle();
  if(clubErr || !club) return { ok:false, reason:'not_found' };
  const { data: membership } = await sb.from('club_memberships').select('role').eq('club_id', club.id).eq('user_id', currentUser.id).maybeSingle();
  if(membership){
    const { data: row, error: dataErr } = await sb.from('club_data').select('data').eq('club_id', club.id).maybeSingle();
    if(dataErr || !row){ console.error('club_data load failed', dataErr); return { ok:false, reason:'data_missing', detail: dataErr ? dataErr.message : 'keine Daten' }; }
    currentCode = club.code;
    currentClubId = club.id;
    currentClub = row.data;
    myRole = membership.role;
    return { ok:true, joined:true };
  }
  // Noch kein Mitglied → Beitrittsanfrage stellen (Lesend), wartet auf Freigabe durch
  // ein app_gestaltend-Mitglied. upsert + ignoreDuplicates macht Mehrfachklicks harmlos.
  await sb.from('club_join_requests').upsert(
    { club_id: club.id, user_id: currentUser.id, requested_email: currentUser.email },
    { onConflict: 'club_id,user_id', ignoreDuplicates: true }
  );
  return { ok:true, joined:false, clubName: club.name };
}
async function quickEnterClub(code){
  const result = await enterClubByCode(code);
  if(!result.ok){ showToast(result.reason==='data_missing' ? ('Club-Daten konnten nicht geladen werden: ' + result.detail) : t('err_club_not_found')); return; }
  if(!result.joined){ showToast('Beitrittsanfrage bereits unterwegs — warte auf Freigabe durch einen Club-Admin.'); return; }
  await rememberClub(currentCode, currentClub.info.name);
  enterClubUI();
}
async function reloadClubData(){
  if(!currentClubId) return;
  const { data: row, error } = await sb.from('club_data').select('data').eq('club_id', currentClubId).maybeSingle();
  if(!error && row) currentClub = row.data;
  render();
}
let clubSaveTimer = null;
function saveClubData(){
  // Bei jeder kleinen Aktion (Chip-Eingabe, Klick, etc.) wurde bisher SOFORT der komplette Club
  // (mehrere MB) über das Netz an Supabase geschickt UND darauf gewartet — das fühlte sich bei jeder
  // einzelnen Eingabe langsam an. Jetzt: Anzeige reagiert sofort (kein Warten mehr auf das Netzwerk),
  // das eigentliche Speichern läuft gesammelt im Hintergrund — mehrere schnelle Änderungen kurz
  // hintereinander lösen nur EIN tatsächliches Speichern aus, nicht mehrere einzelne.
  if(!currentClubId) return Promise.resolve();
  // Sicherheitsnetz auf Client-Seite: "Lesend" soll gar nicht erst versuchen zu speichern.
  // Der eigentliche Schutz ist die RLS-Policy in der Datenbank (siehe clubdata_update_writers) —
  // dieser Check hier verhindert nur unnötige, ohnehin abgelehnte Netzwerk-Anfragen.
  if(!canWrite()) return Promise.resolve();
  if(clubSaveTimer) clearTimeout(clubSaveTimer);
  clubSaveTimer = setTimeout(async () => {
    clubSaveTimer = null;
    try{
      const { error } = await sb.from('club_data')
        .update({ data: currentClub, updated_at: new Date().toISOString() })
        .eq('club_id', currentClubId);
      if(error){
        console.error('club save failed', error);
        showToast('⚠️ Speichern fehlgeschlagen — bitte Seite neu laden und nochmal versuchen.');
      }
    }catch(e){
      console.error('club save failed', e);
      showToast('⚠️ Speichern fehlgeschlagen — bitte Seite neu laden und Änderung nochmal machen.');
    }
  }, 600);
  return Promise.resolve();
}
// Absicherung: falls die Seite geschlossen/neu geladen wird, während noch ein gesammeltes Speichern
// aussteht, versuchen wir es sofort noch einmal auszulösen, statt es einfach verloren gehen zu lassen.
window.addEventListener('beforeunload', () => {
  if(clubSaveTimer && currentClubId && canWrite()){
    clearTimeout(clubSaveTimer);
    clubSaveTimer = null;
    sb.from('club_data').update({ data: currentClub, updated_at: new Date().toISOString() }).eq('club_id', currentClubId);
  }
});

function makeCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function emptyClubData(name, currency){
  return { info:{ name, currency, createdAt:new Date().toISOString() }, players:[], sessions:[], hands:[], payoutTemplates:[] };
}
function ensureClubDefaults(){
  if(!currentClub.payoutTemplates) currentClub.payoutTemplates = [];
  if(!currentClub.blindTemplates) currentClub.blindTemplates = [];
  if(!currentClub.customTags) currentClub.customTags = [];
  if(!currentClub.betGridProfiles) currentClub.betGridProfiles = [];
  if(!currentClub.customAvatars) currentClub.customAvatars = [];
  if(!currentClub.playerGroups) currentClub.playerGroups = [];
  if(!currentClub.venues) currentClub.venues = [];
  if(!currentClub.avgHandsPerCashSession) currentClub.avgHandsPerCashSession = 30;
  if(!currentClub.customCardDeck) currentClub.customCardDeck = { back:null, cards:{} };
  if(!currentClub.customCardDeck.cards) currentClub.customCardDeck.cards = {};
  if(!currentClub.cardDeckTemplates) currentClub.cardDeckTemplates = [];
  // Das aktive Deck steckt schon in seiner Vorlage — nicht zusätzlich nochmal als Kopie speichern
  // (verdoppelte die Club-Daten um mehrere MB und liess das Laden des Clubs scheitern)
  if(currentClub.activeCardDeckTemplateId && currentClub.cardDeckTemplates.some(t => t.id === currentClub.activeCardDeckTemplateId) && Object.keys(currentClub.customCardDeck.cards).length){
    currentClub.customCardDeck.cards = {};
  }
  // Table-Designer-Layouts: leben seit kurzem HIER (im club_data-JSON, wie Logos/Avatare/
  // Kartendecks auch), statt wie zuvor global app-weit in der generischen app_storage-Tabelle —
  // dort waren sie fälschlich über alle Clubs hinweg sichtbar (kein club_id-Bezug). Siehe
  // enterClubUI() für die einmalige Übernahme bereits vorhandener alter Layouts.
  if(!currentClub.tableLayouts) currentClub.tableLayouts = [];
  ensureClubLogos();
}
// Mehrere Club-Logos: currentClub.info.logos ist eine Liste { id, name, image }, und
// currentClub.info.activeLogoId zeigt, welches davon gerade überall (Kartenrückseite,
// Tisch-Header, ...) verwendet wird. Ein älteres, einzelnes currentClub.info.logo wird
// einmalig in diese Liste übernommen (Migration), statt verloren zu gehen.
function ensureClubLogos(){
  if(!currentClub.info) currentClub.info = {};
  if(!currentClub.info.logos) currentClub.info.logos = [];
  if(currentClub.info.logo && !currentClub.info.logos.some(l => l.image === currentClub.info.logo)){
    const migrated = { id: uid(), name: 'Logo', image: currentClub.info.logo };
    currentClub.info.logos.push(migrated);
    if(!currentClub.info.activeLogoId) currentClub.info.activeLogoId = migrated.id;
  }
  if(currentClub.info.activeLogoId && !currentClub.info.logos.some(l => l.id === currentClub.info.activeLogoId)){
    currentClub.info.activeLogoId = currentClub.info.logos.length ? currentClub.info.logos[0].id : null;
  }
  if(!currentClub.info.activeLogoId && currentClub.info.logos.length){
    currentClub.info.activeLogoId = currentClub.info.logos[0].id;
  }
}
// Zentrale Stelle, die überall im Rendering statt currentClub.info.logo aufgerufen wird —
// liefert das Bild des aktuell ausgewählten Logos (oder null, wenn keines aktiv ist).
function getActiveClubLogo(){
  if(!currentClub || !currentClub.info || !currentClub.info.logos || !currentClub.info.logos.length) return null;
  const active = currentClub.info.logos.find(l => l.id === currentClub.info.activeLogoId);
  return active ? active.image : currentClub.info.logos[0].image;
}

async function submitCreateClub(){
  const name = document.getElementById('club-name').value.trim();
  const currency = document.getElementById('club-currency').value;
  const errBox = document.getElementById('create-error');
  if(!name){ errBox.innerHTML = `<div class="error-msg">${t('err_need_name')}</div>`; return; }
  let code = makeCode();
  for(let i=0;i<5;i++){
    const { data: exists } = await sb.from('clubs').select('id').eq('code', code).maybeSingle();
    if(!exists) break;
    code = makeCode();
  }
  // create_club (Datenbank-Funktion) legt den Club an UND trägt die aktuelle Person
  // atomar als "app_gestaltend" ein — siehe chipmate_rollen_schema.sql.

let navDragState = null;
function attachNavDragHandlers(){
  document.querySelectorAll('.nav-drag-row').forEach(row => {
    let pressTimer = null, startX = 0, startY = 0, moved = false;
    const clearPressTimer = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    const onPointerDown = (x,y) => {
      startX = x; startY = y; moved = false;
      clearPressTimer();
      pressTimer = setTimeout(() => { if(!moved) beginNavDrag(row, x, y); }, 400);
    };
    const onPointerMove = (x,y,ev) => {
      if(navDragState){ if(ev && ev.cancelable) ev.preventDefault(); updateNavDrag(x,y); return; }
      if(Math.abs(x-startX) > 8 || Math.abs(y-startY) > 8){ moved = true; clearPressTimer(); }
    };
    row.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
    row.addEventListener('touchstart', e => { const t=e.touches[0]; onPointerDown(t.clientX, t.clientY); }, {passive:true});
    row.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
    row.addEventListener('touchmove', e => { const t=e.touches[0]; onPointerMove(t.clientX, t.clientY, e); }, {passive:false});
    row.addEventListener('mouseup', clearPressTimer);
    row.addEventListener('mouseleave', () => { if(!navDragState) clearPressTimer(); });
    row.addEventListener('touchend', clearPressTimer);
  });
  window.addEventListener('mousemove', e => { if(navDragState) updateNavDrag(e.clientX, e.clientY); });
  window.addEventListener('touchmove', e => { if(navDragState){ const t=e.touches[0]; updateNavDrag(t.clientX, t.clientY); } }, {passive:true});
  window.addEventListener('mouseup', endNavDrag);
  window.addEventListener('touchend', endNavDrag);
}
function beginNavDrag(row, x, y){
  const nav = document.getElementById('nav');
  const rect = row.getBoundingClientRect();
  const ghost = row.cloneNode(true);
  ghost.id = 'nav-drag-ghost';
  ghost.classList.add('nav-drag-ghost');
  ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;margin:0;z-index:9999;pointer-events:none;`;
  document.body.appendChild(ghost);
  row.classList.add('dragging-source');
  navDragState = { key: row.dataset.key, grabOffsetY: y - rect.top, grabOffsetX: x - rect.left, rowHeight: rect.height };
  if(navigator.vibrate) navigator.vibrate(15);
  updateNavDrag(x, y);
}
function updateNavDrag(x, y){
  if(!navDragState) return;
  const ghost = document.getElementById('nav-drag-ghost');
  if(!ghost) return;
  ghost.style.left = (x - navDragState.grabOffsetX) + 'px';
  ghost.style.top = (y - navDragState.grabOffsetY) + 'px';
  const nav = document.getElementById('nav');
  const sourceRow = nav.querySelector('.nav-drag-row.dragging-source');
  if(!sourceRow) return;
  const centerY = y - navDragState.grabOffsetY + navDragState.rowHeight/2;
  const rows = Array.from(nav.querySelectorAll('.nav-drag-row'));
  const overRow = rows.find(r => {
    if(r === sourceRow) return false;
    const rect = r.getBoundingClientRect();
    return centerY >= rect.top && centerY <= rect.bottom;
  });
  if(overRow){
    const sourceRect = sourceRow.getBoundingClientRect();
    const overRect = overRow.getBoundingClientRect();
    if(sourceRect.top < overRect.top) overRow.after(sourceRow);
    else overRow.before(sourceRow);
  }
}
function endNavDrag(){
  if(!navDragState) return;
  const ghost = document.getElementById('nav-drag-ghost');
  if(ghost) ghost.remove();
  const nav = document.getElementById('nav');
  const sourceRow = nav.querySelector('.nav-drag-row.dragging-source');
  if(sourceRow) sourceRow.classList.remove('dragging-source');
  const newOrder = Array.from(nav.querySelectorAll('.nav-drag-row')).map(r => r.dataset.key);
  navDragState = null;
  panelOrders['__nav__'] = newOrder;
  savePanelOrders();
  renderNav();
}

function formatMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + (currentClub.info.currency || 'CHF') + ' ' + Math.abs(Number(n || 0)).toLocaleString(locale(), {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatMoneyCompact(n){
  const sign = n < 0 ? '-' : '';
  return sign + (currentClub.info.currency || 'CHF') + ' ' + Math.abs(Number(n || 0)).toLocaleString(locale(), {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatMoneyAxisTick(n){
  // Kurze Form für Achsenbeschriftungen: da "nice" Rundungswerte ohnehin ganze Zahlen sind,
  // störende Nachkommastellen (",00") auf der Achse weglassen.
  const sign = n < 0 ? '-' : '';
  return sign + (currentClub.info.currency || 'CHF') + ' ' + Math.round(Math.abs(Number(n || 0))).toLocaleString(locale());
}
/* ---- "Nice numbers" Achsenskalierung (Heckbert-Algorithmus) ----
   Rundet Minimum/Maximum und Tick-Abstand automatisch auf hübsche, runde Schritte (1/2/5/10 * 10^n),
   statt stur die exakten Daten-Extremwerte als Achsengrenzen zu verwenden — dadurch lesen sich
   Gitterlinien und Beschriftungen wie 0 / 50 / 100 statt z.B. 0 / 37 / 74. */
function niceNumber(range, round){
  if(!(range>0)) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if(round){
    if(fraction < 1.5) niceFraction = 1;
    else if(fraction < 3) niceFraction = 2;
    else if(fraction < 7) niceFraction = 5;
    else niceFraction = 10;
  } else {
    if(fraction <= 1) niceFraction = 1;
    else if(fraction <= 2) niceFraction = 2;
    else if(fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
  }
  return niceFraction * Math.pow(10, exponent);
}
function niceTicks(min, max, tickCountTarget){
  tickCountTarget = tickCountTarget || 5;
  if(min===max){ min -= 1; max += 1; }
  const range = niceNumber(max - min, false);
  const step = niceNumber(range / Math.max(1, tickCountTarget - 1), true);
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for(let v = niceMin; v <= niceMax + step/2; v += step) ticks.push(Math.round((v + Number.EPSILON) * 1e6) / 1e6);
  return { min: niceMin, max: niceMax, step, ticks };
}

}
function fmtChipPlain(v, s){

function sortPlayersAlpha(list){
  // Sortiert nach Nachname (nicht Vorname und nicht Spitzname) — auch wenn ein Spitzname gesetzt ist
  // und daher woanders angezeigt wird, bleibt die Reihenfolge an den echten Nachnamen gebunden, damit
  // sie konsistent und nachvollziehbar bleibt (wie ein Adressbuch).
  return list.slice().sort((a,b) => {
    const byLast = (a.lastName||'').localeCompare((b.lastName||''), 'de', {sensitivity:'base'});
    if(byLast !== 0) return byLast;
    return (a.firstName||'').localeCompare((b.firstName||''), 'de', {sensitivity:'base'});
  });
}
function hasPlayedAtVenue(playerId, venue){
  if(!venue) return false;
  return currentClub.sessions.some(s => s.venue===venue && (s.participants||[]).some(p => p.playerId===playerId));
}
// Sortiert Spieler alphabetisch, aber Spieler, die am angegebenen Austragungsort schon einmal
// mitgespielt haben, zuerst — hilft z.B. beim Hinzufügen von Spielern zu einer Session, ohne bei
// vielen verschiedenen Homegame-Runden erst durch alle Spieler des ganzen Clubs scrollen zu müssen.
function sortPlayersForVenue(list, venue){
  const sorted = sortPlayersAlpha(list);
  if(!venue) return sorted;
  const known = sorted.filter(p => hasPlayedAtVenue(p.id, venue));
  const others = sorted.filter(p => !hasPlayedAtVenue(p.id, venue));
  return known.concat(others);
}

// Spielraum zum freien Verschieben über den Rand hinaus), während Breite/Höhe

  img.style.height = (naturalH*baseScale*cropScaleY())+'px';

// Bauchnabel geht, weiter nach unten zu ziehen und mehr vom Oberkörper zu zeigen.
function updateCropZoom(val){
  const oldZoom = cropState.zoom;

  const { size } = cropState;
  const cx = size/2, cy = size/2;
  const ratio = newZoom/oldZoom;
  cropState.left = cx - (cx - cropState.left) * ratio;
  cropState.top = cy - (cy - cropState.top) * ratio;

    cropState.stretchY = newScale;

    const whiteness = Math.min(d[i], Math.min(d[i+1], d[i+2]));
    let alpha = (upper - whiteness) / (upper - lower);
    alpha = Math.max(0, Math.min(1, alpha));
    d[i+3] = Math.round(alpha * d[i+3]);
  }

    const sourceW = size/effScaleX, sourceH = size/effScaleY;
    // Die Ausgabe ist immer ein festes Quadrat (Crop-Fenster ändert sich nicht) —
    // die Breite/Höhe-Regler stauchen/strecken stattdessen den Bildausschnitt selbst,
    // d.h. ein höher gezogenes Bild erscheint im Quadrat breiter im Verhältnis usw.

function computeVpipForPlayer(playerId, hands){
  let dealt = 0, voluntary = 0;
  hands.forEach(h => {
    if(!h.seats || !h.seats.includes(playerId)) return;
    dealt++;
    const acts = (h.actions && h.actions.preflop) || [];
    const mine = acts.filter(a => a.playerId === playerId);
    if(mine.some(a => a.action!=='fold' && a.action!=='check')) voluntary++;
  });
  return dealt>0 ? (voluntary/dealt*100) : null;
}
function prizePool(s){ return s.participants.reduce((sum,p) => sum + sumBuyIns(p), 0); }
function paidPlacesCount(s){ return (s.payoutPlaces||[]).length; }
function computePayout(s, rank){
  const places = s.payoutPlaces || [];
  if(!rank || rank > places.length) return 0;
  const val = places[rank-1];
  return s.payoutMode==='percent' ? prizePool(s) * val / 100 : Number(val);
}
function unrankedCount(s){ return s.participants.filter(p => p.finishRank == null).length; }
function allRanked(s){ return s.participants.length>0 && s.participants.every(p => p.finishRank != null); }
function isChipTrackingStale(s){
  const since = s.lastChipRecountAt || s.createdAt || '1970-01-01';
  return currentClub.hands.some(h => h.sessionId===s.id && h.skipped && new Date(h.createdAt) > new Date(since));
}
function payoutForParticipant(s, p){ return p.dealtPayout != null ? Number(p.dealtPayout) : computePayout(s, p.finishRank); }
function remainingPool(s){ return prizePool(s) - s.participants.filter(p => p.finishRank != null).reduce((sum,p) => sum + payoutForParticipant(s,p), 0); }
function getSession(id){ return currentClub.sessions.find(s => s.id === id); }

function autoFitText(selector, minFontPx){
  document.querySelectorAll(selector).forEach(el => {
    el.style.fontSize = '';
    const startSize = parseFloat(getComputedStyle(el).fontSize);
    let fontSize = startSize;
    const maxWidth = el.parentElement ? el.parentElement.clientWidth : el.clientWidth;
    if(!maxWidth) return;
    let iterations = 0;
    while(el.scrollWidth > maxWidth && fontSize > minFontPx && iterations < 24){
      fontSize -= 0.5;
      el.style.fontSize = fontSize + 'px';
      iterations++;
    }
  });
}
function autoFitTableText(){
  // Sorgt dafür, dass Namen und Beträge bei jeder Box-Grösse lesbar bleiben, statt abgeschnitten
  // zu werden — Schrift schrumpft automatisch, bis der Text in die verfügbare Breite passt.
  autoFitText('.seat-name', 8);
  autoFitText('.seat-stack', 8);
  autoFitText('.bet-line-amt', 7);
}
function syncTablePaneHeight(){
  const tablePane = document.querySelector('.table-pane');
  const actionPane = document.querySelector('.action-pane');
  if(!tablePane || !actionPane) return;
  // Nur bei Seite-an-Seite-Layout (genug Breite) relevant — auf dem Handy sind Tisch und Betfenster gestapelt,
  // dort soll das Betfenster ganz normal seine eigene, natürliche Höhe haben.
  if(window.innerWidth <= 780){
    actionPane.style.height = '';
    actionPane.style.overflowY = '';
    return;
  }
  // Der Tisch bestimmt die Höhe fix (über sein Seitenverhältnis) — das Betfenster darf nicht mehr
  // in die Höhe wachsen und den Tisch mitziehen, sondern scrollt bei zu viel Inhalt intern.
  const h = tablePane.getBoundingClientRect().height;
  if(h > 40){
    actionPane.style.height = h + 'px';
    actionPane.style.overflowY = 'auto';
  }
}

function getPanelOrder(viewKey){
  const defaultOrder = PANEL_DEFAULT_ORDERS[viewKey] || [];

  if(dashVenueFilters.size && !dashVenueFilters.has(s.venue||'')) return false;

      const pl = getPlayer(p.playerId);
      return pl && pl.groups && pl.groups.some(g => dashGroupFilters.has(g));
    });
    if(!hasGroupMember) return false;
  }
  if(dashPlayerFilters.size){
    const hasSelectedPlayer = (s.participants||[]).some(p => dashPlayerFilters.has(p.playerId));
    if(!hasSelectedPlayer) return false;
  }
  return true;

/* ---- Spielervergleich (Anhang 1) ---- */
let dashCompareExpanded = false;
let dashCompareMetric = 'totalNet';
function toggleDashCompareExpanded(){ dashCompareExpanded = !dashCompareExpanded; render(); }
function setDashCompareMetric(v){ dashCompareMetric = v; render(); }
const DASH_COMPARE_METRIC_LABELS = { totalNet:'Totalgewinn', avgPerSession:'Ø Gewinn/Verlust pro Session', vpip:'VPIP %' };
function playerCompareChartHtml(hands){
  // Wer verglichen wird, steuert jetzt der gemeinsame Spieler-/Gruppen-Filter oben im Dashboard
  // (dashFilteredActivePlayers) — eine eigene Checkbox-Auswahl nur für dieses Panel gibt es bewusst
  // nicht mehr, das wäre eine zweite, verwirrende Filter-Ebene gewesen.
  const active = dashFilteredActivePlayers();
  const rowsAll = active.map(p => {
    const stats = playerStats(p.id, 'all', true);
    let value = null;
    if(dashCompareMetric === 'vpip') value = computeVpipForPlayer(p.id, hands);
    else if(dashCompareMetric === 'avgPerSession') value = stats.sessionsPlayed ? stats.totalNet/stats.sessionsPlayed : null;
    else value = stats.totalNet;
    return { p, value, sessionsPlayed: stats.sessionsPlayed };
  }).filter(r => r.sessionsPlayed>0 && r.value!=null);
  const selected = rowsAll.slice().sort((a,b) => b.value - a.value);
  const limited = dashCompareExpanded ? selected : selected.slice(0,5);
  const points = limited.map(r => ({
    label: fullName(r.p),
    value: r.value,
    fmt: dashCompareMetric==='vpip' ? r.value.toFixed(0)+'%' : formatMoney(r.value)
  }));
  return `
    <div class="panel">
      <div class="panel-head">
        <h3>📊 Spielervergleich</h3>
        ${rowsAll.length>5 ? `<button class="pill" onclick="toggleDashCompareExpanded()">${dashCompareExpanded ? '▲ Top 5' : '▼ Alle anzeigen'}</button>` : ''}
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <span style="color:var(--ink-soft);">Anzeige:</span>
          <select onchange="setDashCompareMetric(this.value)" style="font-size:13px;">
            ${Object.entries(DASH_COMPARE_METRIC_LABELS).map(([k,l]) => `<option value="${k}" ${dashCompareMetric===k?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
      </div>
      ${points.length ? horizontalBarChartSvg(points, dashCompareMetric==='vpip' ? (v => Math.round(v)+'%') : formatMoneyAxisTick) : `<div class="empty-state"><strong>Noch keine Daten</strong></div>`}
    </div>`;
}

/* ---- Fun-Statistiken (Anhang 2 + 3) ---- */
let dashMoneyExpanded = false;
function toggleDashMoneyExpanded(){ dashMoneyExpanded = !dashMoneyExpanded; render(); }
function funStatsHtml(sessions, hands){
  // "Grösster Pot" steht bereits ganz oben in den Kennzahlen — hier bewusst nicht mehr doppelt anzeigen.
  const active = dashFilteredActivePlayers();
  const withStats = active.map(p => ({ p, stats: playerStats(p.id, 'all', true) })).filter(r => r.stats.sessionsPlayed>0);
  withStats.sort((a,b) => b.stats.totalNet - a.stats.totalNet);
  const bestPlayer = withStats[0];
  // "Denkwürdige Hände": jede nicht übersprungene Hand, die entweder eine Story (Freitext) oder
  // mindestens einen Hand-Tag hat — beides trägt man beim Abschliessen einer Hand im Hand-Dialog ein.
  const memorableCount = hands.filter(h => !h.skipped && (((h.story||'').trim()) || (h.tags&&h.tags.length))).length;

  // Geld im Spiel — nur Sessions mit tatsächlich erfassten Buy-Ins zählen, sonst verwässern frisch
  // angelegte, aber noch leere Sessions die Statistik mit 0-CHF-Balken.
  const withBuyins = sessions
    .map(s => ({ s, total: (s.participants||[]).reduce((sum,p) => sum + sumBuyIns(p), 0) }))
    .filter(x => x.total > 0)
    .sort((a,b) => new Date(a.s.date) - new Date(b.s.date));
  const shownMoney = dashMoneyExpanded ? withBuyins : withBuyins.slice(-8);
  const moneyPoints = shownMoney.map(({s,total}) => ({
    label: new Date(s.date).toLocaleDateString(locale(),{day:'2-digit',month:'2-digit'}),
    value: total
  }));
  const moneyTotal = moneyPoints.reduce((sum,p) => sum + p.value, 0);

  return `
    <div class="panel">
      <div class="panel-head"><h3>✨ Fun-Statistiken</h3></div>
      <div class="stat-grid">
        <div class="stat-card" style="background:var(--felt-dark);">
          <div class="num" style="color:#fff;">${bestPlayer ? escapeHtml(fullName(bestPlayer.p)) : '—'}</div>
          <div class="label" style="color:rgba(255,255,255,.75);">📈 Bester Spieler${bestPlayer ? ` · ${formatMoney(bestPlayer.stats.totalNet)}` : ''}</div>
        </div>
        <div class="stat-card">
          <div class="num">${memorableCount}</div>
          <div class="label">🃏 Denkwürdige Hände</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;">
        <h4 style="margin:0;font-size:13.5px;">💰 Geld im Spiel</h4>
        <button class="pill" onclick="toggleDashMoneyExpanded()">${dashMoneyExpanded ? '▲ Einklappen' : '▼ Alle Sessions'}</button>
      </div>
      ${moneyPoints.length ? sessionBarChartSvg(moneyPoints) : `<div class="empty-state"><strong>Noch keine Daten</strong></div>`}
      ${moneyPoints.length ? `<div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:6px;">Total Buy-ins (${moneyPoints.length} Sessions): <strong style="color:var(--ink);">${formatMoney(moneyTotal)}</strong></div>` : ''}
    </div>`;
}

function dashRelevantPlayerIds(){
  // Ist ein bestimmter Spieler (oder eine Gruppe) angewählt, sollen Hand-basierte Auswertungen
  // (grösster Pot, VPIP, denkwürdige Hände) nur Hände zählen, in denen dieser Spieler/diese Gruppe
  // tatsächlich mitgespielt hat — nicht nur irgendeine Hand aus einer Session, an der er teilnahm.
  if(dashPlayerFilters.size) return dashPlayerFilters;
  if(dashGroupFilters.size){
    const ids = new Set();
    currentClub.players.forEach(p => { if(p.groups && p.groups.some(g => dashGroupFilters.has(g))) ids.add(p.id); });
    return ids;
  }
  return null;
}

  return `

async function submitNewSession(){
  const date = document.getElementById('ns-date').value;
  const venue = document.getElementById('ns-venue') ? document.getElementById('ns-venue').value : '';
  const type = document.getElementById('ns-type').value;
  const notes = document.getElementById('ns-notes').value.trim();
  const pin = document.getElementById('ns-pin').value.trim();
  const errBox = document.getElementById('ns-error');
  if(!date){ errBox.innerHTML = `<div class="error-msg">${t('err_need_date')}</div>`; return; }
  if(!/^[0-9]{4}$/.test(pin)){ errBox.innerHTML = `<div class="error-msg">${t('err_pin_format')}</div>`; return; }

  let payoutMode = 'percent', payoutPlaces = [100], payoutTemplateId = null;
  if(type==='tournament'){
    const tplSel = document.getElementById('ns-payout-template').value;
    if(tplSel === 'custom'){
      payoutMode = document.getElementById('ns-custom-mode').value;
      payoutPlaces = customPayoutPlaces.slice();
      if(payoutMode==='percent'){
        const sum = payoutPlaces.reduce((a,b)=>a+b,0);
        if(Math.abs(sum-100) > 0.5){ errBox.innerHTML = `<div class="error-msg">${t('err_percent_sum',{sum:sum})}</div>`; return; }
      }
    } else {
      const tpl = currentClub.payoutTemplates.find(x => x.id === tplSel);
      if(tpl){ payoutMode = tpl.mode; payoutPlaces = tpl.places.slice(); payoutTemplateId = tpl.id; }
    }
  }

  const buyinAmount = type==='tournament' ? Number(document.getElementById('ns-buyin-amount').value || 0) : null;
  const startChips = type==='tournament' ? Number(document.getElementById('ns-start-chips').value || 0) : null;
  if(type==='tournament' && (!buyinAmount || buyinAmount<=0)){ errBox.innerHTML = `<div class="error-msg">${t('err_need_buyin_amount')}</div>`; return; }
  if(type==='tournament' && (!startChips || startChips<=0)){ errBox.innerHTML = `<div class="error-msg">${t('err_need_start_chips')}</div>`; return; }
  const addonOffered = type==='tournament' && document.getElementById('ns-addon-offer').checked;
  const blindTemplateId = type==='tournament' ? (document.getElementById('ns-blind-template').value || null) : null;
  const blindTemplate = blindTemplateId ? currentClub.blindTemplates.find(x => x.id === blindTemplateId) : null;
  const firstLevel = blindTemplate ? blindTemplate.levels.find(l => !l.isBreak) : null;

  const session = {
    id: uid(), type, date, venue: venue || null, notes, pin,
    sb: type==='cash' ? Number(document.getElementById('ns-sb').value || 0) : (firstLevel ? firstLevel.sb : null),
    bb: type==='cash' ? Number(document.getElementById('ns-bb').value || 0) : (firstLevel ? firstLevel.bb : null),
    ante: firstLevel ? (firstLevel.ante||0) : 0,
    blindTemplateId, blindLevelIndex: 0, blindStartedAt: null, blindManualOffsetMs: 0,
    buyinAmount, startChips,
    rebuyAmount: type==='tournament' ? Number(document.getElementById('ns-rebuy-amount').value || buyinAmount || 0) : null,
    rebuyChips: type==='tournament' ? Number(document.getElementById('ns-rebuy-chips').value || startChips || 0) : null,
    addonAmount: addonOffered ? Number(document.getElementById('ns-addon-amount').value || 0) : null,
    addonChips: addonOffered ? Number(document.getElementById('ns-addon-chips').value || 0) : null,
    payoutMode, payoutPlaces, payoutTemplateId,
    status:'open', seatOrder:[], handCounter:0, participants:[],
    actualCash:null, actualTwint:null,
    sevenDeuceGame: type==='cash' ? document.getElementById('ns-seven-deuce').checked : false,
    chipProfileId: document.getElementById('ns-chipset').value || null,
    betGridProfileId: document.getElementById('ns-betgrid').value || null,
    equilibriumConfirmed:false, cashConfirmed:false, ranksConfirmed:false, payoutsConfirmed:false,
    createdAt:new Date().toISOString()
  };
  currentClub.sessions.push(session);
  const eventId = document.getElementById('ns-event-id').value;
  if(eventId){ const ev = getEvent(eventId); if(ev) ev.linkedSessionId = session.id; }
  await saveClubData();
  unlockedSessions.add(session.id);
  closeModal();
  currentSessionId = session.id;
  setView('sessions');
}

/* ================= Session detail ================= */
function renderSessionDetail(s){
  if(!s) return `<div class="panel">—</div>`;
  const unlocked = isUnlocked(s);
  const dateStr = new Date(s.date).toLocaleDateString(locale(), {day:'2-digit', month:'2-digit', year:'numeric'});

  const totalBuyIns = s.participants.reduce((sum,p) => sum + sumBuyIns(p), 0);
  const totalChips = s.participants.reduce((sum,p) => sum + (p.chipCount!=null ? Number(p.chipCount) : 0), 0);
  const totalCash = s.participants.reduce((sum,p) => sum + (p.buyIns||[]).filter(b=>b.method==='Bar').reduce((a,b)=>a+Number(b.amount||0),0), 0);
  const totalTwint = s.participants.reduce((sum,p) => sum + (p.buyIns||[]).filter(b=>b.method==='Twint').reduce((a,b)=>a+Number(b.amount||0),0), 0);
  const actualCash = (s.actualCash === undefined) ? null : s.actualCash;
  const actualTwint = (s.actualTwint === undefined) ? null : s.actualTwint;
  const actualEntered = actualCash !== null && actualTwint !== null;
  const allChipsEntered = s.participants.length>0 && s.participants.every(p => p.chipCount !== null && p.chipCount !== undefined);
  const hasChipset = !!(s.chipProfileId && getChipProfile(s.chipProfileId));
  const chipRecountOk = !hasChipset || (s.lastChipRecount && Math.abs(s.lastChipRecount.total - totalChips) < 0.005);
  const equilibriumOk = allChipsEntered && Math.abs(totalBuyIns - totalChips) < 0.005 && chipRecountOk;
  const kasseOk = actualEntered && Math.abs((Number(actualCash)+Number(actualTwint)) - totalBuyIns) < 0.005;

  const clubPlayerIds = new Set(s.participants.map(p=>p.playerId));
  let availablePlayersBase = currentClub.players.filter(p => !p.archived && !clubPlayerIds.has(p.id));
  if(sessionAddPlayerGroupFilter){
    availablePlayersBase = availablePlayersBase.filter(p => p.groups && p.groups.includes(sessionAddPlayerGroupFilter));
  }
  const availablePlayers = sortPlayersForVenue(availablePlayersBase, s.venue);

  return `
    <button class="back-link" onclick="currentSessionId=null; sessionAddPlayerGroupFilter=''; render();">${t('session_back')}</button>
    <div class="session-header">
      <div class="titles">
        <h1 style="margin-bottom:0;">${dateStr}${s.venue ? ' · 📍 ' + escapeHtml(s.venue) : (s.location ? ' · ' + escapeHtml(s.location) : '')}</h1>
        <div class="badges">
          <span class="badge badge-type">${s.type==='cash' ? t('badge_cash') : t('badge_tournament')}</span>
          <span class="badge ${s.status==='open' ? 'badge-open':'badge-closed'}">${s.status==='open'?t('badge_open'):t('badge_closed')}</span>
          ${s.type==='cash' && s.sb ? `<span class="badge badge-type">${t('label_blinds')} ${s.sb}/${s.bb}</span>` : ''}
          ${s.type==='tournament' && s.buyinAmount ? `<span class="badge badge-type">${t('label_buyin_short')} ${formatMoney(s.buyinAmount)}</span>` : ''}
        </div>
      </div>
      ${unlocked && canWrite() ? `
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="openEditSessionModal('${s.id}')">✏️ ${t('btn_edit')}</button>
      </div>` : ''}
    </div>
    ${s.notes ? `<p class="lede" style="margin-top:-14px;">${escapeHtml(s.notes)}</p>` : ''}

    ${unlocked ? `
      <div class="unlocked-banner">
        <span>${t('unlocked_banner',{pin:'<strong style="letter-spacing:1px;">'+s.pin+'</strong>'})}</span>
        <button class="btn-text" onclick="lockSession('${s.id}')">${t('btn_lock')}</button>
      </div>` : `
      <div class="lock-banner">
        <span>${t('locked_banner_text')}</span>
        <input id="unlock-pin" type="text" maxlength="4" placeholder="${t('placeholder_pin')}">
        <button class="mini-btn brass" onclick="tryUnlock('${s.id}')">${t('btn_unlock')}</button>
        <button class="btn-danger-text" onclick="forgotPin('${s.id}')">${t('btn_forgot_pin')}</button>
      </div>
      <div id="unlock-error"></div>
    `}

    ${s.type==='tournament' && unrankedCount(s)>0 && unrankedCount(s)<=paidPlacesCount(s) ? `
      <div class="itm-banner">${t('itm_banner_text')}</div>` : ''}

    ${renderOrderedPanels(s.type==='cash' ? 'sessionDetailCash' : 'sessionDetailTournament', {

      chipsetSelector: `
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);">
          🔴 Chipset:
          <select ${unlocked && canWrite() ?'':'disabled'} onchange="setSessionChipProfile('${s.id}', this.value)" style="font-size:13px;">
            <option value="">— keins —</option>
            ${(currentClub.chipProfiles||[]).filter(cp=>cp.type===s.type).map(cp => `<option value="${cp.id}" ${s.chipProfileId===cp.id?'selected':''}>${escapeHtml(cp.name || (s.type==='cash' ? (formatMoney(cp.sb)+' / '+formatMoney(cp.bb)) : cp.name||'Turnier-Set'))}</option>`).join('')}
          </select>
        </div>
        ${!s.chipProfileId ? `<p class="lede" style="font-size:11.5px;margin:6px 0 0;">Ohne Chipset gibt's keine "Chips im Spiel"-Übersicht und keine Chip-Kontrollzählung — nur die einfache Kasse/Equilibre-Kontrolle beim Abschluss.</p>` : ''}`,

      betGridSelector: `
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);">
          🎯 Bet-Raster:
          <select ${unlocked && canWrite() ?'':'disabled'} onchange="setSessionBetGrid('${s.id}', this.value)" style="font-size:13px;">
            <option value="">— Standard (1-50) —</option>
            ${(currentClub.betGridProfiles||[]).filter(p=>p.type===s.type).map(p => `<option value="${p.id}" ${s.betGridProfileId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>`,

      players: `

              ${unlocked && canWrite() && s.status==='open' && currentClub.playerGroups && currentClub.playerGroups.length ? `
                <select onchange="sessionAddPlayerGroupFilter=this.value; render();" style="font-size:12px;" title="Nach Gruppe filtern">
                  <option value="" ${!sessionAddPlayerGroupFilter?'selected':''}>👥 Alle Gruppen</option>
                  ${currentClub.playerGroups.map(g => `<option value="${escapeHtml(g)}" ${sessionAddPlayerGroupFilter===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
                </select>` : ''}
              ${unlocked && canWrite() && s.status==='open' && availablePlayers.length ? `
                <select id="add-player-select" onchange="addParticipant('${s.id}', this.value); this.value='';">
                  <option value="">${t('select_add_player_placeholder')}</option>

              ${unlocked && canWrite() && s.status==='open' && sessionAddPlayerGroupFilter && !availablePlayers.length ? `

            </div>
          </div>
          ${s.participants.length ? s.participants.map(p => s.type==='tournament' ? tournamentParticipantRowHtml(s, p, unlocked) : participantRowHtml(s, p, unlocked)).join('') : `
            <div class="empty-state"><strong>${t('empty_no_participants_title')}</strong>${unlocked ? t('empty_no_participants_unlocked') : t('empty_no_participants_locked')}</div>`}
          ${s.status==='open' ? `
            <button class="btn btn-primary" style="width:100%;margin-top:14px;font-size:15px;" onclick="goToHandsForSession('${s.id}')">${t('btn_go_to_hands')}</button>` : ''}

      chipsInPlay: chipsInPlayPanelHtml(s),
      chipCountCheck: chipCountCheckHtml(s),

          <div class="panel-head"><h3>${t('panel_kasse')}</h3></div>
          <div class="kasse-panel">
            <div class="kasse-item"><div class="num">${formatMoney(totalCash)}</div><div class="label">${t('kasse_cash')} (${t('kasse_logged')})</div></div>
            <div class="kasse-item"><div class="num">${formatMoney(totalTwint)}</div><div class="label">${t('kasse_twint')} (${t('kasse_logged')})</div></div>
            <div class="kasse-item"><div class="num">${formatMoney(totalBuyIns)}</div><div class="label">${t('kasse_total_buyins')}</div></div>
            <div class="kasse-item"><div class="num">${formatMoney(totalChips)}</div><div class="label">${t('kasse_total_chips')}</div></div>
          </div>
        </div>` : `
        <div class="panel">
          <div class="panel-head"><h3>${t('panel_kasse')}</h3></div>
          <div class="kasse-panel">
            <div class="kasse-item"><div class="num">${formatMoney(totalCash)}</div><div class="label">${t('kasse_cash')} (${t('kasse_logged')})</div></div>
            <div class="kasse-item"><div class="num">${formatMoney(totalTwint)}</div><div class="label">${t('kasse_twint')} (${t('kasse_logged')})</div></div>
            <div class="kasse-item"><div class="num">${formatMoney(totalBuyIns)}</div><div class="label">${t('prize_pool_label')}</div></div>

      closing: `

                : `<button class="btn btn-secondary btn-sm" onclick="reopenSession('${s.id}')">${t('btn_reopen_session')}</button>`}
            </div>
            ${s.status==='open' && !(s.ranksConfirmed && s.payoutsConfirmed && allRanked(s)) ? forceCloseSectionHtml(s) : ''}
          ` : ''}
          `}
        </div>`
    })}
  `;
}

function tournamentParticipantRowHtml(s, p, unlocked){
  const player = getPlayer(p.playerId);
  if(!player) return '';
  const ranked = p.finishRank != null;
  const payout = ranked ? payoutForParticipant(s, p) : null;
  const net = ranked ? payout - sumBuyIns(p) : null;
  const typeLabel = { buyin:t('buyin_type_buyin'), rebuy:t('buyin_type_rebuy'), addon:t('buyin_type_addon') };
  return `
    <div class="participant-row has-rank">
      ${avatarHtml(player)}
      <div>
        <div class="p-name">${escapeHtml(fullName(player))}</div>
        <div class="p-status">${t('label_buyins_total',{amount:formatMoney(sumBuyIns(p))})}</div>
        <div class="buyin-list">
          ${(p.buyIns||[]).map(b => `<span class="buyin-chip${unlocked&&canWrite()?' editable':''}" ${unlocked&&canWrite()?`onclick="openEditBuyinModal('${s.id}','${p.playerId}','${b.id}')"`:''}>${typeLabel[b.kind||'buyin']} · ${formatMoney(b.amount)}${b.method?' · '+(b.method==='Bar'?t('option_method_cash'):t('option_method_twint')):''}</span>`).join('') || `<span class="buyin-chip">${t('no_buyin_chip')}</span>`}
        </div>
      </div>
      ${ranked ? `
        <div class="rank-badge ${p.finishRank===1?'gold':''}">
          <div class="rank-num">${p.finishRank}</div>
          <div class="rank-lbl">${t('label_place')}${p.dealtPayout!=null?' · '+t('badge_deal'):''}</div>
        </div>` : `<div></div>`}
      <div>
        <div class="p-net ${ranked ? (net>0?'pos':(net<0?'neg':'zero')) : 'zero'}" style="text-align:right;">${ranked ? formatMoney(payout) : (p.chipCount!=null ? p.chipCount : '–')}</div>
        ${ranked ? `<div style="text-align:right;font-size:11.5px;font-weight:600;margin-top:2px;color:${net>0?'var(--green)':(net<0?'var(--red)':'var(--ink-soft)')}">${t('net_label')} ${formatMoney(net)}</div>` : ''}
      </div>
      <div class="p-actions">
        ${unlocked && canWrite() && !ranked ? `
          <input class="chip-input" type="number" step="1" placeholder="${t('placeholder_chips')}" value="${p.chipCount!=null?p.chipCount:''}" onchange="setChipCount('${s.id}','${p.playerId}', this.value)">
          <button class="mini-btn" onclick="openRebuyModal('${s.id}','${p.playerId}')">${t('btn_rebuy')}</button>
          ${s.addonAmount ? `<button class="mini-btn" onclick="openAddonModal('${s.id}','${p.playerId}')">${t('btn_addon')}</button>` : ''}
          <button class="mini-btn outline-red" onclick="eliminateParticipant('${s.id}','${p.playerId}')">${t('btn_eliminate')}</button>
          <button class="icon-btn danger" title="Aus Session entfernen (falscher Spieler)" onclick="removeParticipant('${s.id}','${p.playerId}')">${ICON_ARCHIVE}</button>
        ` : ''}
      </div>
    </div>`;
}

function participantRowHtml(s, p, unlocked){
  const player = getPlayer(p.playerId);
  if(!player) return '';
  const net = netFor(p);
  const netClass = net===null ? 'zero' : (net>0 ? 'pos' : (net<0 ? 'neg' : 'zero'));
  const netDisplay = net===null ? '–' : formatMoney(net);
  return `
    <div class="participant-row">
      ${avatarHtml(player)}
      <div>
        <div class="p-name">${escapeHtml(fullName(player))}</div>
        <div class="p-status">${p.active ? t('status_at_table') : t('status_left')} · ${t('label_buyins_total',{amount:formatMoney(sumBuyIns(p))})}</div>
        <div class="buyin-list">
          ${(p.buyIns||[]).map(b => `<span class="buyin-chip${unlocked&&canWrite()?' editable':''}" ${unlocked&&canWrite()?`onclick="openEditBuyinModal('${s.id}','${p.playerId}','${b.id}')"`:''}>${new Date(b.time).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})} · ${formatMoney(b.amount)} · ${b.method==='Bar'?t('option_method_cash'):t('option_method_twint')}</span>`).join('') || `<span class="buyin-chip">${t('no_buyin_chip')}</span>`}
        </div>
      </div>
      <div class="p-net ${netClass}">
        ${netDisplay}
        ${(s.type==='cash' && net!==null && s.bb) ? `<div style="font-size:11px;color:var(--ink-soft);font-weight:400;">${(net/s.bb)>0?'+':''}${(net/s.bb).toFixed(1)} BB</div>` : ''}
      </div>
      <div class="p-actions">
        ${unlocked && canWrite() ? `
          <button class="mini-btn" onclick="openBuyinModal('${s.id}','${p.playerId}')">${t('btn_add_buyin')}</button>
          <input class="chip-input" type="number" step="1" placeholder="${t('placeholder_chips')}" value="${p.chipCount!=null?p.chipCount:''}" onchange="setChipCount('${s.id}','${p.playerId}', this.value)">
          ${p.active

let pendingSeatInsertAfter = null;
function ensureSeatSlotAssignments(s){
  if(!s.seatSlotAssignments) s.seatSlotAssignments = {};
  const busy = activeSeatOrderRaw(s);
  const totalSlots = resolveTotalSlots(s);
  // Zuweisungen, die jetzt ausserhalb des gültigen Bereichs liegen (z.B. nach Wechsel von 10-Max auf 6-Max),
  // dürfen nicht einfach verwaist bleiben — sonst rutscht der Spieler unsichtbar auf Sitz 0 und überlappt jemanden.
  busy.forEach(pid => {
    if(s.seatSlotAssignments[pid] != null && s.seatSlotAssignments[pid] >= totalSlots){
      delete s.seatSlotAssignments[pid];
    }
  });
  const taken = new Set(Object.values(s.seatSlotAssignments));
  busy.forEach(pid => {
    if(s.seatSlotAssignments[pid] == null){
      let slot = 0;
      while(taken.has(slot) && slot < totalSlots) slot++;
      s.seatSlotAssignments[pid] = slot;
      taken.add(slot);
    }
  });
}
function activeSeatOrderRaw(s){
  return (s.seatOrder||[]).filter(pid => {
    const p = s.participants.find(x => x.playerId === pid);
    if(!p) return false;
    const statusOk = s.type==='tournament' ? p.finishRank == null : p.active;
    if(!statusOk) return false;
    if(p.chipCount != null && p.chipCount <= 0) return false;
    return true;
  });
}

function seatSlotPickerHtml(sessionId, selectedSlot){
  const s = getSession(sessionId);
  ensureSeatSlotAssignments(s);
  const totalSlots = resolveTotalSlots(s);
  const taken = {};
  Object.entries(s.seatSlotAssignments).forEach(([pid, slot]) => {
    const pl = getPlayer(pid);
    if(pl) taken[slot] = fullName(pl);
  });
  return `
    <div class="field">
      <label>Sitzplatz wählen</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${Array.from({length:totalSlots}, (_,i) => i).map(i => {
          const occupied = taken[i] != null;
          const isSel = selectedSlot === i;
          return `<button type="button" class="pill" style="${occupied?'background:#EFE6D8;border-color:#C9A876;':'cursor:pointer;'}${isSel?'background:var(--felt);color:#fff;border-color:var(--felt);':''}" onclick="selectSeatSlotChoice(${i})" title="${occupied?'Belegt von '+escapeHtml(taken[i])+' — wird auf nächsten Platz verschoben':'Frei'}">${i+1}${occupied?' ↷':''}</button>`;
        }).join('')}
        <button type="button" class="pill" style="cursor:pointer;${selectedSlot==='waitlist'?'background:var(--felt);color:#fff;border-color:var(--felt);':''}" onclick="selectSeatSlotChoice('waitlist')" title="Registriert den Spieler (Buy-in wird erfasst), ohne ihn an den Tisch zu setzen — z.B. für Nachzügler oder wenn schon alle Plätze belegt sind.">🕒 Warteliste (kein Sitzplatz)</button>
      </div>
      <p class="lede" style="font-size:11.5px;margin-top:6px;">Belegte Plätze (↷) kannst du auch wählen — der bisherige Spieler und alle danach rutschen automatisch einen Platz weiter.</p>
    </div>`;
}
function insertPlayerAtSlot(s, chosenSlot){
  // Alle Spieler ab dem gewählten Platz (inkl.) rutschen einen Platz weiter, damit der neue Spieler
  // genau dort einfügen kann, statt einen bereits besetzten Platz zu überschreiben.
  if(!s.seatSlotAssignments) s.seatSlotAssignments = {};
  Object.keys(s.seatSlotAssignments).forEach(pid => {
    if(s.seatSlotAssignments[pid] >= chosenSlot){
      s.seatSlotAssignments[pid] = s.seatSlotAssignments[pid] + 1;
    }
  });
}

async function submitAddPlayerToHand(sessionId){
  if(!canWrite()) return;
  const s = getSession(sessionId);
  const playerId = document.getElementById('aph-player').value;
  const method = document.getElementById('aph-method').value;
  if(!playerId){ document.getElementById('aph-error').innerHTML = `<div class="error-msg">Bitte einen Spieler wählen.</div>`; return; }
  if(pendingSeatSlotChoice == null){ document.getElementById('aph-error').innerHTML = `<div class="error-msg">Bitte einen Sitzplatz wählen.</div>`; return; }
  if(s.participants.some(p => p.playerId === playerId)){ pendingSeatInsertAfter = null; pendingSeatSlotChoice = null; closeModal(); render(); return; }
  let amount, chipStart;
  if(s.type==='cash'){
    amount = Number(document.getElementById('aph-amount').value || 0);
    if(!amount || amount<=0){ document.getElementById('aph-error').innerHTML = `<div class="error-msg">${t('err_need_amount')}</div>`; return; }
    chipStart = amount;
  } else {
    amount = s.buyinAmount;
    chipStart = s.startChips;
  }
  const participant = {
    playerId, active:true, joinedAt:new Date().toISOString(), leftAt:null, finishRank:null,
    chipCount: chipStart,
    buyIns: [{ id: uid(), time: new Date().toISOString(), amount, currency: currentClub.info.currency, method, kind:'buyin', chipBreakdown: readChipBreakdown() }]
  };
  s.participants.push(participant);
  if(pendingSeatSlotChoice === 'waitlist'){
    // Bewusst NICHT zu seatOrder/seatSlotAssignments hinzufügen — der Spieler ist damit finanziell
    // erfasst (Buy-in zählt), sitzt aber an keinem Tisch-Platz und wird nicht in Hände eingeteilt,

    pendingSeatInsertAfter = null;
    pendingSeatSlotChoice = null;
    await saveClubData();
    closeModal();
    showToast(`✓ ${escapeHtml(fullName(getPlayer(playerId)))} auf die Warteliste gesetzt — noch kein Sitzplatz`);
    render();
    return;
  }
  if(!s.seatOrder.includes(playerId)) s.seatOrder.push(playerId);
  if(!s.seatSlotAssignments) s.seatSlotAssignments = {};
  insertPlayerAtSlot(s, pendingSeatSlotChoice);
  s.seatSlotAssignments[playerId] = pendingSeatSlotChoice;
  pendingSeatInsertAfter = null;
  pendingSeatSlotChoice = null;
  await saveClubData();
  closeModal();
  showToast(`✓ ${escapeHtml(fullName(getPlayer(playerId)))} hinzugefügt — steigt ab der nächsten Hand ein`);

  const ok = Math.abs(sum - pool) < 0.5;
  const box = document.getElementById('deal-sum-check');
  box.className = 'status-banner ' + (ok ? 'ok' : 'bad');
  box.innerHTML = ok ? `<span class="icon">✓</span><span>${t('match_ok')}</span>` : `<span class="icon">✗</span><span>${t('err_deal_sum',{sum:formatMoney(sum),expected:formatMoney(pool)})}</span>`;

async function submitDeal(sessionId){
  if(!canWrite()) return;
  const s = getSession(sessionId);
  const pool = remainingPool(s);
  const inputs = Array.from(document.querySelectorAll('.deal-amount-input'));
  const sum = inputs.reduce((a,inp) => a + Number(inp.value||0), 0);
  if(Math.abs(sum - pool) >= 0.5) return;
  const inPlay = s.participants.filter(p => p.finishRank == null)
    .sort((a,b) => Number(b.chipCount||0) - Number(a.chipCount||0));
  const baseRank = inPlay.length;
  inputs.forEach(inp => {
    const p = s.participants.find(x => x.playerId === inp.dataset.player);
    p.dealtPayout = Number(inp.value || 0);
  });
  inPlay.forEach((p, idx) => {
    p.finishRank = idx + 1;
    p.active = false;
  });
  await saveClubData();
  closeModal();
  render();
}

function deleteSessionPrompt(sessionId){
  if(!canWrite()) return;
  const s = getSession(sessionId);
  if(!s) return;
  const handCount = currentClub.hands.filter(h => h.sessionId===sessionId).length;
  const hasBuyIns = s.participants.some(p => (p.buyIns||[]).length>0);
  if(handCount===0 && !hasBuyIns){
    reallyDeleteSession(sessionId);

  }
  const parts = [];
  if(handCount>0) parts.push(`${handCount} erfasste Hand${handCount===1?'':'en'}`);
  if(hasBuyIns) parts.push('erfasste Buy-ins');
  showConfirmModal(
    `Diese Session hat bereits ${parts.join(' und ')}. Wirklich unwiderruflich löschen? Das kann nicht rückgängig gemacht werden.`,
    `reallyDeleteSession('${sessionId}')`,
    'Endgültig löschen'
  );
}
async function reallyDeleteSession(sessionId){
  if(!canWrite()) return;
  currentClub.sessions = currentClub.sessions.filter(s => s.id !== sessionId);
  currentClub.hands = currentClub.hands.filter(h => h.sessionId !== sessionId);
  (currentClub.events||[]).forEach(ev => { if(ev.linkedSessionId===sessionId) ev.linkedSessionId = null; });
  if(currentSessionId===sessionId) currentSessionId = null;
  await saveClubData();
  showToast('✓ Session gelöscht');
  render();
}

function playerStats(playerId, filter, applyDashFilters){
  filter = filter || 'all';
  let sessionsPlayed = 0, totalNet = 0, best = null, worst = null;
  let itmCount = 0, rankedCount = 0, bestFinish = null;
  let cashSessionsCount = 0, totalBbWon = 0;
  currentClub.sessions.forEach(s => {
    if(filter !== 'all' && s.type !== filter) return;
    if(applyDashFilters && !sessionMatchesDashFilters(s)) return;
    const p = s.participants.find(x => x.playerId === playerId);
    if(!p) return;
    sessionsPlayed++;
    const net = netForSession(s, p);
    if(net !== null){
      totalNet += net;
      if(best === null || net > best) best = net;
      if(worst === null || net < worst) worst = net;
      if(s.type==='cash' && s.bb){ cashSessionsCount++; totalBbWon += net / s.bb; }
    }
    if(s.type==='tournament' && p.finishRank != null){
      rankedCount++;
      if(p.finishRank <= paidPlacesCount(s)) itmCount++;
      if(bestFinish === null || p.finishRank < bestFinish) bestFinish = p.finishRank;
    }
  });
  ensureClubDefaults();
  const estimatedHands = cashSessionsCount * (currentClub.avgHandsPerCashSession||30);
  const bb100 = estimatedHands>0 ? (totalBbWon / estimatedHands) * 100 : null;
  return { sessionsPlayed, totalNet, best, worst, itmCount, rankedCount, bestFinish, bb100,
    itmRate: rankedCount ? Math.round(itmCount/rankedCount*100) : null };
}

async function submitEditPlayer(id){
  if(!canWrite()) return;
  const p = getPlayer(id);
  const firstName = document.getElementById('ep-first').value.trim();
  const lastName = document.getElementById('ep-last').value.trim();
  if(!firstName || !lastName){ document.getElementById('ep-error').innerHTML = `<div class="error-msg">${t('err_need_names')}</div>`; return; }
  const speciesVal = document.getElementById('player-species-input').value;
  p.firstName = firstName; p.lastName = lastName;
  p.nickname = document.getElementById('ep-nick').value.trim();
  p.avatarColor = document.getElementById('player-color-input').value;
  p.avatarSpecies = speciesVal==='' ? null : Number(speciesVal);
  p.avatarPhoto = document.getElementById('player-photo-input').value || null;
  p.avatarCutout = !!document.getElementById('player-photo-cutout-input').value;
  p.note = document.getElementById('ep-note').value.trim();
  p.groups = readCheckedGroups();
  if(isClubAdmin()){
    const linkInput = document.getElementById('ep-linked-email');
    if(linkInput){
      const email = linkInput.value.trim().toLowerCase();
      if(email && currentClub.players.some(x => x.id !== id && (x.linkedEmail||'').toLowerCase() === email)){
        document.getElementById('ep-error').innerHTML = `<div class="error-msg">Diese E-Mail ist bereits einem anderen Spieler zugeordnet.</div>`;
        return;
      }
      p.linkedEmail = email || null;
    }
  }
  await saveClubData();
  closeModal();
  render();
}
async function archivePlayer(id){ if(!canWrite()) return; getPlayer(id).archived = true; await saveClubData(); render(); }
async function unarchivePlayer(id){ if(!canWrite()) return; getPlayer(id).archived = false; await saveClubData(); render(); }
async function deletePlayerPermanently(id){
  if(!canWrite()) return;
  const p = getPlayer(id);
  if(!p) return;
  const sessionsWithPlayer = currentClub.sessions.filter(s => s.participants && s.participants.some(x => x.playerId===id)).length;
  const warning = sessionsWithPlayer > 0
    ? `"${fullName(p)}" war an ${sessionsWithPlayer} Session(s) beteiligt — in alten Hände-Verläufen erscheint er danach als "Gelöschter Spieler". `
    : '';
  if(!confirm(`${warning}"${fullName(p)}" wirklich UNWIDERRUFLICH löschen? Das kann nicht rückgängig gemacht werden.`)) return;
  const idx = currentClub.players.findIndex(x => x.id===id);
  if(idx>=0) currentClub.players.splice(idx,1);
  await saveClubData();
  render();
}

function applyEventTemplate(templateId){
  const tpl = (currentClub.eventTemplates||[]).find(t => t.id === templateId);
  if(!tpl) return;
  const titleEl = document.getElementById('ev-title');
  const locEl = document.getElementById('ev-location');
  const timeEl = document.getElementById('ev-time');
  const typeEl = document.getElementById('ev-type');
  const descEl = document.getElementById('ev-desc');
  if(titleEl) titleEl.value = tpl.name || '';
  if(locEl) locEl.value = tpl.location || '';
  if(timeEl) timeEl.value = tpl.time || '';

async function confirmCreateEvent(){
  if(!canWrite()) return;
  const errBox = document.getElementById('ev-error');
  const titleEl = document.getElementById('ev-title');
  const dateEl = document.getElementById('ev-date');
  if(!titleEl || !dateEl){
    if(errBox) errBox.innerHTML = `<div class="error-msg">Formular konnte nicht gelesen werden — bitte Fenster schliessen und nochmal öffnen.</div>`;
    return;
  }
  const title = (titleEl.value||'').trim();
  const date = dateEl.value||'';
  if(!title || !date){
    if(errBox) errBox.innerHTML = `<div class="error-msg">Bitte Titel und Datum angeben.</div>`;
    return;
  }
  const timeEl = document.getElementById('ev-time');
  const locEl = document.getElementById('ev-location');
  const typeEl = document.getElementById('ev-type');
  const descEl = document.getElementById('ev-desc');
  const tplCheckEl = document.getElementById('ev-save-template');
  const time = timeEl ? timeEl.value : '';
  const location = locEl ? locEl.value.trim() : '';
  const type = typeEl ? typeEl.value : 'cash';
  const description = descEl ? descEl.value.trim() : '';
  ensureClubExtras();
  currentClub.events.push({ id: uid(), title, date, time, location, type, description, rsvps:{}, linkedSessionId:null, createdAt:new Date().toISOString() });
  if(tplCheckEl && tplCheckEl.checked){
    currentClub.eventTemplates.push({ id: uid(), name: title, location, time, type, description });
  }
  closeModal();
  render();
  const isPast = new Date(date) < new Date(todayLocalISO());
  showToast(isPast ? `✓ Event erstellt (unter "Vergangene Events", da das Datum in der Vergangenheit liegt)` : '✓ Event erstellt');
  try{ await saveClubData(); } catch(e){ console.error('saveClubData failed after event create', e); }
}

async function changeMemberRole(membershipId, newRole){
  if(!isClubAdmin()){ alert('Nur die Rolle "App gestaltend" darf das.'); return; }

  showToast('Rolle aktualisiert.');
  clubMembersLoadedFor = null;
  render();
}
async function approveJoinRequest(requestId, role){
  if(!isClubAdmin()){ alert('Nur die Rolle "App gestaltend" darf das.'); return; }
  const { error } = await sb.rpc('approve_join_request', { p_request_id: requestId, p_role: role });
  if(error){ showToast('Fehler: ' + error.message); return; }
  showToast('Beitritt freigegeben.');
  clubMembersLoadedFor = null;
  render();
}
async function removeMember(membershipId){
  if(!isClubAdmin()){ alert('Nur die Rolle "App gestaltend" darf das.'); return; }
  if(!confirm('Dieses Mitglied wirklich aus dem Club entfernen?')) return;
  const { error } = await sb.from('club_memberships').delete().eq('id', membershipId);
  if(error){ showToast('Fehler: ' + error.message); return; }
  clubMembersLoadedFor = null;
  render();
}

function exportClubBackup(){
  const payload = {
    exportedAt:new Date().toISOString(), code:currentCode, club:currentClub,
    layoutTemplates, tableAssets, customTableThemes, tableSettings
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `poker-club-backup-${currentCode}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('backup-status').innerHTML = `<span style="color:var(--green);font-weight:600;">✓ Backup heruntergeladen (inkl. Layouts, Chip-Vorlagen, Tisch-Design).</span>`;
}
let pendingBackupImport = null;
async function importClubBackup(file){
  if(!isClubAdmin()){ alert('Nur die Rolle "App gestaltend" darf das.'); return; }
  const statusEl = document.getElementById('backup-status');
  if(!file){ return; }
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const club = payload.club || payload;
    if(!club || !club.info){ throw new Error('Keine gültige Backup-Datei.'); }
    pendingBackupImport = { club, payload };
    const extras = [];
    if(payload.layoutTemplates && payload.layoutTemplates.length) extras.push(`${payload.layoutTemplates.length} Layout(s)`);
    if(payload.tableAssets && payload.tableAssets.chips && payload.tableAssets.chips.length) extras.push('Chip-Vorlagen');
    if(payload.customTableThemes && payload.customTableThemes.length) extras.push('Tisch-Designs');
    const extrasText = extras.length ? ` Enthält zusätzlich: ${extras.join(', ')}.` : '';
    showConfirmModal(`Backup von "${club.info.name}" (${payload.exportedAt ? new Date(payload.exportedAt).toLocaleString(locale()) : 'unbekanntes Datum'}) einspielen? Der aktuelle Stand dieses Clubs wird überschrieben.${extrasText}`, 'confirmBackupImport()', 'Einspielen');
  } catch(e){
    statusEl.innerHTML = `<span style="color:var(--red);font-weight:600;">✕ Konnte Datei nicht lesen: ${escapeHtml(e.message)}</span>`;
  }
}
async function confirmBackupImport(){
  if(!isClubAdmin()){ alert('Nur die Rolle "App gestaltend" darf das.'); return; }
  if(!pendingBackupImport) return;
  const { club, payload } = pendingBackupImport;
  currentClub = club;
  ensureClubDefaults();
  // Ältere Backups (vor der Umstellung auf currentClub.tableLayouts) tragen die Layouts noch separat
  // im payload statt im club-Objekt selbst — hier übernehmen und layoutTemplates neu referenzieren,
  // weil currentClub gerade komplett ersetzt wurde (alte Referenz zeigt sonst ins Leere).
  if(payload.layoutTemplates && payload.layoutTemplates.length){
    currentClub.tableLayouts = payload.layoutTemplates;
  }
  layoutTemplates = currentClub.tableLayouts;
  await saveClubData();
  if(payload.tableAssets){
    tableAssets = payload.tableAssets;
    await saveTableAssetsList();
  }
  if(payload.customTableThemes){
    customTableThemes = payload.customTableThemes;
    await saveCustomTableThemesList();
  }
  if(payload.tableSettings){
    tableSettings = {...tableSettings, ...payload.tableSettings};
    await saveTableSettings();
  }
  if(payload.code && payload.code !== currentCode){
    await rememberClub(currentCode, currentClub.info.name);
  }
  pendingBackupImport = null;
  render();
  const statusEl = document.getElementById('backup-status');
  if(statusEl) statusEl.innerHTML = `<span style="color:var(--green);font-weight:600;">✓ Backup erfolgreich eingespielt (inkl. Layouts, Chip-Vorlagen, Tisch-Design).</span>`;
}

async function submitTemplate(){
  if(!isClubAdmin()) return;
  const name = document.getElementById('tpl-name').value.trim();
  const mode = document.getElementById('tpl-mode').value;
  const places = readPlacesFromDom();
  if(!name){ document.getElementById('tpl-error').innerHTML = `<div class="error-msg">${t('err_need_template_name')}</div>`; return; }
  if(mode==='percent'){
    const sum = places.reduce((a,b)=>a+b,0);
    if(Math.abs(sum-100) > 0.5){ document.getElementById('tpl-error').innerHTML = `<div class="error-msg">${t('err_percent_sum',{sum:sum})}</div>`; return; }
  }
  const idx = currentClub.payoutTemplates.findIndex(x => x.id === editingTemplate.id);
  const saved = { id: editingTemplate.id, name, mode, places };
  if(idx>=0) currentClub.payoutTemplates[idx] = saved; else currentClub.payoutTemplates.push(saved);
  await saveClubData();
  editingTemplate = null;
  closeModal();
  render();
}

async function submitBetGrid(){
  if(!isClubAdmin()) return;
  const name = document.getElementById('bg-name').value.trim();
  const type = document.getElementById('bg-type').value;
  const errBox = document.getElementById('bg-error');
  if(!name){ errBox.innerHTML = `<div class="error-msg">Bitte einen Namen eingeben.</div>`; return; }
  const targetSb = type==='cash' ? Number(document.getElementById('bg-target-sb').value)||0 : null;
  if(type==='cash' && targetSb<=0){ errBox.innerHTML = `<div class="error-msg">Bitte einen gültigen Small Blind angeben.</div>`; return; }
  const multiples = readBetGridMultiplesFromDom();
  const rappenbetsEnabled = document.getElementById('bg-rappenbets').checked;
  const count = rappenbetsEnabled ? (Number(document.getElementById('bg-count').value)||0) : 0;
  if(rappenbetsEnabled && count<1){ errBox.innerHTML = `<div class="error-msg">Mindestens 1 Rappenbet-Stufe nötig.</div>`; return; }
  if(!multiples.length && !rappenbetsEnabled){ errBox.innerHTML = `<div class="error-msg">Mindestens eine Stufe oder Rappenbets nötig.</div>`; return; }
  const saved = { id: editingBetGrid.id, name, type, targetSb, multiples, rappenbetsEnabled, count };
  const idx = currentClub.betGridProfiles.findIndex(x => x.id === editingBetGrid.id);
  if(idx>=0) currentClub.betGridProfiles[idx] = saved; else currentClub.betGridProfiles.push(saved);
  await saveClubData();
  editingBetGrid = null;
  closeModal();
  render();
}

function resolveAvatarDisplay(p){
  // Spieler, die über "Automatisch zuweisen" ein Galerie-Bild bekommen haben, speichern nur noch eine
  // Referenz (avatarId) statt das komplette Bild zu kopieren — verhindert, dass sich dieselbe
  // Bilddatei bei vielen Spielern dupliziert und das Speicherlimit sprengt.
  if(p && p.avatarId){
    const a = (currentClub.customAvatars||[]).find(x => x.id === p.avatarId);
    if(a) return { avatarPhoto: a.photo, avatarCutout: !!a.cutout };
  }
  return { avatarPhoto: p ? p.avatarPhoto : null, avatarCutout: p ? !!p.avatarCutout : false };
}
async function autoAssignAvatarsToPlayers(){
  if(!isClubAdmin()) return;
  ensureClubDefaults();
  const avatars = currentClub.customAvatars;
  if(!avatars.length) return;
  currentClub.players.forEach((p, i) => {
    const a = avatars[i % avatars.length];
    // Nur noch eine Referenz speichern (avatarId), nicht mehr das ganze Bild pro Spieler duplizieren.
    p.avatarId = a.id;
    delete p.avatarPhoto;
    delete p.avatarCutout;
  });
  await saveClubData();
  showToast(`✓ ${currentClub.players.length} Spielern automatisch Avatare zugewiesen`);
  render();
}
function cleanupDuplicatedAvatarData(){
  // Räumt bereits entstandene Dopplungen aus früheren Aufrufen auf: Wenn ein Spieler-Avatarbild exakt
  // einem Galerie-Bild entspricht, wird es durch eine schlanke Referenz ersetzt statt das komplette
  // Bild weiter doppelt zu speichern. Läuft automatisch beim Öffnen der Avatar-Galerie.
  const avatars = currentClub.customAvatars || [];
  if(!avatars.length || !currentClub.players) return false;
  let changed = false;
  currentClub.players.forEach(p => {
    if(p.avatarPhoto && !p.avatarId){
      const match = avatars.find(a => a.photo === p.avatarPhoto);
      if(match){
        p.avatarId = match.id;
        delete p.avatarPhoto;
        delete p.avatarCutout;
        changed = true;
      }
    }
  });
  return changed;
}

let handsSelectedSessionId = null;

function renderHands(){
  const sessions = [...currentClub.sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(handsSelectedSessionId && !sessions.find(s => s.id === handsSelectedSessionId)) handsSelectedSessionId = null;
  if(!handsSelectedSessionId && sessions.length) handsSelectedSessionId = sessions[0].id;
  const s = handsSelectedSessionId ? getSession(handsSelectedSessionId) : null;

function seatSlotForDirection(raw, dir){
  let best = 0;
  const better = (p, q) => {
    if(dir==='bottom') return p.top > q.top + 0.01 || (Math.abs(p.top-q.top) <= 0.01 && Math.abs(p.left-50) < Math.abs(q.left-50));
    if(dir==='top')    return p.top < q.top - 0.01 || (Math.abs(p.top-q.top) <= 0.01 && Math.abs(p.left-50) < Math.abs(q.left-50));
    if(dir==='left')   return p.left < q.left - 0.01 || (Math.abs(p.left-q.left) <= 0.01 && Math.abs(p.top-50) < Math.abs(q.top-50));
    return p.left > q.left + 0.01 || (Math.abs(p.left-q.left) <= 0.01 && Math.abs(p.top-50) < Math.abs(q.top-50));
  };
  raw.forEach((p,i) => { if(better(p, raw[best])) best = i; });

}

  const n = raw.length;

  const B = seatSlotForDirection(raw, 'bottom');
  let rot = 0;
  if(pref.hero && mySlot != null && mySlot >= 0 && mySlot < n){
    const target = (pref.target != null && pref.target < n) ? pref.target : seatSlotForDirection(raw, pref.pos || 'bottom');
    rot = (((target - mySlot) % n) + n) % n;
  }
  const R = raw.map((_, a) => raw[(a + rot) % n]);
  R.viewMeta = { n, key, bottom: B, rot };

}

    posStyle = `position:absolute;left:${slot.boxX}%;top:${slot.boxY}%;transform:translate(-50%,-50%);z-index:${zIndex};`;
  } else {
    const scaleStyle = boxScale!==1 ? `transform:scale(${boxScale});transform-origin:top center;` : '';
    posStyle = `margin-top:${-overlap}px;${scaleStyle}`;
  }
  if(slot && slot.boxHidden){
    return `${posStyle}background:none;border:none;box-shadow:none;padding:2px 0;`;
  }
  if(slot && slot.boxImage){
    // Ebenfalls prozentual zur Tischbreite (statt fixer 92×132px), Seitenverhältnis via aspect-ratio.
    // boxScale ist jetzt Teil der Breiten-Berechnung selbst (9.9% * boxScale), nicht mehr per
    // separatem transform:scale() — dieselbe Methode wie beim Avatar (6.2% * avatarScale).
    const widthPct = absolute ? (9.9*boxScale).toFixed(2) : 9.9;
    return `${posStyle}width:${widthPct}%;aspect-ratio:${slot.boxImageAspect || '92/132'};background:none;background-image:url('${slot.boxImage}');background-size:contain;background-position:center;background-repeat:no-repeat;border:none;box-shadow:none;border-radius:0;box-sizing:border-box;`;
  }
  // Kein eigenes Sitzgrafik-Bild hochgeladen: Name/Stack sitzen jetzt ohnehin unabhängig daneben —
  // dieser Container bleibt dann komplett unsichtbar, statt eine leere Standard-Box zu zeigen.
  return `${posStyle}background:none;border:none;box-shadow:none;padding:0;min-width:0;width:0;height:0;overflow:visible;`;

function darkenColor(hex, amount){
  const {r,g,b} = hexToRgbParts(hex);
  const f = 1-amount;
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}
function lightenColor(hex, amount){
  const {r,g,b} = hexToRgbParts(hex);
  const l = v => Math.round(v + (255-v)*amount);
  return `rgb(${l(r)},${l(g)},${l(b)})`;
}
function hexToRgba(hex, alpha){
  const {r,g,b} = hexToRgbParts(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

let boxAspectDetectionInProgress = new Set();
function ensureBoxImageAspect(layout){
  // Selbstheilung für ältere Layouts (z.B. aus einem alten Backup): Wenn eine Sitzgrafik vorhanden
  // ist, aber ihr echtes Seitenverhältnis fehlt (Feld gab es damals noch nicht), im Hintergrund aus
  // dem Bild selbst nachmessen und ergänzen — statt dauerhaft auf dem falschen 92:132-Standard hängen
  // zu bleiben, sobald ein altes Backup eingespielt wird. Gilt für Editor UND echten Tisch gleichermassen.
  if(!layout || !layout.boxImage || layout.boxImageAspect || boxAspectDetectionInProgress.has(layout.id)) return;
  boxAspectDetectionInProgress.add(layout.id);
  const img = new Image();
  img.onload = () => {
    layout.boxImageAspect = `${img.naturalWidth}/${img.naturalHeight}`;
    boxAspectDetectionInProgress.delete(layout.id);
    saveLayoutTemplatesList();
    render();
  };
  img.onerror = () => { boxAspectDetectionInProgress.delete(layout.id); };
  img.src = layout.boxImage;
}
function ensureActiveLayoutForEdit(s){
  let layout = getActiveLayout(s.id);
  if(!layout){
    // Absicherung: sollte durch startTableEditMode eigentlich nie mehr passieren, aber falls doch
    // (z.B. Layout zwischenzeitlich gelöscht), lieber ein benanntes Layout anlegen als crashen.
    const seatCount = resolveTotalSlots(s);
    const roundedCount = seatCount > 6 ? 10 : (seatCount > 2 ? 6 : 2);
    layout = newLayoutTemplateObj('Neues Layout', roundedCount);
    layoutTemplates.push(layout);
    saveLayoutTemplatesList();
    if(!tableSettings.sessionLayoutMap) tableSettings.sessionLayoutMap = {};
    tableSettings.sessionLayoutMap[s.id] = layout.id;
    saveTableSettings();
  }
  // Absicherung für ältere Layouts, die vor der Einführung neuerer Elemente (z.B. Positions-Tag)
  // angelegt wurden: fehlende clusterOffsets-Felder gleich beim Öffnen mit den aktuellen Standardwerten
  // auffüllen. Verhindert, dass ein neues Feld beim allerersten Ziehen als "undefined" gelesen wird
  // (führt sonst zu einer ungültigen Position, die der Browser stillschweigend ignoriert — die
  // anderen Sitze bewegen sich dann scheinbar gar nicht mit).
  layout.clusterOffsets = getClusterOffsets(layout);
  ensureBoxImageAspect(layout);
  // Fehlende Sitzplätze (Layout ursprünglich für weniger Sitze angelegt, Session braucht jetzt mehr)
  // dauerhaft ins Layout übernehmen — sonst blieben sie beim gemeinsamen Grössen-Regler unberücksichtigt
  // (der nur bereits gespeicherte Sitze aktualisiert), egal wie oft man den Regler bewegt.
  const neededSeats = resolveTotalSlots(s);
  if(layout.seats.length < neededSeats){
    const ref = layout.seats[0] || {};
    seatPositions(neededSeats).slice(layout.seats.length).forEach(p => {
      const slot = defaultSeatSlot(p.left, p.top);
      ['avatarScale','boxScale','nameScale','stackScale','holeCardsScale','posTagScale'].forEach(f => {
        if(ref[f] != null) slot[f] = ref[f];
      });
      layout.seats.push(slot);
    });
    layout.seatCount = neededSeats;
    saveLayoutTemplatesList();
  }
  return layout;
}

  tableEditSelected = { type, index };
